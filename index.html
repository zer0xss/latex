<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathForge</title>

<script>
window.MathJax = {
    tex: {
        inlineMath: [
            ['\\(', '\\)'],
            ['$', '$']
        ],
        displayMath: [
            ['\\[', '\\]'],
            ['$$', '$$']
        ],
        processEscapes: false,
        processEnvironments: true
    },
    options: {
        skipHtmlTags: [
            'script',
            'noscript',
            'style',
            'textarea',
            'pre',
            'code'
        ]
    },
    svg: {
        fontCache: 'global'
    }
};
</script>

<script
src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
async>
</script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg:#f5f6f8;
    --panel:#fff;
    --text:#171717;
    --muted:#777;
    --border:#dedede;
    --accent:#4f46e5;
    --danger:#ef4444;
}

body.dark {
    --bg:#111216;
    --panel:#191a1f;
    --text:#f5f5f5;
    --muted:#aaa;
    --border:#30323a;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

header {
    height:56px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo {
    font-size:19px;
    font-weight:800;
}

.logo span {
    color:var(--accent);
}

.header-right {
    display:flex;
    align-items:center;
    gap:7px;
}

button {
    font:inherit;
}

.btn {
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
}

.btn:hover {
    border-color:var(--accent);
}

.primary {
    background:var(--accent);
    border-color:var(--accent);
    color:white;
}

.status {
    font-size:11px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:5px;
}

.dot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:#16a34a;
}

.dot.dirty {
    background:#f59e0b;
}

/* ==============================
   전체 레이아웃
============================== */

.layout {
    max-width:1500px;
    margin:auto;
    padding:8px;

    display:grid;

    /*
       입력칸과 미리보기를
       최대한 가깝게
    */
    grid-template-columns:
        190px
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap:4px;
}

/* ==============================
   패널
============================== */

.panel {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
}

.panel-header {
    height:44px;
    padding:0 12px;
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.title {
    font-size:14px;
    font-weight:750;
}

.panel-body {
    padding:10px;
}

/* ==============================
   입력
============================== */

.field {
    margin-bottom:10px;
}

label {
    display:block;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    margin-bottom:5px;
}

input,
textarea {
    width:100%;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel);
    color:var(--text);
    padding:8px;
    outline:none;
}

input:focus,
textarea:focus {
    border-color:var(--accent);
}

.row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

/* ==============================
   문제 입력창
============================== */

#question {
    width:100%;
    min-height:560px;
    resize:vertical;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

    font-size:14px;
    line-height:1.7;
}

/* ==============================
   툴바
============================== */

.toolbar {
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:5px;
}

.tool {
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:6px;
    padding:5px 8px;
    cursor:pointer;
    font-size:11px;
}

.tool:hover {
    border-color:var(--accent);
    color:var(--accent);
}

/* ==============================
   미리보기
============================== */

.preview {
    min-height:680px;
    padding:16px 18px;
    overflow-x:auto;

    font-size:17px;
    line-height:1.9;
}

.preview-content {
    white-space:pre-wrap;
    word-break:break-word;
}

/*
   MathJax 오류는 빨간색
*/
mjx-merror {
    color:#ef4444 !important;
}

/* ==============================
   문제 목록
============================== */

.problem-list {
    max-height:calc(100vh - 100px);
    overflow-y:auto;
}

.search {
    margin-bottom:5px;
}

.problem {
    padding:9px 10px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.problem:hover {
    background:var(--bg);
}

.problem.active {
    background:rgba(79,70,229,.1);
}

.problem-title {
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.problem-meta {
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

/* ==============================
   유형
============================== */

.types {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
}

.type {
    padding:7px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    font-size:12px;
}

.type.active {
    background:var(--accent);
    border-color:var(--accent);
    color:white;
}

/* ==============================
   선택지
============================== */

.choice-row {
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:5px;
}

.choice-row input[type="radio"] {
    width:auto;
}

.choice-input {
    flex:1;
}

.remove {
    width:30px;
    height:32px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--danger);
    border-radius:6px;
    cursor:pointer;
}

/* ==============================
   선택지 미리보기
============================== */

.choices-preview {
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.choice-preview {
    display:flex;
    align-items:flex-start;
    gap:9px;
}

.choice-number {
    width:25px;
    height:25px;
    min-width:25px;

    border:1px solid var(--border);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
}

/* ==============================
   기타
============================== */

.hidden {
    display:none;
}

.toast {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translate(-50%,20px);
    opacity:0;

    background:#222;
    color:white;

    padding:9px 14px;
    border-radius:8px;

    transition:.2s;
    pointer-events:none;
}

.toast.show {
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:1050px) {

    .layout {
        grid-template-columns:
            180px
            minmax(0,1fr);
    }

    .preview-panel {
        grid-column:1/-1;
    }
}

@media(max-width:700px) {

    .layout {
        display:flex;
        flex-direction:column;
    }

    .preview-panel {
        order:3;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Math<span>Forge</span>
    </div>

    <div class="header-right">

        <div class="status" id="status">
            <span class="dot"></span>
            <span>저장됨</span>
        </div>

        <button class="btn" onclick="newProblem()">
            ＋ 새 문제
        </button>

        <button class="btn" onclick="toggleDark()">
            ◐
        </button>

    </div>

</header>


<div class="layout">

<!-- =========================================
     문제 목록
========================================= -->

<section class="panel">

    <div class="panel-header">

        <div class="title">
            문제
        </div>

        <button class="btn" onclick="newProblem()">
            ＋
        </button>

    </div>

    <div class="panel-body">

        <input
            id="search"
            class="search"
            placeholder="문제 검색">

    </div>

    <div
        id="problemList"
        class="problem-list">
    </div>

</section>


<!-- =========================================
     입력
========================================= -->

<section class="panel">

    <div class="panel-header">

        <div class="title">
            문제 입력
        </div>

    </div>

    <div class="panel-body">

        <div class="row">

            <div class="field">

                <label>번호</label>

                <input
                    id="number"
                    type="number">

            </div>

            <div class="field">

                <label>배점</label>

                <input
                    id="score"
                    type="number">

            </div>

        </div>


        <div class="field">

            <label>문제 유형</label>

            <div class="types">

                <button
                    id="multiple"
                    class="type active"
                    onclick="setType('multiple')">
                    객관식
                </button>

                <button
                    id="short"
                    class="type"
                    onclick="setType('short')">
                    주관식
                </button>

            </div>

        </div>


        <div class="field">

            <label>문제</label>

            <div class="toolbar">

                <button
                    class="tool"
                    onclick="insert('\\frac{}{}')">
                    frac
                </button>

                <button
                    class="tool"
                    onclick="insert('\\sqrt{}')">
                    √
                </button>

                <button
                    class="tool"
                    onclick="insert('\\lim_{n\\to\\infty}')">
                    lim
                </button>

                <button
                    class="tool"
                    onclick="insert('\\sum_{k=1}^{n}')">
                    Σ
                </button>

                <button
                    class="tool"
                    onclick="insert('\\int')">
                    ∫
                </button>

                <button
                    class="tool"
                    onclick="insert('x^2')">
                    x²
                </button>

                <button
                    class="tool"
                    onclick="insert('\\pi')">
                    π
                </button>

            </div>

            <textarea
                id="question"
                spellcheck="false"
                placeholder="문제를 입력하세요.&#10;&#10;예: 함수 f(x)=x^2+1에 대하여&#10;\\lim_{x\\to0}\\frac{\\sin x}{x}의 값을 구하여라.">
            </textarea>

        </div>


        <div
            id="choiceArea"
            class="field">

            <label>선택지</label>

            <div id="choices"></div>

            <button
                class="btn"
                onclick="addChoice()">
                ＋ 선택지
            </button>

        </div>


        <div
            id="answerArea"
            class="field hidden">

            <label>정답</label>

            <input
                id="answer"
                placeholder="정답">

        </div>


        <div style="display:flex;gap:5px;">

            <button
                class="btn primary"
                onclick="save(true)">
                저장
            </button>

            <button
                class="btn"
                onclick="duplicate()">
                복제
            </button>

            <button
                class="btn"
                onclick="removeProblem()">
                삭제
            </button>

        </div>

    </div>

</section>


<!-- =========================================
     미리보기
========================================= -->

<section class="panel preview-panel">

    <div class="panel-header">

        <div class="title">
            미리보기
        </div>

        <div style="font-size:10px;color:#16a34a;">
            LIVE
        </div>

    </div>

    <div
        id="preview"
        class="preview">

        <div
            id="previewContent"
            class="preview-content">
        </div>

    </div>

</section>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =====================================================
   DATA
===================================================== */

let problems = [];
let currentId = null;
let currentType = "multiple";

let saveTimer = null;
let renderTimer = null;


/* =====================================================
   INIT
===================================================== */

function init() {

    const stored =
        localStorage.getItem(
            "mathforge-problems"
        );

    if(stored) {

        try {
            problems = JSON.parse(stored);
        }
        catch {
            problems = [];
        }

    }

    if(
        !Array.isArray(problems) ||
        problems.length === 0
    ) {

        problems = [

            {
                id:Date.now(),

                number:1,

                score:5,

                type:"multiple",

                question:
`함수 f(x)=x^2+1에 대하여

\\lim_{x\\to0}\\frac{\\sin x}{x}

의 값을 구하여라.`,

                choices:[
                    "0",
                    "1",
                    "2",
                    "3",
                    "4"
                ],

                answer:1,

                shortAnswer:""
            }

        ];

        localStorage.setItem(
            "mathforge-problems",
            JSON.stringify(problems)
        );

    }

    currentId =
        problems[0].id;

    loadProblem(currentId);

    renderList();

}


/* =====================================================
   CURRENT
===================================================== */

function getCurrent() {

    return problems.find(
        p => p.id === currentId
    );

}


/* =====================================================
   LOAD
===================================================== */

function loadProblem(id) {

    const p =
        problems.find(
            x => x.id === id
        );

    if(!p) return;

    currentId = id;

    currentType =
        p.type || "multiple";

    document.getElementById(
        "number"
    ).value =
        p.number ?? 1;

    document.getElementById(
        "score"
    ).value =
        p.score ?? 5;

    document.getElementById(
        "question"
    ).value =
        p.question || "";

    document.getElementById(
        "answer"
    ).value =
        p.shortAnswer || "";

    renderChoices(
        p.choices || []
    );

    updateTypeButtons();

    renderList();

    renderPreview();

}


/* =====================================================
   READ FORM
===================================================== */

function readForm() {

    return {

        number:
            Number(
                document.getElementById(
                    "number"
                ).value
            ) || 1,

        score:
            Number(
                document.getElementById(
                    "score"
                ).value
            ) || 0,

        type:currentType,

        question:
            document.getElementById(
                "question"
            ).value,

        choices:
            [
                ...document.querySelectorAll(
                    "#choices .choice-input"
                )
            ].map(
                x => x.value
            ),

        shortAnswer:
            document.getElementById(
                "answer"
            ).value

    };

}


/* =====================================================
   SAVE
===================================================== */

function save(showToast=false) {

    const p = getCurrent();

    if(!p) return;

    Object.assign(
        p,
        readForm()
    );

    localStorage.setItem(
        "mathforge-problems",
        JSON.stringify(problems)
    );

    setSaved();

    renderList();

    if(showToast) {
        toast("저장되었습니다.");
    }

}


/* =====================================================
   AUTO SAVE
===================================================== */

function autoSave() {

    setDirty();

    clearTimeout(saveTimer);

    saveTimer =
        setTimeout(
            () => save(false),
            400
        );

}


/* =====================================================
   STATUS
===================================================== */

function setDirty() {

    document.getElementById(
        "status"
    ).innerHTML = `
        <span class="dot dirty"></span>
        <span>저장 중...</span>
    `;

}

function setSaved() {

    document.getElementById(
        "status"
    ).innerHTML = `
        <span class="dot"></span>
        <span>저장됨</span>
    `;

}


/* =====================================================
   TYPE
===================================================== */

function setType(type) {

    currentType = type;

    updateTypeButtons();

    renderPreview();

    autoSave();

}


function updateTypeButtons() {

    document
        .getElementById("multiple")
        .classList.toggle(
            "active",
            currentType === "multiple"
        );

    document
        .getElementById("short")
        .classList.toggle(
            "active",
            currentType === "short"
        );

    document
        .getElementById("choiceArea")
        .classList.toggle(
            "hidden",
            currentType !== "multiple"
        );

    document
        .getElementById("answerArea")
        .classList.toggle(
            "hidden",
            currentType !== "short"
        );

}


/* =====================================================
   CHOICES
===================================================== */

function renderChoices(values) {

    const box =
        document.getElementById(
            "choices"
        );

    box.innerHTML = "";

    values.forEach(
        (value,index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "choice-row";

            const radio =
                document.createElement(
                    "input"
                );

            radio.type = "radio";
            radio.name = "correct";

            const p =
                getCurrent();

            radio.checked =
                p &&
                p.answer === index;

            radio.onchange = () => {

                if(p) {
                    p.answer = index;
                }

                autoSave();
                renderPreview();

            };


            const input =
                document.createElement(
                    "input"
                );

            input.type = "text";

            input.className =
                "choice-input";

            input.value =
                value;

            input.oninput = () => {

                renderPreview();
                autoSave();

            };


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "remove";

            remove.textContent = "×";

            remove.onclick = () => {

                const arr =
                    getChoices();

                arr.splice(
                    index,
                    1
                );

                if(arr.length === 0) {
                    arr.push("");
                }

                renderChoices(arr);

                renderPreview();

                autoSave();

            };


            row.append(
                radio,
                input,
                remove
            );

            box.appendChild(row);

        }
    );

}


function getChoices() {

    return [
        ...document.querySelectorAll(
            "#choices .choice-input"
        )
    ].map(
        x => x.value
    );

}


function addChoice() {

    const arr =
        getChoices();

    arr.push("");

    renderChoices(arr);

    autoSave();

}


/* =====================================================
   NEW
===================================================== */

function newProblem() {

    const p = {

        id:
            Date.now() +
            Math.random(),

        number:
            problems.length + 1,

        score:5,

        type:"multiple",

        question:"",

        choices:[
            "",
            "",
            "",
            "",
            ""
        ],

        answer:0,

        shortAnswer:""

    };

    problems.unshift(p);

    currentId =
        p.id;

    loadProblem(
        p.id
    );

    save();

    toast(
        "새 문제가 생성되었습니다."
    );

}


/* =====================================================
   DUPLICATE
===================================================== */

function duplicate() {

    const p =
        getCurrent();

    if(!p) return;

    const copy =
        JSON.parse(
            JSON.stringify(p)
        );

    copy.id =
        Date.now() +
        Math.random();

    copy.number =
        problems.length + 1;

    problems.unshift(copy);

    currentId =
        copy.id;

    loadProblem(
        copy.id
    );

    save();

    toast(
        "문제를 복제했습니다."
    );

}


/* =====================================================
   DELETE
===================================================== */

function removeProblem() {

    if(problems.length <= 1) {

        toast(
            "최소 한 문제는 있어야 합니다."
        );

        return;

    }

    if(
        !confirm(
            "현재 문제를 삭제할까요?"
        )
    ) return;

    const index =
        problems.findIndex(
            p => p.id === currentId
        );

    problems.splice(
        index,
        1
    );

    const next =
        problems[
            Math.max(
                0,
                index - 1
            )
        ];

    currentId =
        next.id;

    loadProblem(
        currentId
    );

    save();

}


/* =====================================================
   LIST
===================================================== */

function renderList() {

    const list =
        document.getElementById(
            "problemList"
        );

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();

    list.innerHTML = "";

    problems
        .filter(p => {

            const text =
                String(
                    p.question || ""
                )
                .toLowerCase();

            return (
                text.includes(search) ||
                String(
                    p.number
                ).includes(search)
            );

        })
        .forEach(p => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "problem";

            if(
                p.id === currentId
            ) {
                item.classList.add(
                    "active"
                );
            }

            const title =
                (p.question || "")
                .replace(/\n/g," ")
                .slice(0,45);

            item.innerHTML = `
                <div class="problem-title">
                    ${escapeHTML(
                        p.number + ". " +
                        (title || "새 문제")
                    )}
                </div>

                <div class="problem-meta">
                    ${p.score}점 ·
                    ${
                        p.type === "short"
                        ? "주관식"
                        : "객관식"
                    }
                </div>
            `;

            item.onclick =
                () => loadProblem(
                    p.id
                );

            list.appendChild(
                item
            );

        });

}


/* =====================================================
   ★ 핵심 렌더링
===================================================== */

/*
   여기서는 LaTeX를 분석하지 않는다.

   입력:

   함수 f(x)=x^2+1에 대하여
   \lim_{x\to0}\frac{\sin x}{x}

   ↓

   MathJax가 이해할 수 있는 형태로
   전체 내용을 감싼다.

   일반 문자는 MathJax의 \text{}를
   이용한다.
*/


function convertToMathJax(text) {

    /*
       이미 \( \), \[ \], $, $$를
       사용했다면 그대로 둔다.
    */

    if(
        /\\\(|\\\[|\$/.test(text)
    ) {
        return text;
    }


    /*
       LaTeX 명령이 있는 경우
       전체를 수식으로 처리한다.

       단순 일반 글자는 그대로
       일반 HTML 텍스트로 처리한다.
    */

    if(
        /\\(frac|dfrac|tfrac|sqrt|lim|sum|prod|int|oint|sin|cos|tan|log|ln|exp|binom|left|right|begin|end|alpha|beta|gamma|delta|theta|pi|infty|to|cdot|times|pm|le|ge|neq|approx)\b/.test(text)
    ) {

        return "\\(" +
            text +
            "\\)";

    }


    /*
       f(x), f(1), f(2)
       x^2
       2x+1
       x+1
       등 수학식
    */

    if(
        isMathExpression(text)
    ) {

        return "\\(" +
            text +
            "\\)";

    }


    /*
       일반 글자
    */

    return escapeHTML(text);

}


/*
   일반적인 수학식인지 판단
*/

function isMathExpression(text) {

    const s =
        text.trim();

    if(!s) return false;


    /*
       함수

       f(x)
       f(1)
       f(2)
       g(t)
       F(x)
    */

    if(
        /^[A-Za-z]\s*\([^)]*\)$/.test(s)
    ) {
        return true;
    }


    /*
       함수 = 식

       f(x)=x^2
       f(1)=3
    */

    if(
        /^[A-Za-z]\s*\([^)]*\)\s*=/.test(s)
    ) {
        return true;
    }


    /*
       위첨자 / 아래첨자
    */

    if(
        /[A-Za-z0-9)\]]\s*[\^_]/.test(s)
    ) {
        return true;
    }


    /*
       숫자 + 문자

       2x
       3a
       10n
    */

    if(
        /^\d+\s*[A-Za-z]/.test(s)
    ) {
        return true;
    }


    /*
       수학 연산자가 있는 짧은 식
    */

    if(
        /^[0-9A-Za-zπθ]\s*[+\-*\/=<>]\s*[0-9A-Za-zπθ]/.test(s)
    ) {
        return true;
    }


    return false;

}


/* =====================================================
   PREVIEW
===================================================== */

async function renderPreview() {

    const preview =
        document.getElementById(
            "previewContent"
        );

    const data =
        readForm();

    /*
       이전 MathJax 결과를 완전히 제거
    */

    preview.innerHTML = "";


    /*
       번호
    */

    const info =
        document.createElement(
            "div"
        );

    info.style.fontSize =
        "12px";

    info.style.color =
        "var(--muted)";

    info.style.marginBottom =
        "14px";

    info.textContent =
        `${data.number}번 · ${data.score}점`;

    preview.appendChild(
        info
    );


    /*
       문제

       줄 단위로 처리해서
       일반 글자도 반드시 표시한다.
    */

    const question =
        document.createElement(
            "div"
        );

    const lines =
        data.question.split("\n");


    lines.forEach(
        line => {

            const div =
                document.createElement(
                    "div"
                );

            /*
               빈 줄도 유지
            */

            if(line === "") {
                div.innerHTML =
                    "&nbsp;";
            }
            else {

                /*
                   LaTeX가 포함된 줄은
                   MathJax에 직접 전달
                */

                div.innerHTML =
                    convertToMathJax(
                        line
                    );

            }

            question.appendChild(
                div
            );

        }
    );


    preview.appendChild(
        question
    );


    /*
       선택지
    */

    if(
        data.type === "multiple"
    ) {

        const choices =
            document.createElement(
                "div"
            );

        choices.className =
            "choices-preview";


        data.choices.forEach(
            (choice,index) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "choice-preview";


                const number =
                    document.createElement(
                        "div"
                    );

                number.className =
                    "choice-number";

                number.textContent =
                    index + 1;


                const content =
                    document.createElement(
                        "div"
                    );

                content.innerHTML =
                    convertToMathJax(
                        choice
                    );


                row.append(
                    number,
                    content
                );

                choices.appendChild(
                    row
                );

            }
        );

        preview.appendChild(
            choices
        );

    }


    /*
       MathJax 직접 실행
    */

    if(
        window.MathJax &&
        MathJax.typesetPromise
    ) {

        try {

            await MathJax.typesetPromise(
                [preview]
            );

        }
        catch(error) {

            console.error(
                "MathJax:",
                error
            );

        }

    }

}


/* =====================================================
   INSERT
===================================================== */

function insert(text) {

    const textarea =
        document.getElementById(
            "question"
        );

    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;

    textarea.value =
        textarea.value.slice(
            0,
            start
        )
        +
        text
        +
        textarea.value.slice(
            end
        );

    textarea.focus();

    textarea.selectionStart =
        textarea.selectionEnd =
        start + text.length;

    renderPreview();

    autoSave();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   DARK
===================================================== */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(
        "mathforge-dark",
        document.body.classList.contains(
            "dark"
        )
    );

}


/* =====================================================
   TOAST
===================================================== */

function toast(message) {

    const el =
        document.getElementById(
            "toast"
        );

    el.textContent =
        message;

    el.classList.add(
        "show"
    );

    setTimeout(
        () => {
            el.classList.remove(
                "show"
            );
        },
        1500
    );

}


/* =====================================================
   EVENTS
===================================================== */

[
    "number",
    "score",
    "question",
    "answer"
].forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(
                "input",
                () => {

                    clearTimeout(
                        renderTimer
                    );

                    renderTimer =
                        setTimeout(
                            () => {
                                renderPreview();
                            },
                            20
                        );

                    autoSave();

                }
            );

    }
);


document

    );

if(
