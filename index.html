<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MathForge</title>

<script>
window.MathJax = {
    tex: {
        inlineMath: [
            ['\\(', '\\)']
        ],
        displayMath: [
            ['\\[', '\\]'],
            ['$$', '$$']
        ],

        processEscapes: true,
        processEnvironments: true
    },

    svg: {
        fontCache: 'global'
    },

    options: {
        skipHtmlTags: [
            'script',
            'noscript',
            'style',
            'textarea',
            'pre',
            'code'
        ]
    }
};
</script>

<script
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js">
</script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #17181c;
    --muted: #777d87;
    --border: #dfe2e7;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #ef4444;
    --danger-bg: #fff1f2;
    --success: #16a34a;
    --warning: #d97706;
}

* {
    scrollbar-width: thin;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

body.dark {
    --bg: #101114;
    --panel: #181a1f;
    --text: #f4f4f5;
    --muted: #999fa9;
    --border: #2c2f36;
}


/* ===============================
   HEADER
================================ */

header {
    height: 58px;

    background: var(--panel);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 14px;

    position: sticky;

    top: 0;

    z-index: 100;
}

.logo {
    font-size: 19px;

    font-weight: 800;
}

.logo span {
    color: var(--accent);
}

.header-right {
    display: flex;

    align-items: center;

    gap: 6px;
}

button {
    font: inherit;
}

.btn {
    border:
        1px solid var(--border);

    background:
        var(--panel);

    color:
        var(--text);

    border-radius:
        8px;

    padding:
        8px 11px;

    cursor: pointer;
}

.btn:hover {
    border-color:
        var(--accent);
}

.btn.primary {
    color: white;

    background:
        var(--accent);

    border-color:
        var(--accent);
}

.btn.primary:hover {
    background:
        var(--accent-hover);
}


/* ===============================
   LAYOUT
================================ */

.layout {
    max-width:
        1600px;

    margin:
        0 auto;

    padding:
        8px;

    display:
        grid;

    grid-template-columns:
        220px
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap:
        7px;
}

.panel {
    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius:
        10px;

    overflow:
        hidden;
}

.panel-header {
    height:
        49px;

    border-bottom:
        1px solid var(--border);

    padding:
        0 13px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.panel-title {
    font-size:
        14px;

    font-weight:
        750;
}

.panel-body {
    padding:
        13px;
}


/* ===============================
   EDITOR
================================ */

.field {
    margin-bottom:
        13px;
}

label {
    display:
        block;

    font-size:
        12px;

    color:
        var(--muted);

    font-weight:
        700;

    margin-bottom:
        6px;
}

.row {
    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        7px;
}

input,
select,
textarea {
    width:
        100%;

    background:
        var(--panel);

    color:
        var(--text);

    border:
        1px solid var(--border);

    border-radius:
        8px;

    outline:
        none;

    padding:
        9px 10px;
}

input:focus,
select:focus,
textarea:focus {
    border-color:
        var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(79,70,229,.10);
}


/*
   중요:
   이 textarea 안의 내용은
   JS가 LaTeX 파싱하지 않는다.
*/

#question {
    min-height:
        500px;

    resize:
        vertical;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

    font-size:
        14px;

    line-height:
        1.8;

    tab-size:
        4;
}


/* ===============================
   MATH TOOLBAR
================================ */

.math-toolbar {
    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        5px;

    margin-bottom:
        7px;
}

.math-button {
    border:
        1px solid var(--border);

    background:
        var(--bg);

    color:
        var(--text);

    border-radius:
        6px;

    padding:
        6px 9px;

    cursor:
        pointer;

    font-size:
        12px;
}

.math-button:hover {
    color:
        var(--accent);

    border-color:
        var(--accent);
}


/* ===============================
   PREVIEW
================================ */

.preview {
    min-height:
        700px;

    padding:
        28px 30px;

    font-size:
        17px;

    line-height:
        1.9;

    overflow-x:
        auto;
}

.preview-question {
    white-space:
        pre-wrap;

    word-break:
        break-word;
}

.problem-number {
    color:
        var(--muted);

    font-size:
        13px;

    margin-bottom:
        15px;
}


/* ===============================
   ERROR
================================ */

.math-error {
    color:
        var(--danger);

    background:
        var(--danger-bg);

    border-radius:
        5px;

    padding:
        3px 5px;
}


/* ===============================
   CHOICES
================================ */

.choices {
    margin-top:
        25px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;
}

.choice {
    display:
        flex;

    gap:
        10px;

    align-items:
        flex-start;
}

.choice-number {
    width:
        25px;

    height:
        25px;

    min-width:
        25px;

    border:
        1px solid var(--border);

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        12px;
}


/* ===============================
   CHOICE EDITOR
================================ */

.choice-row {
    display:
        flex;

    gap:
        6px;

    margin-bottom:
        6px;
}

.choice-row input[type="text"] {
    flex:
        1;
}

.remove-choice {
    width:
        34px;

    border:
        1px solid var(--border);

    background:
        transparent;

    color:
        var(--danger);

    border-radius:
        7px;

    cursor:
        pointer;
}


/* ===============================
   TYPE
================================ */

.type-buttons {
    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        5px;
}

.type-button {
    border:
        1px solid var(--border);

    background:
        var(--panel);

    color:
        var(--text);

    border-radius:
        7px;

    padding:
        8px;

    cursor:
        pointer;
}

.type-button.active {
    background:
        var(--accent);

    color:
        white;

    border-color:
        var(--accent);
}


/* ===============================
   PROBLEM LIST
================================ */

.search {
    margin-bottom:
        9px;
}

.problem-list {
    max-height:
        calc(100vh - 110px);

    overflow-y:
        auto;
}

.problem-item {
    padding:
        11px 12px;

    border-bottom:
        1px solid var(--border);

    cursor:
        pointer;
}

.problem-item:hover {
    background:
        var(--bg);
}

.problem-item.active {
    background:
        rgba(79,70,229,.10);
}

.problem-title {
    font-size:
        13px;

    font-weight:
        700;

    overflow:
        hidden;

    white-space:
        nowrap;

    text-overflow:
        ellipsis;
}

.problem-meta {
    font-size:
        11px;

    color:
        var(--muted);

    margin-top:
        4px;
}


/* ===============================
   SAVE STATUS
================================ */

.save-status {
    display:
        flex;

    align-items:
        center;

    gap:
        5px;

    font-size:
        11px;

    color:
        var(--muted);
}

.save-dot {
    width:
        7px;

    height:
        7px;

    border-radius:
        50%;

    background:
        var(--success);
}

.save-dot.dirty {
    background:
        var(--warning);
}


/* ===============================
   TOAST
================================ */

.toast {
    position:
        fixed;

    left:
        50%;

    bottom:
        20px;

    transform:
        translate(-50%, 20px);

    background:
        #22242a;

    color:
        white;

    padding:
        10px 15px;

    border-radius:
        8px;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        .2s;

    z-index:
        500;
}

.toast.show {
    opacity:
        1;

    transform:
        translate(-50%, 0);
}

.hidden {
    display:
        none !important;
}


/* ===============================
   MOBILE
================================ */

@media(max-width:1100px) {

    .layout {
        grid-template-columns:
            210px
            minmax(0, 1fr);
    }

    .preview-panel {
        grid-column:
            1 / -1;
    }
}

@media(max-width:700px) {

    .layout {
        display:
            flex;

        flex-direction:
            column;
    }

    .problem-list-panel {
        order:
            2;
    }

    .editor-panel {
        order:
            1;
    }

    .preview-panel {
        order:
            3;
    }

    .preview {
        padding:
            20px 15px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        Math<span>Forge</span>
    </div>

    <div class="header-right">

        <div
            id="saveStatus"
            class="save-status"
        >
            <span class="save-dot"></span>
            <span>저장됨</span>
        </div>

        <button
            class="btn"
            onclick="newProblem()"
        >
            ＋ 새 문제
        </button>

        <button
            class="btn"
            onclick="exportJSON()"
        >
            저장
        </button>

        <button
            class="btn"
            onclick="document.getElementById('jsonFile').click()"
        >
            불러오기
        </button>

        <button
            class="btn"
            onclick="toggleDark()"
        >
            ◐
        </button>

    </div>

</header>

<input
    id="jsonFile"
    type="file"
    accept=".json"
    hidden
    onchange="importJSON(event)"
>


<div class="layout">


<!-- ===============================
     PROBLEM LIST
================================ -->

<section class="panel problem-list-panel">

    <div class="panel-header">

        <div class="panel-title">
            문제 목록
        </div>

        <button
            class="btn"
            onclick="newProblem()"
        >
            ＋
        </button>

    </div>

    <div class="panel-body">

        <input
            id="search"
            class="search"
            placeholder="문제 검색..."
        >

    </div>

    <div
        id="problemList"
        class="problem-list"
    ></div>

</section>


<!-- ===============================
     EDITOR
================================ -->

<section class="panel editor-panel">

    <div class="panel-header">

        <div class="panel-title">
            문제 입력
        </div>

    </div>

    <div class="panel-body">

        <div class="row">

            <div class="field">

                <label>
                    번호
                </label>

                <input
                    id="number"
                    type="number"
                >

            </div>

            <div class="field">

                <label>
                    배점
                </label>

                <input
                    id="score"
                    type="number"
                >

            </div>

        </div>


        <div class="row">

            <div class="field">

                <label>
                    난이도
                </label>

                <select id="difficulty">

                    <option>쉬움</option>
                    <option selected>보통</option>
                    <option>어려움</option>
                    <option>최상</option>

                </select>

            </div>


            <div class="field">

                <label>
                    유형
                </label>

                <div class="type-buttons">

                    <button
                        id="multipleButton"
                        class="type-button active"
                        onclick="setType('multiple')"
                    >
                        객관식
                    </button>

                    <button
                        id="shortButton"
                        class="type-button"
                        onclick="setType('short')"
                    >
                        주관식
                    </button>

                </div>

            </div>

        </div>


        <div class="field">

            <label>
                LaTeX 입력
            </label>

            <div class="math-toolbar">

                <button
                    class="math-button"
                    onclick="insertText('\\frac{}{}')"
                >
                    frac
                </button>

                <button
                    class="math-button"
                    onclick="insertText('\\sqrt{}')"
                >
                    √
                </button>

                <button
                    class="math-button"
                    onclick="insertText('\\lim_{n\\to\\infty}')"
                >
                    lim
                </button>

                <button
                    class="math-button"
                    onclick="insertText('\\sum_{k=1}^{n}')"
                >
                    Σ
                </button>

                <button
                    class="math-button"
                    onclick="insertText('\\int_0^1')"
                >
                    ∫
                </button>

                <button
                    class="math-button"
                    onclick="insertText('x^2')"
                >
                    x²
                </button>

                <button
                    class="math-button"
                    onclick="insertText('x_n')"
                >
                    xₙ
                </button>

                <button
                    class="math-button"
                    onclick="insertText('\\pi')"
                >
                    π
                </button>

                <button
                    class="math-button"
                    onclick="insertText('\\to')"
                >
                    →
                </button>

                <button
                    class="math-button"
                    onclick="insertText('\\begin{cases}\\end{cases}')"
                >
                    cases
                </button>

            </div>


            <textarea
                id="question"
                spellcheck="false"
                placeholder="문제를 입력하세요.

예:

함수 \(f(x)=x^2-3x+2\)에 대하여
\(f(1)\)의 값을 구하여라.

복잡한 수식은 그대로 입력할 수 있습니다.

\[
\lim_{n\to\infty}
\left(1+\frac{1}{n}\right)^n
\]

※ 편집기에서는 $를 직접 입력할 필요가 없습니다.
수식은 \( ... \) 또는 \[ ... \] 형태로 입력합니다."
            ></textarea>

        </div>


        <!-- 객관식 -->

        <div
            id="multipleArea"
            class="field"
        >

            <label>
                선택지
            </label>

            <div id="choices"></div>

            <button
                class="btn"
                onclick="addChoice()"
            >
                ＋ 선택지 추가
            </button>

        </div>


        <!-- 주관식 -->

        <div
            id="shortArea"
            class="field hidden"
        >

            <label>
                정답
            </label>

            <input
                id="shortAnswer"
                placeholder="정답"
            >

        </div>


        <div
            style="
                display:flex;
                gap:6px;
                margin-top:10px;
            "
        >

            <button
                class="btn primary"
                onclick="saveCurrent()"
            >
                저장
            </button>

            <button
                class="btn"
                onclick="duplicateProblem()"
            >
                복제
            </button>

            <button
                class="btn"
                onclick="deleteProblem()"
            >
                삭제
            </button>

        </div>

    </div>

</section>


<!-- ===============================
     PREVIEW
================================ -->

<section
    class="panel preview-panel"
>

    <div class="panel-header">

        <div class="panel-title">
            미리보기
        </div>

        <div
            style="
                font-size:11px;
                color:var(--success);
            "
        >
            LIVE
        </div>

    </div>

    <div
        id="preview"
        class="preview"
    ></div>

</section>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/*
=====================================================
   DATA
=====================================================
*/

let problems = [];

let currentId = null;

let currentType = "multiple";

let saveTimer = null;

let renderToken = 0;


/*
=====================================================
   DEFAULT
=====================================================
*/

function defaultProblem() {

    return {

        id: Date.now(),

        number: 1,

        score: 5,

        difficulty: "보통",

        type: "multiple",

        question:
`함수 \$begin:math:text$f\(x\)\=x\^2\-3x\+2\\$end:math:text$에 대하여
\$begin:math:text$f\(1\)\\$end:math:text$의 값을 구하여라.`,

        choices: [
            "0",
            "1",
            "2",
            "3",
            "4"
        ],

        answer: 0,

        shortAnswer: ""

    };

}


/*
=====================================================
   INIT
=====================================================
*/

function init() {

    const saved =
        localStorage.getItem(
            "mathforge-data-v3"
        );

    if (saved) {

        try {

            problems =
                JSON.parse(saved);

        } catch {

            problems = [];

        }

    }

    if (
        !Array.isArray(problems)
        ||
        problems.length === 0
    ) {

        problems = [
            defaultProblem()
        ];

    }

    currentId =
        problems[0].id;

    loadProblem(currentId);

    updateList();

}


/*
=====================================================
   CURRENT
=====================================================
*/

function currentProblem() {

    return problems.find(
        p => p.id === currentId
    );

}


/*
=====================================================
   LOAD
=====================================================
*/

function loadProblem(id) {

    const p =
        problems.find(
            x => x.id === id
        );

    if (!p) return;

    currentId = id;

    document.getElementById(
        "number"
    ).value = p.number;

    document.getElementById(
        "score"
    ).value = p.score;

    document.getElementById(
        "difficulty"
    ).value = p.difficulty;

    document.getElementById(
        "question"
    ).value = p.question || "";

    document.getElementById(
        "shortAnswer"
    ).value = p.shortAnswer || "";

    currentType =
        p.type || "multiple";

    renderChoices(
        p.choices || []
    );

    updateType();

    updatePreview();

    updateList();

}


/*
=====================================================
   TYPE
=====================================================
*/

function setType(type) {

    currentType = type;

    updateType();

    scheduleSave();

    updatePreview();

}


function updateType() {

    document
        .getElementById(
            "multipleButton"
        )
        .classList.toggle(
            "active",
            currentType === "multiple"
        );

    document
        .getElementById(
            "shortButton"
        )
        .classList.toggle(
            "active",
            currentType === "short"
        );

    document
        .getElementById(
            "multipleArea"
        )
        .classList.toggle(
            "hidden",
            currentType !== "multiple"
        );

    document
        .getElementById(
            "shortArea"
        )
        .classList.toggle(
            "hidden",
            currentType !== "short"
        );

}


/*
=====================================================
   CHOICES
=====================================================
*/

function renderChoices(choices) {

    const box =
        document.getElementById(
            "choices"
        );

    box.innerHTML = "";

    choices.forEach(
        (choice, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "choice-row";

            const radio =
                document.createElement(
                    "input"
                );

            radio.type = "radio";
            radio.name = "answer";

            const p =
                currentProblem();

            radio.checked =
                (p?.answer || 0)
                === index;

            radio.addEventListener(
                "change",
                () => {

                    const p =
                        currentProblem();

                    if (p) {
                        p.answer = index;
                    }

                    scheduleSave();
                    updatePreview();

                }
            );

            const input =
                document.createElement(
                    "input"
                );

            input.type = "text";
            input.value = choice;

            input.addEventListener(
                "input",
                () => {

                    updatePreview();
                    scheduleSave();

                }
            );

            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "remove-choice";

            remove.textContent = "×";

            remove.addEventListener(
                "click",
                () => {

                    removeChoice(index);

                }
            );

            row.appendChild(radio);
            row.appendChild(input);
            row.appendChild(remove);

            box.appendChild(row);

        }
    );

}


function getChoices() {

    return [
        ...document.querySelectorAll(
            "#choices input[type=text]"
        )
    ].map(
        input => input.value
    );

}


function addChoice() {

    const choices =
        getChoices();

    choices.push("");

    renderChoices(choices);

    scheduleSave();

    updatePreview();

}


function removeChoice(index) {

    const choices =
        getChoices();

    choices.splice(index, 1);

    if (
        choices.length === 0
    ) {
        choices.push("");
    }

    const p =
        currentProblem();

    if (p) {

        p.answer =
            Math.min(
                p.answer || 0,
                choices.length - 1
            );

    }

    renderChoices(choices);

    scheduleSave();

    updatePreview();

}


/*
=====================================================
   READ EDITOR
=====================================================
*/

function readEditor() {

    const p =
        currentProblem();

    return {

        number:
            Number(
                document.getElementById(
                    "number"
                ).value
            ) || 1,

        score:
            Number(
                document.getElementById(
                    "score"
                ).value
            ) || 0,

        difficulty:
            document.getElementById(
                "difficulty"
            ).value,

        type:
            currentType,

        /*
           IMPORTANT:

           question.value를
           어떠한 LaTeX parser도
           거치지 않는다.

           그대로 저장한다.
        */

        question:
            document.getElementById(
                "question"
            ).value,

        choices:
            getChoices(),

        answer:
            p?.answer || 0,

        shortAnswer:
            document.getElementById(
                "shortAnswer"
            ).value

    };

}


/*
=====================================================
   SAVE
=====================================================
*/

function saveCurrent(show = true) {

    const p =
        currentProblem();

    if (!p) return;

    Object.assign(
        p,
        readEditor()
    );

    persist();

    updateList();

    setSaved();

    if (show) {
        toast(
            "저장되었습니다."
        );
    }

}


function persist() {

    localStorage.setItem(
        "mathforge-data-v3",
        JSON.stringify(
            problems
        )
    );

}


function scheduleSave() {

    setDirty();

    clearTimeout(
        saveTimer
    );

    saveTimer =
        setTimeout(
            () => {

                saveCurrent(false);

            },
            500
        );

}


function setDirty() {

    const status =
        document.getElementById(
            "saveStatus"
        );

    status.innerHTML = `
        <span class="save-dot dirty"></span>
        <span>저장 중...</span>
    `;

}


function setSaved() {

    const status =
        document.getElementById(
            "saveStatus"
        );

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            "ko-KR",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    status.innerHTML = `
        <span class="save-dot"></span>
        <span>저장됨 · ${time}</span>
    `;

}


/*
=====================================================
   NEW
=====================================================
*/

function newProblem() {

    const p = {

        id:
            Date.now(),

        number:
            problems.length + 1,

        score: 5,

        difficulty:
            "보통",

        type:
            "multiple",

        question: "",

        choices:
            ["", "", "", "", ""],

        answer: 0,

        shortAnswer: ""

    };

    problems.unshift(p);

    currentId = p.id;

    loadProblem(p.id);

    persist();

    toast(
        "새 문제가 만들어졌습니다."
    );

}


/*
=====================================================
   DUPLICATE
=====================================================
*/

function duplicateProblem() {

    const p =
        currentProblem();

    if (!p) return;

    const copy =
        JSON.parse(
            JSON.stringify(p)
        );

    copy.id =
        Date.now();

    copy.number =
        problems.length + 1;

    problems.unshift(copy);

    currentId =
        copy.id;

    loadProblem(copy.id);

    persist();

    toast(
        "문제를 복제했습니다."
    );

}


/*
=====================================================
   DELETE
=====================================================
*/

function deleteProblem() {

    if (
        problems.length <= 1
    ) {

        toast(
            "최소 한 문제는 남겨야 합니다."
        );

        return;

    }

    if (
        !confirm(
            "현재 문제를 삭제할까요?"
        )
    ) {
        return;
    }

    const index =
        problems.findIndex(
            p => p.id === currentId
        );

    problems.splice(
        index,
        1
    );

    const next =
        problems[
            Math.max(
                0,
                index - 1
            )
        ];

    currentId =
        next.id;

    loadProblem(
        currentId
    );

    persist();

    toast(
        "삭제되었습니다."
    );

}


/*
=====================================================
   LIST
=====================================================
*/

function updateList() {

    const box =
        document.getElementById(
            "problemList"
        );

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();

    const filtered =
        problems.filter(
            p =>
                String(p.number)
                    .includes(search)
                ||
                String(p.question)
                    .toLowerCase()
                    .includes(search)
        );

    box.innerHTML = "";

    filtered.forEach(
        p => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "problem-item";

            if (
                p.id === currentId
            ) {
                item.classList.add(
                    "active"
                );
            }

            const title =
                p.question
                    .replace(
                        /\n/g,
                        " "
                    )
                    .slice(
                        0,
                        50
                    );

            item.innerHTML = `
                <div class="problem-title">
                    ${p.number}.
                    ${escapeHTML(
                        title || "새 문제"
                    )}
                </div>

                <div class="problem-meta">
                    ${p.difficulty}
                    · ${p.score}점
                    · ${
                        p.type === "multiple"
                        ? "객관식"
                        : "주관식"
                    }
                </div>
            `;

            item.addEventListener(
                "click",
                () => {
                    loadProblem(p.id);
                }
            );

            box.appendChild(item);

        }
    );

}


/*
=====================================================
   PURE MATHJAX PREVIEW
=====================================================
*/

/*
    이것이 이번 버전에서 가장 중요한 부분이다.

    question 문자열을

        LaTeX parser
        regex parser
        command parser
        lim parser
        sum parser

    등으로 분석하지 않는다.

    textarea의 문자열을 그대로
    HTML text node에 넣고,

    사용자가 직접 입력한
    \(...\), \[...\], $$...$$
    를 MathJax가 찾아 처리한다.
*/

async function updatePreview() {

    const token =
        ++renderToken;

    const data =
        readEditor();

    const preview =
        document.getElementById(
            "preview"
        );

    /*
       HTML을 직접 문자열로 만들지 않고
       DOM API를 사용해서
       사용자의 LaTeX가 HTML로
       해석되지 않도록 한다.
    */

    preview.innerHTML = "";

    const number =
        document.createElement(
            "div"
        );

    number.className =
        "problem-number";

    number.textContent =
        `${data.number}번 · ${data.score}점`;

    preview.appendChild(
        number
    );


    const question =
        document.createElement(
            "div"
        );

    question.className =
        "preview-question";

    /*
       핵심:
       textContent = 원본 그대로.

       replace 없음.
       regex 없음.
       LaTeX 조작 없음.
    */

    question.textContent =
        data.question;

    preview.appendChild(
        question
    );


    if (
        data.type === "multiple"
    ) {

        const choices =
            document.createElement(
                "div"
            );

        choices.className =
            "choices";

        data.choices.forEach(
            (text, index) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "choice";

                const number =
                    document.createElement(
                        "div"
                    );

                number.className =
                    "choice-number";

                number.textContent =
                    String(index + 1);

                const content =
                    document.createElement(
                        "div"
                    );

                /*
                   선택지도 마찬가지로
                   LaTeX 원본 그대로.
                */

                content.textContent =
                    text;

                row.appendChild(
                    number
                );

                row.appendChild(
                    content
                );

                choices.appendChild(
                    row
                );

            }
        );

        preview.appendChild(
            choices
        );

    }
    else {

        const answer =
            document.createElement(
                "div"
            );

        answer.style.marginTop =
            "25px";

        answer.style.color =
            "var(--muted)";

        answer.textContent =
            "답: __________________________";

        preview.appendChild(
            answer
        );

    }


    /*
       이전 MathJax 결과가 있으면
       먼저 clear한다.
    */

    if (
        window.MathJax
        &&
        MathJax.typesetClear
    ) {

        MathJax.typesetClear(
            [preview]
        );

    }


    /*
       MathJax가 로딩되기 전이면
       잠시 기다린다.
    */

    if (
        !window.MathJax
        ||
        !MathJax.typesetPromise
    ) {

        return;

    }


    try {

        /*
           MathJax에게
           preview 전체를 직접 전달.

           여기에는 LaTeX를
           변경하는 JS가 없다.
        */

        await MathJax.typesetPromise(
            [preview]
        );

        if (
            token !== renderToken
        ) {
            return;
        }

        markMathErrors(
            preview
        );

    }
    catch (error) {

        if (
            token !== renderToken
        ) {
            return;
        }

        /*
           MathJax parsing error.
           원본 수식은 그대로 두고
           오류 표시만 한다.
        */

        markMathErrors(
            preview
        );

    }

}


/*
=====================================================
   ERROR DETECTION
=====================================================
*/

function markMathErrors(
    root
) {

    /*
       MathJax 4가 생성한
       mjx-container 내부의
       mjx-merror를 찾는다.
    */

    const errors =
        root.querySelectorAll(
            "mjx-merror"
        );

    errors.forEach(
        error => {

            const container =
                error.closest(
                    "mjx-container"
                );

            if (container) {

                container.classList.add(
                    "math-error"
                );

            }

        }
    );

}


/*
=====================================================
   INSERT
=====================================================
*/

function insertText(text) {

    const textarea =
        document.getElementById(
            "question"
        );

    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;

    const old =
        textarea.value;

    textarea.value =
        old.slice(0, start)
        +
        text
        +
        old.slice(end);

    textarea.focus();

    const cursor =
        start + text.length;

    textarea.setSelectionRange(
        cursor,
        cursor
    );

    updatePreview();

    scheduleSave();

}


/*
=====================================================
   JSON EXPORT
=====================================================
*/

function exportJSON() {

    saveCurrent(false);

    const blob =
        new Blob(
            [
                JSON.stringify(
                    problems,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        "MathForge-Problems.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    toast(
        "JSON 파일을 저장했습니다."
    );

}


/*
=====================================================
   JSON IMPORT
=====================================================
*/

function importJSON(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload =
        e => {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );

                if (
                    !Array.isArray(data)
                    ||
                    data.length === 0
                ) {
                    throw new Error();
                }

                problems = data;

                currentId =
                    problems[0].id;

                persist();

                loadProblem(
                    currentId
                );

                toast(
                    "불러왔습니다."
                );

            }
            catch {

                alert(
                    "올바른 MathForge JSON 파일이 아닙니다."
                );

            }

        };

    reader.readAsText(file);

    event.target.value = "";

}


/*
=====================================================
   DARK MODE
=====================================================
*/

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(
        "mathforge-dark",
        document.body.classList.contains(
            "dark"
        )
    );

}


/*
=====================================================
   ESCAPE
=====================================================
*/

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/*
=====================================================
   TOAST
=====================================================
*/

function toast(message) {

    const t =
        document.getElementById(
            "toast"
        );

    t.textContent =
        message;

    t.classList.add(
        "show"
    );

    setTimeout(
        () => {
            t.classList.remove(
                "show"
            );
        },
        1800
    );

}


/*
=====================================================
   EVENTS
=====================================================
*/

[
    "number",
    "score",
    "difficulty",
    "question",
    "shortAnswer"
].forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(
                "input",
                () => {

                    updatePreview();

                    scheduleSave();

                }
            );

    }
);


document
    .getElementById("search")
    .addEventListener(
        "input",
        updateList
    );


/*
=====================================================
   DARK MODE RESTORE
=====================================================
*/

if (
    localStorage.getItem(
        "mathforge-dark"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}


/*
=====================================================
   START
=====================================================
*/

init();

</script>
