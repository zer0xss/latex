<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MathForge</title>

<script>
window.MathJax = {
    tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
    },
    svg: {
        fontCache: 'global'
    },
    options: {
        enableMenu: false
    }
};
</script>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #f3f5f9;
    --panel: #ffffff;
    --text: #17191f;
    --sub: #777d89;
    --border: #dfe3ea;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #ef4444;
    --danger-bg: #fff1f2;
    --shadow: 0 8px 30px rgba(0,0,0,.06);
}

body.dark {
    --bg: #101217;
    --panel: #181b22;
    --text: #f5f6f8;
    --sub: #9da3af;
    --border: #2b3039;
    --danger-bg: #35191c;
    --shadow: 0 8px 30px rgba(0,0,0,.25);
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.topbar {
    height: 62px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    font-size: 20px;
    font-weight: 800;
}

.logo span {
    color: var(--accent);
}

.top-actions {
    display: flex;
    gap: 7px;
}

.btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);

    padding: 8px 12px;

    border-radius: 8px;
}

.btn:hover {
    border-color: var(--accent);
}

.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.btn.primary:hover {
    background: var(--accent-hover);
}

.btn.danger {
    color: var(--danger);
}

.layout {
    max-width: 1550px;
    margin: auto;

    display: grid;

    /*
       문제목록 / 편집 / 미리보기
       가운데 편집과 미리보기를 가깝게 배치
    */
    grid-template-columns:
        260px
        minmax(480px, 1fr)
        minmax(430px, 1fr);

    gap: 10px;

    padding: 10px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);

    overflow: hidden;
}

.panel-header {
    height: 52px;

    padding: 0 14px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}

.panel-title {
    font-weight: 750;
}

.panel-body {
    padding: 14px;
}

.field {
    margin-bottom: 14px;
}

label {
    display: block;

    font-size: 12px;
    font-weight: 700;

    color: var(--sub);

    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--panel);
    color: var(--text);

    padding: 9px 10px;

    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--accent);

    box-shadow:
        0 0 0 3px rgba(79,70,229,.1);
}

textarea {
    resize: vertical;

    min-height: 300px;

    line-height: 1.7;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.type-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.type-tab {
    padding: 9px;

    border: 1px solid var(--border);
    border-radius: 8px;

    background: var(--panel);
    color: var(--text);
}

.type-tab.active {
    background: var(--accent);
    color: white;

    border-color: var(--accent);
}

.math-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;

    margin-bottom: 7px;
}

.math-btn {
    padding: 6px 8px;

    border: 1px solid var(--border);
    border-radius: 7px;

    background: var(--bg);
    color: var(--text);

    font-size: 12px;
}

.math-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
}

/* 잘못된 수식 */

.invalid-math {
    color: var(--danger) !important;

    background: var(--danger-bg);

    border-radius: 4px;

    padding: 2px 4px;
}

/* 미리보기 */

.paper {
    padding: 28px 30px;

    min-height: 650px;

    font-size: 16px;
}

.problem-number {
    color: var(--sub);

    font-size: 13px;

    margin-bottom: 15px;
}

.problem-text {
    line-height: 2;

    white-space: pre-wrap;
}

.question-line {
    min-height: 30px;
}

.choices-preview {
    margin-top: 25px;

    display: flex;
    flex-direction: column;

    gap: 13px;
}

.choice-preview {
    display: flex;

    gap: 10px;

    line-height: 1.7;
}

.choice-circle {
    width: 25px;
    height: 25px;

    min-width: 25px;

    border: 1px solid var(--border);

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
}

.problem-item {
    padding: 12px 13px;

    border-bottom: 1px solid var(--border);

    cursor: pointer;
}

.problem-item:hover {
    background: var(--bg);
}

.problem-item.active {
    background: rgba(79,70,229,.1);
}

.problem-item-title {
    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.problem-item-meta {
    margin-top: 4px;

    font-size: 11px;

    color: var(--sub);
}

.problem-list {
    max-height: calc(100vh - 130px);

    overflow-y: auto;
}

.status {
    color: var(--sub);
    font-size: 11px;
}

.empty {
    padding: 30px 15px;

    text-align: center;

    color: var(--sub);
}

.toast {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translateX(-50%)
        translateY(20px);

    background: #20232b;
    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    opacity: 0;

    transition: .2s;

    pointer-events: none;

    z-index: 100;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

.hidden {
    display: none !important;
}

/* 모바일 */

@media(max-width:1050px) {

    .layout {
        grid-template-columns:
            230px
            1fr;
    }

    .preview-panel {
        grid-column: 1 / -1;
    }
}

@media(max-width:700px) {

    .layout {
        display: flex;
        flex-direction: column;
    }

    .problem-list-panel {
        order: 2;
    }

    .editor-panel {
        order: 1;
    }

    .preview-panel {
        order: 3;
    }

    .top-actions .optional {
        display: none;
    }

    .paper {
        padding: 22px 18px;
    }
}

</style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        Math<span>Forge</span>
    </div>

    <div class="top-actions">

        <button class="btn optional" onclick="newProblem()">
            ＋ 새 문제
        </button>

        <button class="btn optional" onclick="saveJSON()">
            저장
        </button>

        <button
            class="btn optional"
            onclick="document.getElementById('fileInput').click()"
        >
            불러오기
        </button>

        <button class="btn" onclick="toggleDark()">
            ◐
        </button>

        <button class="btn primary" onclick="printProblems()">
            🖨 인쇄
        </button>

    </div>

</header>

<input
    id="fileInput"
    type="file"
    accept=".json"
    style="display:none"
    onchange="loadJSON(event)"
>

<div class="layout">

    <!-- 문제 목록 -->

    <section class="panel problem-list-panel">

        <div class="panel-header">

            <div class="panel-title">
                문제 목록
            </div>

            <button class="btn" onclick="newProblem()">
                ＋
            </button>

        </div>

        <div class="panel-body">

            <input
                id="search"
                placeholder="문제 검색..."
                oninput="renderProblemList()"
            >

        </div>

        <div id="problemList" class="problem-list"></div>

    </section>


    <!-- 문제 편집 -->

    <section class="panel editor-panel">

        <div class="panel-header">

            <div class="panel-title">
                문제 만들기
            </div>

            <div id="saveStatus" class="status">
                자동 저장됨
            </div>

        </div>

        <div class="panel-body">

            <div class="row">

                <div class="field">

                    <label>
                        문제 번호
                    </label>

                    <input
                        id="number"
                        type="number"
                        value="1"
                    >

                </div>

                <div class="field">

                    <label>
                        배점
                    </label>

                    <input
                        id="score"
                        type="number"
                        value="5"
                    >

                </div>

            </div>


            <div class="row">

                <div class="field">

                    <label>
                        난이도
                    </label>

                    <select id="difficulty">

                        <option>
                            쉬움
                        </option>

                        <option selected>
                            보통
                        </option>

                        <option>
                            어려움
                        </option>

                        <option>
                            최상
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        유형
                    </label>

                    <div class="type-tabs">

                        <button
                            class="type-tab active"
                            onclick="setType('multiple')"
                        >
                            객관식
                        </button>

                        <button
                            class="type-tab"
                            onclick="setType('short')"
                        >
                            주관식
                        </button>

                    </div>

                </div>

            </div>


            <!-- 수식 버튼 -->

            <div class="field">

                <label>
                    문제
                </label>

                <div class="math-toolbar">

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\frac{a}{b}')"
                    >
                        분수
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\sqrt{x}')"
                    >
                        √
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('x^2')"
                    >
                        x²
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('x_n')"
                    >
                        xₙ
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\lim_{n\\to\\infty}')"
                    >
                        lim
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\sum_{k=1}^{n}')"
                    >
                        Σ
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\int_a^b')"
                    >
                        ∫
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\pi')"
                    >
                        π
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\sin x')"
                    >
                        sin
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\cos x')"
                    >
                        cos
                    </button>

                    <button
                        class="math-btn"
                        onclick="insertLatex('\\tan x')"
                    >
                        tan
                    </button>

                </div>


                <textarea
                    id="question"
                    placeholder="문제를 입력하세요.

예:

함수 f(x)=x^2-3x+2에 대하여
f(1)의 값을 구하여라.

또는

lim_{n\to\infty} (1+\frac{1}{n})^n의 값을 구하여라."
                ></textarea>

            </div>


            <!-- 객관식 -->

            <div
                id="choicesSection"
                class="field"
            >

                <label>
                    선택지
                </label>

                <div id="choices"></div>

                <button
                    class="btn"
                    onclick="addChoice()"
                >
                    ＋ 선택지 추가
                </button>

            </div>


            <!-- 주관식 -->

            <div
                id="shortAnswerSection"
                class="field hidden"
            >

                <label>
                    정답
                </label>

                <input
                    id="shortAnswer"
                    placeholder="정답 입력"
                >

            </div>


            <div
                style="
                display:flex;
                gap:7px;
                flex-wrap:wrap;
                "
            >

                <button
                    class="btn primary"
                    onclick="saveCurrent()"
                >
                    저장
                </button>

                <button
                    class="btn"
                    onclick="duplicateProblem()"
                >
                    복제
                </button>

                <button
                    class="btn danger"
                    onclick="deleteProblem()"
                >
                    삭제
                </button>

            </div>

        </div>

    </section>


    <!-- 미리보기 -->

    <section class="panel preview-panel">

        <div class="panel-header">

            <div class="panel-title">
                미리보기
            </div>

            <div class="status">
                LIVE
            </div>

        </div>

        <div class="paper" id="preview"></div>

    </section>

</div>


<div id="toast" class="toast"></div>


<script>

let problems = [];

let currentId = null;

let currentType = "multiple";

let autosaveTimer = null;


/* ============================
   기본 문제
============================ */

function createDefaultProblem() {

    return {

        id: Date.now(),

        number: 1,

        score: 5,

        difficulty: "보통",

        type: "multiple",

        question:
            "함수 f(x)=x^2-3x+2에 대하여\nf(1)의 값을 구하여라.",

        choices: [
            "0",
            "1",
            "2",
            "3",
            "4"
        ],

        answer: 0,

        shortAnswer: ""

    };
}


/* ============================
   시작
============================ */

function init() {

    const saved =
        localStorage.getItem("mathforge-problems");

    if (saved) {

        try {

            problems = JSON.parse(saved);

        } catch {

            problems = [
                createDefaultProblem()
            ];

        }

    }

    if (!problems.length) {

        problems = [
            createDefaultProblem()
        ];

    }

    currentId =
        problems[0].id;

    loadProblem(currentId);

    renderProblemList();
}


/* ============================
   문제 불러오기
============================ */

function loadProblem(id) {

    const p =
        problems.find(
            x => x.id === id
        );

    if (!p) return;

    currentId = id;

    document.getElementById("number").value =
        p.number;

    document.getElementById("score").value =
        p.score;

    document.getElementById("difficulty").value =
        p.difficulty;

    document.getElementById("question").value =
        p.question || "";

    document.getElementById("shortAnswer").value =
        p.shortAnswer || "";

    currentType =
        p.type || "multiple";

    renderChoices(
        p.choices || []
    );

    updateTypeUI();

    updatePreview();

    renderProblemList();
}


/* ============================
   현재 문제
============================ */

function getCurrent() {

    return problems.find(
        x => x.id === currentId
    );
}


/* ============================
   타입
============================ */

function setType(type) {

    currentType = type;

    updateTypeUI();

    updatePreview();

    autoSave();
}


function updateTypeUI() {

    const tabs =
        document.querySelectorAll(".type-tab");

    tabs.forEach(
        x => x.classList.remove("active")
    );

    if (currentType === "multiple") {

        tabs[0].classList.add("active");

    } else {

        tabs[1].classList.add("active");

    }

    document
        .getElementById("choicesSection")
        .classList.toggle(
            "hidden",
            currentType !== "multiple"
        );

    document
        .getElementById("shortAnswerSection")
        .classList.toggle(
            "hidden",
            currentType !== "short"
        );
}


/* ============================
   선택지
============================ */

function renderChoices(arr) {

    const container =
        document.getElementById("choices");

    container.innerHTML = "";

    arr.forEach(
        (text, index) => {

            const div =
                document.createElement("div");

            div.className = "choice";

            const checked =
                getAnswer() === index
                    ? "checked"
                    : "";

            div.innerHTML = `

                <input
                    type="radio"
                    name="answer"
                    ${checked}
                    onchange="updateAnswer(${index})"
                >

                <input
                    type="text"
                    value="${escapeHTML(text)}"
                    placeholder="선택지 ${index + 1}"
                    oninput="
                        updatePreview();
                        autoSave();
                    "
                >

                <button
                    onclick="removeChoice(${index})"
                >
                    ×
                </button>

            `;

            container.appendChild(div);

        }
    );
}


function getChoices() {

    return [
        ...document.querySelectorAll(
            "#choices input[type=text]"
        )
    ].map(
        x => x.value
    );
}


function getAnswer() {

    const p =
        getCurrent();

    return p?.answer ?? 0;
}


function updateAnswer(index) {

    const p =
        getCurrent();

    if (p) {

        p.answer = index;

    }

    updatePreview();

    autoSave();
}


function addChoice() {

    const choices =
        getChoices();

    choices.push("");

    renderChoices(choices);

    updatePreview();

    autoSave();
}


function removeChoice(index) {

    const choices =
        getChoices();

    choices.splice(index, 1);

    if (!choices.length) {

        choices.push("");

    }

    const p =
        getCurrent();

    if (p) {

        p.answer =
            Math.min(
                p.answer || 0,
                choices.length - 1
            );

    }

    renderChoices(choices);

    updatePreview();

    autoSave();
}


/* ============================
   데이터 읽기
============================ */

function readEditor() {

    return {

        number:
            Number(
                document.getElementById("number").value
            ) || 1,

        score:
            Number(
                document.getElementById("score").value
            ) || 0,

        difficulty:
            document.getElementById("difficulty").value,

        type:
            currentType,

        question:
            document.getElementById("question").value,

        choices:
            getChoices(),

        answer:
            getAnswer(),

        shortAnswer:
            document.getElementById("shortAnswer").value

    };
}


/* ============================
   저장
============================ */

function saveCurrent(show = true) {

    const p =
        getCurrent();

    if (!p) return;

    Object.assign(
        p,
        readEditor()
    );

    saveStorage();

    renderProblemList();

    updatePreview();

    if (show) {

        toast(
            "문제가 저장되었습니다."
        );

    }
}


function autoSave() {

    clearTimeout(
        autosaveTimer
    );

    document.getElementById(
        "saveStatus"
    ).textContent =
        "저장 중...";

    autosaveTimer =
        setTimeout(
            () => {

                saveCurrent(false);

                document.getElementById(
                    "saveStatus"
                ).textContent =
                    "자동 저장됨";

            },
            400
        );
}


function saveStorage() {

    localStorage.setItem(
        "mathforge-problems",
        JSON.stringify(problems)
    );
}


/* ============================
   새 문제
============================ */

function newProblem() {

    const p = {

        id: Date.now(),

        number:
            problems.length + 1,

        score: 5,

        difficulty: "보통",

        type: "multiple",

        question: "",

        choices: [
            "",
            "",
            "",
            "",
            ""
        ],

        answer: 0,

        shortAnswer: ""

    };

    problems.unshift(p);

    currentId =
        p.id;

    loadProblem(
        currentId
    );

    saveStorage();

    toast(
        "새 문제가 만들어졌습니다."
    );
}


/* ============================
   복제
============================ */

function duplicateProblem() {

    const p =
        getCurrent();

    if (!p) return;

    const copy =
        JSON.parse(
            JSON.stringify(p)
        );

    copy.id =
        Date.now();

    copy.number =
        problems.length + 1;

    problems.unshift(copy);

    currentId =
        copy.id;

    loadProblem(
        currentId
    );

    saveStorage();

    toast(
        "문제를 복제했습니다."
    );
}


/* ============================
   삭제
============================ */

function deleteProblem() {

    if (problems.length <= 1) {

        toast(
            "최소 한 문제는 필요합니다."
        );

        return;
    }

    if (
        !confirm(
            "이 문제를 삭제할까요?"
        )
    ) return;

    const index =
        problems.findIndex(
            x => x.id === currentId
        );

    problems.splice(
        index,
        1
    );

    currentId =
        problems[
            Math.max(
                0,
                index - 1
            )
        ].id;

    loadProblem(
        currentId
    );

    saveStorage();

    toast(
        "문제를 삭제했습니다."
    );
}


/* ============================
   문제 목록
============================ */

function renderProblemList() {

    const container =
        document.getElementById(
            "problemList"
        );

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    const filtered =
        problems.filter(
            p =>
                String(p.number)
                    .includes(search)
                ||
                p.question
                    .toLowerCase()
                    .includes(search)
        );

    if (!filtered.length) {

        container.innerHTML =
            `
            <div class="empty">
                검색 결과가 없습니다.
            </div>
            `;

        return;
    }

    container.innerHTML =
        filtered.map(
            p => {

                const active =
                    p.id === currentId
                        ? "active"
                        : "";

                let text =
                    p.question
                        .replace(
                            /\\/g,
                            ""
                        )
                        .replace(
                            /\{/g,
                            ""
                        )
                        .replace(
                            /\}/g,
                            ""
                        )
                        .replace(
                            /\n/g,
                            " "
                        )
                        .slice(
                            0,
                            45
                        );

                return `

                    <div
                        class="problem-item ${active}"
                        onclick="loadProblem(${p.id})"
                    >

                        <div
                            class="problem-item-title"
                        >
                            ${p.number}.
                            ${escapeHTML(
                                text ||
                                "새 문제"
                            )}
                        </div>

                        <div
                            class="problem-item-meta"
                        >
                            ${p.difficulty}
                            ·
                            ${p.score}점
                            ·
                            ${
                                p.type === "multiple"
                                    ? "객관식"
                                    : "주관식"
                            }
                        </div>

                    </div>

                `;

            }
        ).join("");
}


/* ==================================================
   핵심:
   $ 없이 입력한 LaTeX 자동 인식
================================================== */

function smartLatex(text) {

    let result =
        escapeHTML(text);

    /*
       \lim → displaystyle lim

       이렇게 하면

       lim
       n→∞

       형태로 표시됨.
    */

    result =
        result.replace(
            /\\lim\b/g,
            "\\displaystyle\\lim"
        );

    result =
        result.replace(
            /\\max\b/g,
            "\\displaystyle\\max"
        );

    result =
        result.replace(
            /\\min\b/g,
            "\\displaystyle\\min"
        );

    /*
       역슬래시 명령어가 있는
       수식 부분 자동 감지
    */

    const commands = [
        "frac",
        "sqrt",
        "lim",
        "sum",
        "prod",
        "int",
        "sin",
        "cos",
        "tan",
        "log",
        "ln",
        "exp",
        "pi",
        "infty",
        "alpha",
        "beta",
        "gamma",
        "theta",
        "Delta",
        "Sigma",
        "cdot",
        "times",
        "leq",
        "geq",
        "neq",
        "to"
    ];

    /*
       명령어를 포함하는
       연속된 수식 구간을 찾는다.
    */

    const commandPattern =
        commands.join("|");

    const regex =
        new RegExp(
            `(\\\\(?:${commandPattern})[^\\n]*)`,
            "g"
        );

    result =
        result.replace(
            regex,
            match => {

                return `
                    <span class="math-fragment">
                        \\(${match}\\)
                    </span>
                `;

            }
        );

    /*
       $를 직접 입력한 경우도
       호환되게 처리
    */

    result =
        result.replace(
            /\$([^$]+)\$/g,
            "\\($1\\)"
        );

    /*
       x^2, x_1 같은 기본 수식도
       자동 인식
    */

    result =
        result.replace(
            /([A-Za-z0-9)\]}]+(?:\^|_)[A-Za-z0-9{^}_+\-]+)/g,
            match => {

                if (
                    match.includes(
                        "math-fragment"
                    )
                ) {
                    return match;
                }

                return `
                    <span class="math-fragment">
                        \$begin:math:text$\$\{match\}\\$end:math:text$
                    </span>
                `;

            }
        );

    /*
       f(x), g(x), x+1 같은 간단한
       수식은 그대로 텍스트로 두되
       MathJax가 필요한 부분만 처리한다.
    */

    return result;
}


/* ============================
   미리보기
============================ */

function updatePreview() {

    const data =
        readEditor();

    const preview =
        document.getElementById(
            "preview"
        );

    let html = `

        <div class="problem-number">

            ${data.number}번
            ·
            ${data.score}점

        </div>

        <div class="problem-text">

            ${smartLatex(
                data.question
            )}

        </div>

    `;


    if (
        data.type ===
        "multiple"
    ) {

        html += `
            <div class="choices-preview">
        `;

        data.choices.forEach(
            (choice, index) => {

                html += `

                    <div
                        class="choice-preview"
                    >

                        <div
                            class="choice-circle"
                        >
                            ${index + 1}
                        </div>

                        <div>
                            ${smartLatex(
                                choice
                            )}
                        </div>

                    </div>

                `;

            }
        );

        html += `
            </div>
        `;

    } else {

        html += `

            <div
                style="
                    margin-top:25px;
                    color:var(--sub);
                "
            >
                답:
                ____________________
            </div>

        `;

    }


    preview.innerHTML =
        html;


    if (
        window.MathJax
        &&
        MathJax.typesetPromise
    ) {

        MathJax.typesetClear(
            [preview]
        );

        MathJax.typesetPromise(
            [preview]
        )
        .then(() => {

            checkMathErrors(
                preview
            );

        })
        .catch(() => {

            markMathError(
                preview
            );

        });

    }
}


/* ============================
   잘못된 LaTeX 검사
============================ */

function checkMathErrors(container) {

    const mathElements =
        container.querySelectorAll(
            ".math-fragment"
        );

    mathElements.forEach(
        element => {

            /*
               MathJax가 에러를 표시하는 경우
               해당 부분을 빨간색으로 변경
            */

            const error =
                element.querySelector(
                    ".mjx-error"
                );

            if (error) {

                element.classList.add(
                    "invalid-math"
                );

            }

        }
    );
}


function markMathError(container) {

    const elements =
        container.querySelectorAll(
            ".math-fragment"
        );

    elements.forEach(
        e =>
            e.classList.add(
                "invalid-math"
            )
    );
}


/* ============================
   LaTeX 버튼 입력
============================ */

function insertLatex(value) {

    const textarea =
        document.getElementById(
            "question"
        );

    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;

    const text =
        textarea.value;

    textarea.value =
        text.slice(
            0,
            start
        )
        +
        value
        +
        text.slice(
            end
        );

    textarea.focus();

    const position =
        start +
        value.length;

    textarea.setSelectionRange(
        position,
        position
    );

    updatePreview();

    autoSave();
}


/* ============================
   JSON 저장
============================ */

function saveJSON() {

    saveCurrent(false);

    const blob =
        new Blob(
            [
                JSON.stringify(
                    problems,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        "mathforge-problems.json";

    a.click();

    URL.revokeObjectURL(
        url
    );

    toast(
        "문제 파일을 저장했습니다."
    );
}


/* ============================
   JSON 불러오기
============================ */

function loadJSON(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload =
        e => {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );

                if (
                    !Array.isArray(
                        data
                    )
                ) {

                    throw new Error();

                }

                problems =
                    data;

                currentId =
                    problems[0].id;

                saveStorage();

                loadProblem(
                    currentId
                );

                toast(
                    "문제를 불러왔습니다."
                );

            } catch {

                alert(
                    "올바른 문제 파일이 아닙니다."
                );

            }

        };

    reader.readAsText(
        file
    );
}

    const win =

        );

    let html = `

        <!DOCTYPE html>

        <html>

        <head>

        <meta charset="UTF-8">

        <script>

        window.MathJax = {

            tex: {

                    [['\\\$begin:math:text$\'\, \'\\\\\\$end:math:text$']],

                displayMath:
                    [['\\\$begin:math:display$\'\, \'\\\\\\$end:math:display$']]

            }

        };

        <\/script>

        <script
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
        ><\/script>

        <style>

                sans-serif;

        </h1>

    `;


    problems.forEach(

            html += `

                    class="problem"
                >

                    </strong>

                    <span>

                    </span>

                    <div

    html += `

    win.document.write(

    );

    win.document.close();

}


/* ============================
   다크모드
============================ */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(
        "mathforge-dark",
        document.body.classList.contains(
            "dark"
        )
    );
}


/* ============================
   HTML 보호
============================ */

function escapeHTML(str) {

    return String(str)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* ============================
   알림
============================ */

function toast(message) {

    const el =
        document.getElementById(
            "toast"
        );

    el.textContent =
        message;

    el.classList.add(
        "show"
    );

    setTimeout(
        () => {

            el.classList.remove(
                "show"
            );

        },
        1800
    );
}

[
