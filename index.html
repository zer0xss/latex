<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MathForge</title>

<script>
window.MathJax = {
    tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
    },
    svg: {
        fontCache: 'global'
    },
    options: {
        enableMenu: false
    }
};
</script>

<script
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js">
</script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #17181c;
    --sub: #747984;
    --border: #dfe2e8;
    --accent: #4f46e5;
    --accent2: #4338ca;
    --danger: #ef4444;
    --danger-bg: #fff1f2;
    --shadow: 0 5px 22px rgba(0,0,0,.055);
}

body.dark {
    --bg: #101114;
    --panel: #181a1f;
    --text: #f4f4f5;
    --sub: #999fa9;
    --border: #2b2e35;
    --danger-bg: #32191d;
    --shadow: 0 5px 22px rgba(0,0,0,.25);
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.topbar {
    height: 58px;

    background: var(--panel);
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.logo span {
    color: var(--accent);
}

.top-actions {
    display: flex;
    gap: 6px;
}

.btn {
    border: 1px solid var(--border);

    background: var(--panel);
    color: var(--text);

    border-radius: 8px;

    padding: 8px 11px;

    transition: .15s;
}

.btn:hover {
    border-color: var(--accent);
}

.btn.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

.btn.primary:hover {
    background: var(--accent2);
}

.btn.danger {
    color: var(--danger);
}


/* =========================
   전체 구조
========================= */

.layout {
    max-width: 1550px;

    margin: 0 auto;

    padding: 9px;

    display: grid;

    /*
       목록 / 편집 / 미리보기
    */

    grid-template-columns:
        245px
        minmax(450px, 1fr)
        minmax(450px, 1fr);

    gap: 7px;
}


/* =========================
   패널
========================= */

.panel {
    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 10px;

    box-shadow: var(--shadow);

    overflow: hidden;
}

.panel-header {
    height: 50px;

    padding: 0 13px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}

.panel-title {
    font-size: 14px;
    font-weight: 750;
}

.panel-body {
    padding: 13px;
}


/* =========================
   입력
========================= */

.field {
    margin-bottom: 13px;
}

label {
    display: block;

    color: var(--sub);

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;

    background: var(--panel);
    color: var(--text);

    border: 1px solid var(--border);

    border-radius: 8px;

    outline: none;

    padding: 9px 10px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--accent);

    box-shadow:
        0 0 0 3px
        rgba(79,70,229,.1);
}

textarea {
    min-height: 330px;

    resize: vertical;

    line-height: 1.75;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
}

.row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;
}


/* =========================
   유형
========================= */

.type-tabs {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 5px;
}

.type-tab {
    padding: 9px;

    border: 1px solid var(--border);

    border-radius: 8px;

    background: var(--panel);

    color: var(--text);
}

.type-tab.active {
    background: var(--accent);

    color: white;

    border-color: var(--accent);
}


/* =========================
   수식 버튼
========================= */

.math-toolbar {
    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-bottom: 7px;
}

.math-btn {
    border: 1px solid var(--border);

    background: var(--bg);

    color: var(--text);

    border-radius: 6px;

    padding: 6px 8px;

    font-size: 12px;
}

.math-btn:hover {
    color: var(--accent);

    border-color: var(--accent);
}


/* =========================
   미리보기
========================= */

.preview-paper {
    padding: 28px 30px;

    min-height: 700px;

    font-size: 17px;

    line-height: 1.9;
}

.problem-number {
    color: var(--sub);

    font-size: 13px;

    margin-bottom: 14px;
}

.problem-body {
    white-space: pre-wrap;

    word-break: break-word;
}

.math-error {
    color: var(--danger) !important;

    background: var(--danger-bg);

    border-radius: 4px;

    padding: 2px 4px;
}


/* =========================
   선택지
========================= */

.choices {
    margin-top: 22px;

    display: flex;

    flex-direction: column;

    gap: 11px;
}

.choice-preview {
    display: flex;

    align-items: flex-start;

    gap: 10px;
}

.choice-number {
    width: 25px;
    height: 25px;

    min-width: 25px;

    border: 1px solid var(--border);

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 12px;
}


/* =========================
   선택지 편집
========================= */

.choice-editor {
    display: flex;

    gap: 6px;

    margin-bottom: 6px;
}

.choice-editor input[type="text"] {
    flex: 1;
}

.choice-editor button {
    width: 34px;

    border: 1px solid var(--border);

    border-radius: 7px;

    background: transparent;

    color: var(--danger);
}


/* =========================
   문제 목록
========================= */

.problem-list {
    max-height:
        calc(100vh - 120px);

    overflow-y: auto;
}

.problem-item {
    padding: 11px 12px;

    border-bottom: 1px solid var(--border);

    cursor: pointer;
}

.problem-item:hover {
    background: var(--bg);
}

.problem-item.active {
    background:
        rgba(79,70,229,.09);
}

.problem-title {
    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.problem-meta {
    color: var(--sub);

    font-size: 11px;

    margin-top: 3px;
}

.status {
    color: var(--sub);

    font-size: 11px;
}


/* =========================
   토스트
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform:
        translate(-50%, 20px);

    background: #202228;

    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    opacity: 0;

    pointer-events: none;

    transition: .2s;

    z-index: 200;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

.hidden {
    display: none !important;
}


/* =========================
   모바일
========================= */

@media(max-width:1100px) {

    .layout {
        grid-template-columns:
            220px
            1fr;
    }

    .preview-panel {
        grid-column:
            1 / -1;
    }
}

@media(max-width:700px) {

    .layout {
        display: flex;

        flex-direction: column;
    }

    .problem-list-panel {
        order: 2;
    }

    .editor-panel {
        order: 1;
    }

    .preview-panel {
        order: 3;
    }

    .top-actions .optional {
        display: none;
    }

    .preview-paper {
        padding: 22px 18px;
    }

}

</style>
</head>


<body>


<!-- =========================
     상단
========================= -->

<header class="topbar">

    <div class="logo">
        Math<span>Forge</span>
    </div>

    <div class="top-actions">

        <button
            class="btn optional"
            onclick="newProblem()"
        >
            ＋ 새 문제
        </button>

        <button
            class="btn optional"
            onclick="saveJSON()"
        >
            저장
        </button>

        <button
            class="btn optional"
            onclick="
                document
                .getElementById('fileInput')
                .click()
            "
        >
            불러오기
        </button>

        <button
            class="btn"
            onclick="toggleDark()"
        >
            ◐
        </button>

        <button
            class="btn primary"
            onclick="printProblems()"
        >
            🖨
        </button>

    </div>

</header>


<input
    id="fileInput"
    type="file"
    accept=".json"
    style="display:none"
    onchange="loadJSON(event)"
>


<div class="layout">


<!-- ==================================================
     문제 목록
================================================== -->

<section class="panel problem-list-panel">

    <div class="panel-header">

        <div class="panel-title">
            문제
        </div>

        <button
            class="btn"
            onclick="newProblem()"
        >
            ＋
        </button>

    </div>


    <div class="panel-body">

        <input
            id="search"
            placeholder="문제 검색..."
            oninput="renderProblemList()"
        >

    </div>


    <div
        id="problemList"
        class="problem-list"
    ></div>

</section>



<!-- ==================================================
     문제 편집
================================================== -->

<section class="panel editor-panel">

    <div class="panel-header">

        <div class="panel-title">
            문제 입력
        </div>

        <div
            id="saveStatus"
            class="status"
        >
            자동 저장됨
        </div>

    </div>


    <div class="panel-body">


        <div class="row">


            <div class="field">

                <label>
                    번호
                </label>

                <input
                    id="number"
                    type="number"
                    value="1"
                >

            </div>


            <div class="field">

                <label>
                    배점
                </label>

                <input
                    id="score"
                    type="number"
                    value="5"
                >

            </div>


        </div>



        <div class="row">


            <div class="field">

                <label>
                    난이도
                </label>

                <select id="difficulty">

                    <option>
                        쉬움
                    </option>

                    <option selected>
                        보통
                    </option>

                    <option>
                        어려움
                    </option>

                    <option>
                        최상
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    유형
                </label>

                <div class="type-tabs">

                    <button
                        class="type-tab active"
                        onclick="
                            setType('multiple')
                        "
                    >
                        객관식
                    </button>

                    <button
                        class="type-tab"
                        onclick="
                            setType('short')
                        "
                    >
                        주관식
                    </button>

                </div>

            </div>


        </div>



        <!-- 수식 도구 -->

        <div class="field">

            <label>
                문제

            <div class="math-toolbar">


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            '\\frac{a}{b}'
                        )
                    "
                >
                    ½
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            '\\sqrt{x}'
                        )
                    "
                >
                    √
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            'x^2'
                        )
                    "
                >
                    x²
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            'x_n'
                        )
                    "

                    xₙ
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(

                        )

                    lim

                <button
                    class="math-btn"

                    onclick="
                        insertLatex(
                            '\\int_a^b'
                        )
                    "
                >
                    ∫
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            '\\pi'
                        )
                    "
                >
                    π
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            '\\sin x'

                >
                    sin

                <button

                    onclick="
                        insertLatex(

                >
                    cos
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            '\\tan x'

                    "
                >
                    tan
                </button>


                <button
                    class="math-btn"
                    onclick="
                        insertLatex(
                            '\\to'

                >
                    →
                </button>


            </div>


            <textarea

                spellcheck="false"
                placeholder="문제를 입력하세요.

예:

함수 f(x)=x^2-3x+2에 대하여
f(1)의 값을 구하여라.

리미트:

lim_{n\to\infty} (1+\frac{1}{n})^n

시그마:

\sum_{k=1}^{n} k

적분:

\int_0^1 x^2 dx

※ $ 기호를 입력할 필요가 없습니다."
            ></textarea>

        </div>



        <!-- 객관식 -->

        <div

            <label>
                선택지

            <div id="choices"></div>

>

            미리보기

            LIVE

    </div>

        id="preview"
        class="preview-paper"
    ></div>

</section>


</div>


<div
    id="toast"
    class="toast"
></div>



<script>


/* ==================================================
   데이터
================================================== */

let problems = [];

let currentId = null;

let currentType = "multiple";

let autoSaveTimer = null;



/* ==================================================
   기본 문제
================================================== */

function createDefaultProblem() {

    return {

        id: Date.now(),

        number: 1,

        score: 5,

        difficulty: "보통",

        type: "multiple",

        question:
`함수 f(x)=x^2-3x+2에 대하여
f(1)의 값을 구하여라.`,

        choices: [
            "0",
            "1",
            "2",
            "3",
            "4"
        ],

        answer: 0,

        shortAnswer: ""

    };

}



/* ==================================================
   초기화
================================================== */

function init() {

    const saved =
        localStorage.getItem(
            "mathforge-problems"
        );

    if (saved) {

        try {

            problems =
                JSON.parse(saved);

        } catch {

            problems = [
                createDefaultProblem()
            ];

        }

    }


    if (!Array.isArray(problems) ||
        problems.length === 0) {

        problems = [
            createDefaultProblem()
        ];

    }


    currentId =
        problems[0].id;


    loadProblem(
        currentId
    );

}



/* ==================================================
   현재 문제
================================================== */

function getCurrent() {

    return problems.find(
        p =>
            p.id === currentId
    );

}



/* ==================================================
   문제 불러오기
================================================== */

function loadProblem(id) {

    const p =
        problems.find(
            x =>
                x.id === id
        );

    if (!p) return;


    currentId = id;


    document.getElementById(
        "number"
    ).value =
        p.number;


    document.getElementById(
        "score"
    ).value =
        p.score;


    document.getElementById(
        "difficulty"
    ).value =
        p.difficulty;


    document.getElementById(
        "question"
    ).value =
        p.question || "";


    document.getElementById(
        "shortAnswer"
    ).value =
        p.shortAnswer || "";


    currentType =
        p.type || "multiple";


    renderChoices(
        p.choices || []
    );


    updateTypeUI();

    updatePreview();

    renderProblemList();

}



/* ==================================================
   문제 유형
================================================== */

function setType(type) {

    currentType = type;

    updateTypeUI();

    updatePreview();

    autoSave();

}


function updateTypeUI() {

    const tabs =
        document.querySelectorAll(
            ".type-tab"
        );


    tabs.forEach(
        t =>
            t.classList.remove(
                "active"
            )
    );


    if (
        currentType ===
        "multiple"
    ) {

        tabs[0].classList.add(
            "active"
        );

    } else {

        tabs[1].classList.add(
            "active"
        );

    }


    document
        .getElementById(
            "choicesSection"
        )
        .classList.toggle(
            "hidden",
            currentType !== "multiple"
        );


    document
        .getElementById(
            "shortAnswerSection"
        )
        .classList.toggle(
            "hidden",
            currentType !== "short"
        );

}



/* ==================================================
   선택지
================================================== */

function getChoices() {

    return [
        ...document.querySelectorAll(
            "#choices input[type=text]"
        )
    ].map(
        x => x.value
    );

}


function getAnswer() {

    const p =
        getCurrent();

    return p?.answer ?? 0;

}


function renderChoices(choices) {

    const container =
        document.getElementById(
            "choices"
        );

    container.innerHTML = "";


    choices.forEach(
        (text, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "choice-editor";


            row.innerHTML = `

                <input
                    type="radio"
                    name="answer"
                    ${
                        getAnswer() === index
                            ? "checked"
                            : ""
                    }
                    onchange="
                        setAnswer(${index})
                    "
                >

                <input
                    type="text"
                    value="${escapeHTML(text)}"
                    placeholder="선택지 ${index + 1}"
                >

                <button
                    onclick="
                        removeChoice(${index})
                    "
                >
                    ×
                </button>

            `;


            row
                .querySelector(
                    'input[type="text"]'
                )
                .addEventListener(
                    "input",
                    () => {

                        updatePreview();

                        autoSave();

                    }
                );


            container.appendChild(
                row
            );

        }
    );

}


function setAnswer(index) {

    const p =
        getCurrent();

    if (p) {

        p.answer =
            index;

    }

    autoSave();

    updatePreview();

}


function addChoice() {

    const choices =
        getChoices();

    choices.push("");

    renderChoices(
        choices
    );

    updatePreview();

    autoSave();

}


function removeChoice(index) {

    const choices =
        getChoices();

    choices.splice(
        index,
        1
    );


    if (
        choices.length === 0
    ) {

        choices.push("");

    }


    const p =
        getCurrent();


    if (p) {

        p.answer =
            Math.min(
                p.answer || 0,
                choices.length - 1
            );

    }


    renderChoices(
        choices
    );

    updatePreview();

    autoSave();

}



/* ==================================================
   에디터 데이터
================================================== */

function readEditor() {

    return {

        number:
            Number(
                document.getElementById(
                    "number"
                ).value
            ) || 1,

        score:
            Number(
                document.getElementById(
                    "score"
                ).value
            ) || 0,

        difficulty:
            document.getElementById(
                "difficulty"
            ).value,

        type:
            currentType,

        question:
            document.getElementById(
                "question"
            ).value,

        choices:
            getChoices(),

        answer:
            getAnswer(),

        shortAnswer:
            document.getElementById(
                "shortAnswer"
            ).value

    };

}



/* ==================================================
   저장
================================================== */

function saveCurrent(show = true) {

    const p =
        getCurrent();

    if (!p) return;


    Object.assign(
        p,
        readEditor()
    );


    saveStorage();

    renderProblemList();

    updatePreview();


    if (show) {

        toast(
            "저장되었습니다."
        );

    }

}


function autoSave() {

function deleteProblem() {

    if (
        problems.length <= 1
    ) {

        toast(
            "최소 한 문제는 있어야 합니다."
        );

        return;

    }


    if (
        !confirm(
            "이 문제를 삭제할까요?"
        )
    ) return;


    const index =
        problems.findIndex(
            p =>
                p.id === currentId
        );


    problems.splice(
        index,
        1
    );


    const nextIndex =
        Math.max(
            0,
            index - 1
        );


    currentId =
        problems[
            nextIndex
        ].id;


    loadProblem(
        currentId
    );


    saveStorage();


    toast(
        "삭제되었습니다."
    );

}

/* ==================================================
   핵심 LaTeX 파서
================================================== */

/*
    사용자가 입력:

    lim_{n\to\infty}

    실제 MathJax에 전달:

    \(\displaystyle \lim_{n\to\infty}\)

    따라서 $를 직접 입력할 필요가 없다.
*/


const LATEX_COMMANDS = [

    "frac",
    "dfrac",

    "sqrt",

    "lim",
    "sup",
    "inf",
    "max",
    "min",

    "sum",
    "prod",

    "int",
    "iint",
    "iiint",

    "sin",
    "cos",
    "tan",

    "log",
    "ln",

    "pi",
    "infty",

    "alpha",
    "beta",
    "gamma",
    "delta",
    "theta",
    "lambda",
    "mu",
    "sigma",

    "to",
    "cdot",
    "times",

    "leq",
    "geq",
    "neq",

    "pm",

    "left",
    "right"

];


function isLatexCommandAt(
    text,
    index
) {

    if (
        text[index] !== "\\"
    ) {
        return null;
    }


    const part =
        text.slice(
            index + 1
        );


    const match =
        part.match(
            /^[A-Za-z]+/
        );


    if (!match) {
        return null;
    }


    const command =
        match[0];


    if (
        !LATEX_COMMANDS.includes(
            command
        )
    ) {
        return null;
    }


    return {

        command,

        end:
            index +
            1 +
            command.length

    };

}



/* 괄호 깊이 */

function readBalanced(
    text,
    start
) {

    if (
        text[start] !== "{"
    ) {

        return start;

    }


    let depth = 0;


    for (
        let i = start;
        i < text.length;
        i++
    ) {

        if (
            text[i] === "{"
        ) {

            depth++;

        }
        else if (
            text[i] === "}"
        ) {

            depth--;

            if (
                depth === 0
            ) {

                return i + 1;

            }

        }

    }


    return -1;

}



/*
    LaTeX 명령 뒤의
    {...}, _{...}, ^{...}
    등을 함께 읽는다.
*/

function readLatexExpression(
    text,
    start
) {

    const commandInfo =
        isLatexCommandAt(
            text,
            start
        );


    if (!commandInfo) {
        return null;
    }


    let end =
        commandInfo.end;


    /*
       \lim, \sum, \int 등은
       \displaystyle로 크게 표시.
    */

    const command =
        commandInfo.command;


    while (
        end < text.length
    ) {

        const ch =
            text[end];


        /*
           아래첨자
        */

        if (
            ch === "_"
        ) {

            end++;

            if (
                text[end] === "{"
            ) {

                const next =
                    readBalanced(
                        text,
                        end
                    );

                if (
                    next === -1
                ) {

                    return {
                        end: text.length,
                        valid: false
                    };

                }

                end = next;

            }
            else {

                if (
                    end < text.length
                ) {

                    end++;

                }

            }

            continue;

        }


        /*
           위첨자
        */

        if (
            ch === "^"
        ) {

            end++;

            if (
                text[end] === "{"
            ) {

                const next =
                    readBalanced(
                        text,
                        end
                    );

                if (
                    next === -1
                ) {

                    return {
                        end: text.length,
                        valid: false
                    };

                }

                end = next;

            }
            else {

                if (
                    end < text.length
                ) {

                    end++;

                }

            }

            continue;

        }


        /*
           \frac{...}{...}
           \sqrt{...}
        */

        if (
            ch === "{"
        ) {

            const next =
                readBalanced(
                    text,
                    end
                );


            if (
                next === -1
            ) {

                return {

                    end: text.length,

                    valid: false

                };

            }


            end =
                next;

            continue;

        }


        /*
           공백이 나오면
           일반 수식은 여기서 종료.

           단, \lim 뒤의 공백은
           뒤의 일반 식과 분리하기 위해 종료.
        */

        if (
            /\s/.test(ch)
        ) {

            break;

        }


        /*
           일반 문장 기호
        */

        if (
            ",.;:!?".includes(ch)
        ) {

            break;

        }


        /*
           일반 글자가 이어지면
           간단한 수식으로 포함.
        */

        if (
            /[A-Za-z0-9]/.test(ch)
        ) {

            end++;

            continue;

        }


        break;

    }


    return {

        start,

        end,

        command,

        valid: true

    };

}



/* ==================================================
   텍스트 → MathJax
================================================== */

function renderText(
    text
) {

    let html = "";

    let i = 0;

    let buffer = "";


    function flushText() {

        if (
            buffer
        ) {

            html +=
                escapeHTML(
                    buffer
                );

            buffer = "";

        }

    }


    while (
        i < text.length
    ) {

        /*
           사용자가 예전 방식으로
           $...$를 넣어도 지원.
        */

        if (
            text[i] === "$"
        ) {

            const close =
                text.indexOf(
                    "$",
                    i + 1
                );


            if (
                close !== -1
            ) {

                flushText();


                const latex =
                    text.slice(
                        i + 1,
                        close
                    );


                html +=
                    makeMath(
                        latex
                    );


                i =
                    close + 1;


                continue;

            }

        }


        /*
           LaTeX 명령 발견
        */

        if (
            text[i] === "\\"
        ) {

            const expr =
                readLatexExpression(
                    text,
                    i
                );


            if (expr) {

                flushText();


                const latex =
                    text.slice(
                        expr.start,
                        expr.end
                    );


                html +=
                    makeMath(
                        latex,
                        expr.valid
                    );


                i =
                    expr.end;


                continue;

            }

        }


        buffer +=
            text[i];

        i++;

    }


    flushText();


    /*
       줄바꿈
    */

    return html.replace(
        /\n/g,
        "<br>"
    );

}



/* ==================================================
   MathJax 수식
================================================== */

function makeMath(
    latex,
    valid = true
) {

    /*
       \lim, \sum, \int는
       displaystyle을 적용.

       그래서

       \lim_{n\to\infty}

       에서 n→∞가
       lim 아래에 제대로 내려간다.
    */

    const operator =
        /^\\(lim|sum|prod|int|iint|iiint|max|min|sup|inf)\b/
            .test(
                latex
            );


    let expression =
        latex;


    if (
        operator
    ) {

        expression =
            "\\displaystyle " +
            expression;

    }


    return `
        <span
            class="
                math-expression
                ${valid ? "" : "math-error"}
            "
        >
            \\(${expression}\\)
        </span>
    `;

}



/* ==================================================
   미리보기
================================================== */

function updatePreview() {

    const data =
        readEditor();


    const preview =
        document.getElementById(
            "preview"
        );


    let html = `

        <div
            class="problem-number"
        >
            ${data.number}번
            ·
            ${data.score}점
        </div>

        <div
            class="problem-body"
        >
            ${renderText(
                data.question
            )}
        </div>

    `;


    if (
        data.type ===
        "multiple"
    ) {

        html += `
            <div class="choices">
        `;


        data.choices.forEach(
            (choice, index) => {

                html += `

                    <div
                        class="choice-preview"
                    >

                        <div
                            class="choice-number"
                        >
                            ${index + 1}
                        </div>

                        <div>
                            ${renderText(
                                choice
                            )}
                        </div>

                    </div>

                `;

            }
        );


        html += `
            </div>
        `;

    }
    else {

        html += `

            <div
                style="
                    margin-top:25px;
                    color:var(--sub);
                "
            >
                답:
                ______________________
            </div>

        `;

    }


    preview.innerHTML =
        html;


    if (
        window.MathJax
        &&
        MathJax.typesetPromise
    ) {

        try {

            MathJax.typesetClear(
                [preview]
            );

        } catch {}


        MathJax.typesetPromise(
            [preview]
        )
        .then(
            () => {

                detectMathErrors(
                    preview
                );

            }
        )
        .catch(
            () => {

                /*
                   전체를 빨갛게 만들지 않고
                   문제가 있는 수식만
                   가능한 범위에서 표시.
                */

                detectMathErrors(
                    preview
                );

            }
        );

    }

}



/* ==================================================
   MathJax 에러 표시
================================================== */

function detectMathErrors(
    container
) {

    const expressions =
        container.querySelectorAll(
            ".math-expression"
        );


    expressions.forEach(
        element => {

            const error =
                element.querySelector(
                    ".mjx-error"
                );


            if (
                error
            ) {

                element.classList.add(
                    "math-error"
                );

            }

        }
    );

}



/* ==================================================
   수식 버튼
================================================== */

function insertLatex(
    latex
) {

    const textarea =
        document.getElementById(
            "question"
        );


    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;


    const old =
        textarea.value;


    textarea.value =
        old.slice(
            0,
            start
        )
        +
        latex
        +
        old.slice(
            end
        );


    textarea.focus();


    const cursor =
        start +
        latex.length;


    textarea.setSelectionRange(
        cursor,
        cursor
    );


    updatePreview();

    autoSave();

}



/* ==================================================
   JSON
================================================== */

function saveJSON() {

    saveCurrent(false);


    const blob =
        new Blob(
            [
                JSON.stringify(
                    problems,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "MathForge-Problems.json";


    a.click();


    URL.revokeObjectURL(
        url
    );


    toast(
        "문제를 파일로 저장했습니다."
    );

}



/* ==================================================
   JSON 불러오기
================================================== */

function loadJSON(
    event
) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        e => {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !Array.isArray(
                        data
                    )
                ) {

                    throw new Error();

                }


                problems =
                    data;


                currentId =
                    problems[0].id;


                saveStorage();


                loadProblem(
                    currentId
                );


                toast(
                    "문제를 불러왔습니다."
                );


            }
            catch {

                alert(
                    "올바른 MathForge 파일이 아닙니다."
                );

            }

        };


    reader.readAsText(
        file
    );

}

/* ==================================================
   HTML escape
================================================== */

function escapeHTML(
    str
) {

    return String(str)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   Toast
================================================== */

function toast(

) {

    const element =
        document.getElementById(
            "toast"

    element.textContent =

    element.classList.add(

    );

    );

}
