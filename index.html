<html lang="ko">
<head>

<title>Math Problem Editor</title>

<script>
window.MathJax = {
    tex: {
        inlineMath: [
            ['\\(', '\\)']
        ],
        displayMath: [
            ['\\[', '\\]']
        ],
        processEscapes: false,
        processEnvironments: true
    },

    svg: {
        fontCache: 'global'
    }
};
</script>

<script
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"
    async>
</script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg:#f3f4f6;
    --panel:#ffffff;
    --text:#171717;
    --muted:#737373;
    --border:#dedede;
    --blue:#4f46e5;
    --red:#ef4444;
    --green:#16a34a;
}

body.dark {
    --bg:#101114;
    --panel:#191a1f;
    --text:#f5f5f5;
    --muted:#a1a1aa;
    --border:#30323a;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

header {
    height:58px;
    background:var(--panel);
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    position:sticky;
    top:0;
    z-index:10;
}

.logo {
    font-size:19px;
    font-weight:800;
}

.logo span {
    color:var(--blue);
}

.header-right {
    display:flex;
    align-items:center;
    gap:7px;
}

button {
    font:inherit;
}

.btn {
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);

    padding:8px 11px;

    border-radius:8px;

    cursor:pointer;
}

.btn:hover {
    border-color:var(--blue);
}

.primary {
    background:var(--blue);
    color:white;
    border-color:var(--blue);
}

.status {

    align-items:center;

}

.panel {

    border-radius:10px;

    overflow:hidden;
}

.panel-header {
    height:48px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.title {
    font-size:14px;
    font-weight:750;
}

.panel-body {
    padding:12px;
}

input,
select,
textarea {
    width:100%;

    color:var(--text);

}

input:focus,
select:focus,
textarea:focus {

}

label {
    display:block;

    font-weight:700;

    margin-bottom:6px;
}

.field {

}

.row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

#question {

    font-family:
        ui-monospace,
        SFMono-Regular,

    font-size:14px;
}

.toolbar {

    flex-wrap:wrap;

}

.tool:hover {

}

/*

*/

mjx-merror {

}

.problem.active {

}

.problem-title {
    font-size:13px;
    font-weight:700;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.problem-meta {
    color:var(--muted);

    margin-top:4px;
}

.choice-row input[type="text"] {

}

    background:transparent;

    padding:8px;

    border-radius:7px;

    background:var(--panel);

    color:var(--text);

    cursor:pointer;
}

.type.active {
    background:var(--blue);
    color:white;
    border-color:var(--blue);
}

.choices-preview {
    margin-top:25px;

    display:flex;

    flex-direction:column;

    gap:12px;
}

.choice-preview {
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.choice-number {

    height:25px;

    min-width:25px;

    border:1px solid var(--border);

    border-radius:50%;

    display:flex;

.hidden {

}

@media(max-width:1100px) {

    .layout {
        grid-template-columns:
            200px
            minmax(0,1fr);
    }

    .preview-panel {

    }
}

@media(max-width:700px) {

    .layout {
        display:flex;
        flex-direction:column;
    }

    .preview-panel {
        order:3;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        Math<span>Forge</span>
    </div>

    <div class="header-right">

        <div class="status" id="status">
            <span class="dot"></span>
            <span>저장됨</span>
        </div>

        <button
            class="btn"
            onclick="newProblem()">
            ＋ 새 문제
        </button>

        <button
            class="btn"
            onclick="exportData()">
            저장
        </button>

        <button
            class="btn"
            onclick="toggleDark()">
            ◐
        </button>

    </div>

</header>


<div class="layout">


<!-- 문제 목록 -->

<section class="panel">

    <div class="panel-header">

        <div class="title">
            문제
        </div>

        <button
            class="btn"
            onclick="newProblem()">
            ＋
        </button>

    </div>

    <div class="panel-body">

        <input
            id="search"
            class="search"
            placeholder="문제 검색">

    </div>

    <div
        id="problemList"
        class="problem-list">
    </div>

</section>


<!-- 입력 -->

<section class="panel">

    <div class="panel-header">

        <div class="title">
            문제 입력
        </div>

    </div>

    <div class="panel-body">

        <div class="row">

            <div class="field">

                <label>번호</label>

                <input
                    id="number"
                    type="number">

            </div>

            <div class="field">

                <label>배점</label>

                <input
                    id="score"
                    type="number">

            </div>

        </div>


        <div class="field">

            <label>문제 유형</label>

            <div class="types">

                <button
                    id="multiple"
                    class="type active"
                    onclick="setType('multiple')">
                    객관식
                </button>

                <button
                    id="short"
                    class="type"
                    onclick="setType('short')">
                    주관식
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                문제
            </label>


            <div class="toolbar">

                <button
                    class="tool"
                    onclick="insert('\\frac{}{}')">
                    frac
                </button>

                <button
                    class="tool"
                    onclick="insert('\\sqrt{}')">
                    √
                </button>

                <button
                    class="tool"
                    onclick="insert('\\lim_{n\\to\\infty}')">
                    lim
                </button>

                <button
                    class="tool"
                    onclick="insert('\\sum_{k=1}^{n}')">
                    Σ
                </button>

                <button
                    class="tool"
                    onclick="insert('\\int_0^1')">
                    ∫
                </button>

                <button
                    class="tool"
                    onclick="insert('\\pi')">
                    π
                </button>

                <button
                    class="tool"
                    onclick="insert('x^2')">
                    x²
                </button>

            </div>


            <textarea
                id="question"
                spellcheck="false"
                placeholder="문제를 입력하세요.

예:

함수 f(x)에 대하여
\lim_{x\to0}\frac{\sin x}{x}
의 값을 구하여라."></textarea>

        </div>


        <div
            id="choiceArea"
            class="field">

            <label>
                선택지
            </label>

            <div id="choices"></div>

            <button
                class="btn"
                onclick="addChoice()">
                ＋ 선택지
            </button>

        </div>


        <div
            id="answerArea"

            <label>
                정답
            </label>

                id="answer"

        <div

                display:flex;
                gap:6px;
            ">

<!-- 미리보기 -->

<section class="panel preview-panel">

    <div class="panel-header">

        <div class="title">
            미리보기
        </div>

            style="
                font-size:11px;
                color:#16a34a;
            ">

        </div>

    </div>

    <div
        id="preview"

    </div>

</section>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =================================================
   DATA
================================================= */

let problems = [];

let current = null;

let type = "multiple";

let saveTimer = null;

let mathJaxReady = false;


/* =================================================
   INIT MATHJAX
================================================= */

window.addEventListener(
    "load",
    async () => {

        try {

            await MathJax.startup.promise;

            mathJaxReady = true;

            render();

        }
        catch(error) {

            console.error(
                "MathJax loading failed:",
                error
            );

        }

    }
);


/* =================================================
   INIT APP
================================================= */

function init() {

    const data =
        localStorage.getItem(
            "mathforge-problems"
        );

    if(data) {

        try {

            problems =
                JSON.parse(data);

        }
        catch {

            problems = [];

        }

    }

    if(
        !Array.isArray(problems)
        ||
        problems.length === 0
    ) {

        problems = [
            {
                id:Date.now(),

                number:1,

                score:5,

                type:"multiple",

                question:
`함수 f(x)에 대하여
\\lim_{x\\to0}\\frac{\\sin x}{x}
의 값을 구하여라.`,

                choices:[
                    "0",
                    "1",
                    "2",
                    "3",
                    "4"
                ],

                answer:1,

                shortAnswer:""

            }
        ];

    }

    current =
        problems[0].id;

    load(current);

    list();

}


/* =================================================
   GET CURRENT
================================================= */

function getCurrent() {

    return problems.find(
        p => p.id === current
    );

}


/* =================================================
   LOAD
================================================= */

function load(id) {

    const p =
        problems.find(
            x => x.id === id
        );

    if(!p) return;

    current = id;

    document
        .getElementById("number")
        .value =
        p.number;

    document
        .getElementById("score")
        .value =
        p.score;

    document
        .getElementById("question")
        .value =
        p.question || "";

    document
        .getElementById("answer")
        .value =
        p.shortAnswer || "";

    type =
        p.type || "multiple";

    renderChoices(
        p.choices || []
    );

    updateType();

    list();

    render();

}


/* =================================================
   READ
================================================= */

function read() {

    const p =
        getCurrent();

    return {

        number:
            Number(
                document
                    .getElementById(
                        "number"
                    ).value
            ) || 1,

        score:
            Number(
                document
                    .getElementById(
                        "score"
                    ).value
            ) || 0,

        type:type,

        question:
            document
                .getElementById(
                    "question"
                ).value,

        choices:
            getChoices(),

        answer:
            p?.answer || 0,

        shortAnswer:
            document
                .getElementById(
                    "answer"
                ).value

    };

}


/* =================================================
   SAVE
================================================= */

function save(show=true) {

    const p =
        getCurrent();

    if(!p) return;

    Object.assign(
        p,
        read()
    );

    localStorage.setItem(
        "mathforge-problems",
        JSON.stringify(problems)
    );

    setSaved();

    list();

    if(show)
        toast("저장되었습니다.");

}


function autoSave() {

    setDirty();

    clearTimeout(
        saveTimer
    );

    saveTimer =
        setTimeout(
            () => save(false),
            400
        );

}


function setDirty() {

    document
        .getElementById("status")
        .innerHTML =
        `
        <span class="dot dirty"></span>
        <span>저장 중...</span>
        `;

}


function setSaved() {

    const time =
        new Date()
            .toLocaleTimeString(
                "ko-KR",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );

    document
        .getElementById("status")
        .innerHTML =
        `
        <span class="dot"></span>
        <span>저장됨 · ${time}</span>
        `;

}


/* =================================================
   TYPE
================================================= */

function setType(newType) {

    type = newType;

    updateType();

    render();

    autoSave();

}


function updateType() {

    document
        .getElementById("multiple")
        .classList.toggle(
            "active",
            type === "multiple"
        );

    document
        .getElementById("short")
        .classList.toggle(
            "active",
            type === "short"
        );

    document
        .getElementById("choiceArea")
        .classList.toggle(
            "hidden",
            type !== "multiple"
        );

    document
        .getElementById("answerArea")
        .classList.toggle(
            "hidden",
            type !== "short"
        );

}


/* =================================================
   CHOICES
================================================= */

function getChoices() {

    return [
        ...document.querySelectorAll(
            "#choices input[type=text]"
        )
    ].map(
        x => x.value
    );

}


function renderChoices(values) {

    const box =
        document.getElementById(
            "choices"
        );

    box.innerHTML = "";

    values.forEach(
        (value,index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "choice-row";

            const radio =
                document.createElement(
                    "input"
                );

            radio.type = "radio";

            radio.name = "correct";

            radio.checked =
                getCurrent()?.answer === index;

            radio.onchange =
                () => {

                    const p =
                        getCurrent();

                    if(p)
                        p.answer = index;

                    autoSave();

                    render();

                };


            const input =
                document.createElement(
                    "input"
                );

            input.type = "text";

            input.value = value;

            input.oninput =
                () => {

                    render();

                    autoSave();

                };


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "remove";

            remove.textContent = "×";

            remove.onclick =
                () => {

                    const arr =
                        getChoices();

                    arr.splice(
                        index,
                        1
                    );

                    if(
                        arr.length === 0
                    )
                        arr.push("");

                    renderChoices(arr);

                    render();

                    autoSave();

                };


            row.append(
                radio,
                input,
                remove
            );

            box.appendChild(row);

        }
    );

}


function addChoice() {

    const arr =
        getChoices();

    arr.push("");

    renderChoices(arr);

    autoSave();

}


/* =================================================
   NEW
================================================= */

function newProblem() {

    const p = {

        id:Date.now(),

        number:
            problems.length + 1,

        score:5,

        type:"multiple",

        question:"",

        choices:[
            "",
            "",
            "",
            "",
            ""
        ],

        answer:0,

        shortAnswer:""

    };

    problems.unshift(p);

    current = p.id;

    load(p.id);

    localStorage.setItem(
        "mathforge-problems",
        JSON.stringify(problems)
    );

    toast(
        "새 문제가 생성되었습니다."
    );

}


/* =================================================
   DUPLICATE
================================================= */

function duplicate() {

    const p =
        getCurrent();

    if(!p) return;

    const copy =
        JSON.parse(
            JSON.stringify(p)
        );

    copy.id =
        Date.now();

    copy.number =
        problems.length + 1;

    problems.unshift(copy);

    current =
        copy.id;

    load(copy.id);

    save(false);

    toast(
        "문제를 복제했습니다."
    );

}


/* =================================================
   DELETE
================================================= */

function removeProblem() {

    if(
        problems.length <= 1
    ) {

        toast(
            "최소 한 문제는 필요합니다."
        );

        return;

    }

    if(
        !confirm(
            "현재 문제를 삭제할까요?"
        )
    )
        return;

    const index =
        problems.findIndex(
            p => p.id === current
        );

    problems.splice(
        index,
        1
    );

    current =
        problems[
            Math.max(
                0,
                index - 1
            )
        ].id;

    load(current);

    save(false);

}


/* =================================================
   LIST
================================================= */

function list() {

    const box =
        document.getElementById(
            "problemList"
        );

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase();

    box.innerHTML = "";

    problems
        .filter(
            p =>
                String(p.number)
                    .includes(search)
                ||
                String(p.question)
                    .toLowerCase()
                    .includes(search)
        )
        .forEach(
            p => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "problem";

                if(
                    p.id === current
                )
                    div.classList.add(
                        "active"
                    );

                const title =
                    p.question
                        .replace(
                            /\n/g,
                            " "
                        )
                        .slice(
                            0,
                            45
                        );

                div.innerHTML =
                    `
                    <div class="problem-title">
                        ${p.number}.
                        ${escapeHTML(
                            title ||
                            "새 문제"
                        )}
                    </div>

                    <div class="problem-meta">
                        ${p.score}점
                        ·
                        ${
                            p.type === "multiple"
                            ? "객관식"
                            : "주관식"
                        }
                    </div>
                    `;

                div.onclick =
                    () => load(p.id);

                box.appendChild(div);

            }
        );

}


/* =================================================
   IMPORTANT:
   LATEX RENDERER
================================================= */

/*
    여기서는 LaTeX 명령을 변형하지 않는다.

    입력:

        \lim_{n\to\infty}
        \frac{1}{n}

    를

        \lim_{n\to\infty}
        \frac{1}{n}

    그대로 유지한다.

    단지 MathJax가 인식할 수 있도록
    \(...\) 로 감싸는 역할만 한다.

    LaTeX 자체는 건드리지 않는다.
*/


function convertForMathJax(text) {

    /*
       이미 구분자가 있는 경우
       그대로 유지한다.
    */

    if(
        text.includes("\\(")
        ||
        text.includes("\\[")
    ) {

        return text;

    }


    /*
       줄 단위로 처리한다.

       LaTeX 명령이 들어간 줄은
       수식 줄로 취급한다.
    */

    const lines =
        text.split("\n");

    return lines.map(
        line => {

            const trimmed =
                line.trim();

            /*
               LaTeX 명령이 시작되는
               대표적인 경우.
            */

            const isMath =
                /^\\(frac|dfrac|tfrac|sqrt|lim|sum|prod|int|oint|sin|cos|tan|log|ln|max|min|exp|det|binom|begin|left|right|mathbf|mathrm|mathbb|overline|underline|vec|hat|bar|alpha|beta|gamma|theta|pi|infty|to|pm|times|cdot|le|ge|neq|approx)\b/
                .test(trimmed)
                ||
                /[_^]/.test(trimmed)
                ||
                /\\(frac|sqrt|lim|sum|int|begin)\b/
                    .test(trimmed);

            if(!isMath)
                return line;

            return "\\(" + line + "\\)";

        }
    ).join("\n");

}


/* =================================================
   RENDER
================================================= */

let renderNumber = 0;

async function render() {

    const preview =
        document.getElementById(
            "preview"
        );

    const data =
        read();

    const token =
        ++renderNumber;


    preview.innerHTML = "";


    /*
       문제 번호
    */

    const number =
        document.createElement(
            "div"
        );

    number.style.fontSize =
        "13px";

    number.style.color =
        "var(--muted)";

    number.style.marginBottom =
        "18px";

    number.textContent =
        `${data.number}번 · ${data.score}점`;

    preview.appendChild(
        number
    );


    /*
       문제
    */

    const question =
        document.createElement(
            "div"
        );

    question.className =
        "preview-question";


    /*
       여기서만 수식 경계를 만든다.

       LaTeX 명령 자체는 변경하지 않는다.
    */

    const converted =
        convertForMathJax(
            data.question
        );


    /*
       innerHTML을 사용한다.

       MathJax가
       \( ... \)
       를 읽어야 하기 때문이다.

       사용자가 입력한 HTML이
       그대로 실행되지 않도록
       먼저 HTML escape.
    */

    question.innerHTML =
        escapeHTML(
            converted
        )
        .replace(
            /&amp;lt;/g,
            "&lt;"
        )
        .replace(
            /&amp;gt;/g,
            "&gt;"
        )
        .replace(
            /&amp;quot;/g,
            "&quot;"
        );

    /*
       위 방식은 MathJax 구분자까지
       HTML escape하지 않도록
       별도 처리가 필요하다.

       그래서 아래에서 다시
       안전하게 MathJax 영역을 만든다.
    */

    question.innerHTML = "";

    appendLatexText(
        question,
        data.question
    );

    preview.appendChild(
        question
    );


    /*
       선택지
    */

    if(
        data.type === "multiple"
    ) {

        const choices =
            document.createElement(
                "div"
            );

        choices.className =
            "choices-preview";

        data.choices.forEach(
            (text,index) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "choice-preview";


                const n =
                    document.createElement(
                        "div"
                    );

                n.className =
                    "choice-number";

                n.textContent =
                    index + 1;


                const content =
                    document.createElement(
                        "div"
                    );

                appendLatexText(
                    content,
                    text
                );


                row.append(
                    n,
                    content
                );

                choices.appendChild(
                    row
                );

            }
        );

        preview.appendChild(
            choices
        );

    }


    if(
        data.type === "short"
    ) {

        const answer =
            document.createElement(
                "div"
            );

        answer.style.marginTop =
            "25px";

        answer.textContent =
            "답: __________________";

        preview.appendChild(
            answer
        );

    }


    /*
       MathJax가 아직 안 왔다면
       startup 완료 후 다시 실행된다.
    */

    if(
        !mathJaxReady
    )
        return;


    try {

        if(
            MathJax.typesetClear
        ) {

            MathJax.typesetClear(
                [preview]
            );

        }

        await MathJax.typesetPromise(
            [preview]
        );


        if(
            token !== renderNumber
        )
            return;

    }
    catch(error) {

        console.error(
            "MathJax:",
            error
        );

        markErrors(
            preview
        );

    }

}


/* =================================================
   APPEND TEXT + LATEX
================================================= */

/*
    핵심 부분.

    일반 텍스트:

        함수 f(x)에 대하여

    그대로 TextNode.

    LaTeX:

        \lim_{x\to0}\frac{...}{...}

    는

        \( \lim_{x\to0}\frac{...}{...} \)

    로 MathJax에게 전달.

    LaTeX 내용 자체는 수정하지 않는다.
*/

function appendLatexText(
    container,
    text
) {

    const lines =
        text.split("\n");


    lines.forEach(
        (line,lineIndex) => {

            if(
                lineIndex > 0
            ) {

                container.appendChild(
                    document.createElement(
                        "br"
                    )
                );

            }


            const trimmed =
                line.trim();


            /*
               이미 사용자가
               \( ... \) 또는 \[...\]
               를 입력했다면
               그대로 처리.
            */

            if(
                trimmed.startsWith("\\(")
                ||
                trimmed.startsWith("\\[")
                ||
                trimmed.startsWith("$$")
            ) {

                const span =
                    document.createElement(
                        "span"
                    );

                span.textContent =
                    line;

                container.appendChild(
                    span
                );

                return;

            }


            /*
               LaTeX 명령을 포함한 줄인지 판단.

               명령을 해석하는 것이 아니라
               "이 줄을 MathJax에게 줄 것인가?"
               만 판단한다.
            */

            const math =
                /\\[a-zA-Z]+/.test(line)
                ||
                /[a-zA-Z0-9]\^|[a-zA-Z0-9]_/.test(line);


            if(!math) {

                container.appendChild(
                    document.createTextNode(
                        line
                    )
                );

                return;

            }


            /*
               수식 부분.

               원본 LaTeX 그대로.
            */

            const span =
                document.createElement(
                    "span"
                );

            span.textContent =
                "\\(" +
                line +
                "\\)";

            container.appendChild(
                span
            );

        }
    );

}


/* =================================================
   ERRORS
================================================= */

function markErrors(root) {

    const errors =
        root.querySelectorAll(
            "mjx-merror"
        );

    errors.forEach(
        e => {

            e.style.color =
                "#ef4444";

        }
    );

}


/* =================================================
   INSERT
================================================= */

function insert(text) {

    const textarea =
        document.getElementById(
            "question"
        );

    const start =
        textarea.selectionStart;

    const end =
        textarea.selectionEnd;

    textarea.value =
        textarea.value.slice(
            0,
            start
        )
        +
        text
        +
        textarea.value.slice(
            end
        );

    textarea.focus();

    textarea.selectionStart =
        textarea.selectionEnd =
        start + text.length;

    render();

    autoSave();

}


/* =================================================
   EXPORT
================================================= */

function exportData() {

    save(false);

    const blob =
        new Blob(
            [
                JSON.stringify(
                    problems,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        "math-problems.json";

    a.click();

    URL.revokeObjectURL(url);

    toast(
        "파일을 저장했습니다."
    );

}


/* =================================================
   DARK
================================================= */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(
        "dark",
        document.body.classList.contains(
            "dark"
        )
    );

}


/* =================================================
   ESCAPE
================================================= */

function escapeHTML(text) {

    return text
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================================
   TOAST
================================================= */

function toast(message) {

    const t =
        document.getElementById(
            "toast"
        );

    t.textContent =
        message;

    t.classList.add(
        "show"
    );

    setTimeout(
        () => {

            t.classList.remove(
                "show"
            );

        },
        1600
    );

}

================================================= */

[
    "number",
    "score",
    "question",
    "answer"
].forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(

                }
