<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathForge - 수학 문제 편집기</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
    processEscapes: false,
    processEnvironments: true
  },
  options: {
    skipHtmlTags: ['script','noscript','style','textarea','pre','code']
  },
  svg: {
    fontCache: 'global'
  }
};
</script>

<script
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
  async>
</script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #171717;
  --muted: #737373;
  --border: #dedede;
  --accent: #4f46e5;
  --danger: #ef4444;
  --success: #16a34a;
}

body.dark {
  --bg: #111216;
  --panel: #191a1f;
  --text: #f5f5f5;
  --muted: #a1a1aa;
  --border: #30323a;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;
}

header {
  height: 58px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 14px;

  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 19px;
  font-weight: 800;
}

.logo span {
  color: var(--accent);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 7px;
}

button {
  font: inherit;
}

.btn {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 8px 11px;
  border-radius: 8px;
  cursor: pointer;
}

.btn:hover {
  border-color: var(--accent);
}

.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.status {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
}

.dot.dirty {
  background: #f59e0b;
}

.layout {
  max-width: 1500px;
  margin: auto;
  padding: 8px;

  display: grid;

  grid-template-columns:
    210px
    minmax(0, 1fr)
    minmax(0, 1fr);

  gap: 7px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.panel-header {
  height: 48px;
  padding: 0 13px;

  border-bottom: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.title {
  font-size: 14px;
  font-weight: 750;
}

.panel-body {
  padding: 12px;
}

.field {
  margin-bottom: 13px;
}

label {
  display: block;

  color: var(--muted);

  font-size: 12px;
  font-weight: 700;

  margin-bottom: 6px;
}

input,
textarea {
  width: 100%;

  background: var(--panel);
  color: var(--text);

  border: 1px solid var(--border);

  border-radius: 8px;

  padding: 9px;

  outline: none;
}

input:focus,
textarea:focus {
  border-color: var(--accent);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

#question {
  min-height: 520px;

  resize: vertical;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;

  line-height: 1.8;

  font-size: 14px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 7px;
}

.tool {
  border: 1px solid var(--border);

  background: var(--bg);
  color: var(--text);

  border-radius: 6px;

  padding: 6px 9px;

  cursor: pointer;

  font-size: 12px;
}

.tool:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.preview {
  min-height: 700px;

  padding: 18px;

  overflow-x: auto;

  font-size: 17px;

  line-height: 1.9;
}

.preview-line {
  min-height: 1.9em;
  white-space: pre-wrap;
}

.problem-list {
  max-height: calc(100vh - 110px);
  overflow-y: auto;
}

.search {
  margin-bottom: 8px;
}

.problem {
  padding: 10px 12px;

  border-bottom: 1px solid var(--border);

  cursor: pointer;
}

.problem:hover {
  background: var(--bg);
}

.problem.active {
  background: rgba(79, 70, 229, .1);
}

.problem-title {
  font-size: 13px;
  font-weight: 700;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;
}

.problem-meta {
  color: var(--muted);

  font-size: 11px;

  margin-top: 4px;
}

.choice-row {
  display: flex;

  gap: 6px;

  margin-bottom: 6px;

  align-items: center;
}

.choice-row input[type="text"] {
  flex: 1;
}

.remove {
  width: 34px;

  border: 1px solid var(--border);

  background: transparent;

  color: var(--danger);

  border-radius: 7px;

  cursor: pointer;
}

.types {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 5px;
}

.type {
  padding: 8px;

  border: 1px solid var(--border);

  border-radius: 7px;

  background: var(--panel);

  color: var(--text);

  cursor: pointer;
}

.type.active {
  background: var(--accent);

  color: white;

  border-color: var(--accent);
}

.choices-preview {
  margin-top: 25px;

  display: flex;

  flex-direction: column;

  gap: 12px;
}

.choice-preview {
  display: flex;

  gap: 10px;

  align-items: flex-start;
}

.choice-number {
  width: 25px;

  height: 25px;

  min-width: 25px;

  border: 1px solid var(--border);

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 12px;
}

.hidden {
  display: none;
}

.toast {
  position: fixed;

  bottom: 20px;

  left: 50%;

  transform: translate(-50%, 20px);

  opacity: 0;

  background: #222;

  color: white;

  padding: 10px 15px;

  border-radius: 8px;

  transition: .2s;

  pointer-events: none;

  z-index: 50;
}

.toast.show {
  opacity: 1;

  transform: translate(-50%, 0);
}

/* 수식 오류 */

.math-error {
  color: var(--danger) !important;

  text-decoration-line: underline;

  text-decoration-style: wavy;

  text-decoration-color: var(--danger);
}

.error-box {
  margin-top: 7px;

  padding: 7px 9px;

  border-radius: 7px;

  background: rgba(239, 68, 68, .08);

  border: 1px solid rgba(239, 68, 68, .25);

  color: var(--danger);

  font-size: 12px;
}

mjx-merror {
  color: var(--danger) !important;
}

@media(max-width:1100px) {

  .layout {
    grid-template-columns:
      200px
      minmax(0, 1fr);
  }

  .preview-panel {
    grid-column: 1 / -1;
  }

}

@media(max-width:700px) {

  .layout {
    display: flex;

    flex-direction: column;
  }

  .preview-panel {
    order: 3;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    Math<span>Forge</span>
  </div>

  <div class="header-right">

    <div class="status" id="status">
      <span class="dot"></span>
      <span>저장됨</span>
    </div>

    <button
      class="btn"
      onclick="newProblem()">
      ＋ 새 문제
    </button>

    <button
      class="btn"
      onclick="toggleDark()">
      ◐
    </button>

  </div>

</header>


<div class="layout">


<!-- 문제 목록 -->

<section class="panel">

  <div class="panel-header">

    <div class="title">
      문제
    </div>

    <button
      class="btn"
      onclick="newProblem()">
      ＋
    </button>

  </div>

  <div class="panel-body">

    <input
      id="search"
      class="search"
      placeholder="문제 검색">

  </div>

  <div
    id="problemList"
    class="problem-list">
  </div>

</section>


<!-- 문제 입력 -->

<section class="panel">

  <div class="panel-header">

    <div class="title">
      문제 입력
    </div>

  </div>

  <div class="panel-body">

    <div class="row">

      <div class="field">

        <label>번호</label>

        <input
          id="number"
          type="number">

      </div>

      <div class="field">

        <label>배점</label>

        <input
          id="score"
          type="number">

      </div>

    </div>


    <div class="field">

      <label>문제 유형</label>

      <div class="types">

        <button
          id="multiple"
          class="type active"
          onclick="setType('multiple')">
          객관식
        </button>

        <button
          id="short"
          class="type"
          onclick="setType('short')">
          주관식
        </button>

      </div>

    </div>


    <div class="field">

      <label>문제</label>

      <div class="toolbar">

        <button
          class="tool"
          onclick="insertAtCursor('\\frac{}{}')">
          frac
        </button>

        <button
          class="tool"
          onclick="insertAtCursor('\\sqrt{}')">
          √
        </button>

        <button
          class="tool"
          onclick="insertAtCursor('\\lim_{n\\to\\infty}')">
          lim
        </button>

        <button
          class="tool"
          onclick="insertAtCursor('\\sum_{k=1}^{n}')">
          Σ
        </button>

        <button
          class="tool"
          onclick="insertAtCursor('\\int_0^1')">
          ∫
        </button>

        <button
          class="tool"
          onclick="insertAtCursor('x^2')">
          x²
        </button>

        <button
          class="tool"
          onclick="insertAtCursor('x_{n}')">
          xₙ
        </button>

        <button
          class="tool"
          onclick="insertAtCursor('\\pi')">
          π
        </button>

      </div>


      <textarea
        id="question"
        spellcheck="false"
        placeholder="예: 함수 f(x)=x^2+1에 대하여
f(1), f(2)의 값을 구하여라.

$ 기호는 입력하지 않아도 됩니다."></textarea>

      <div id="questionError"></div>

    </div>


    <div
      id="choiceArea"
      class="field">

      <label>선택지</label>

      <div id="choices"></div>

      <button
        class="btn"
        onclick="addChoice()">
        ＋ 선택지
      </button>

    </div>


    <div
      id="answerArea"
      class="field hidden">

      <label>정답</label>

      <input
        id="answer"
        placeholder="정답">

    </div>


    <div style="display:flex;gap:6px">

      <button
        class="btn primary"
        onclick="save(true)">
        저장
      </button>

      <button
        class="btn"
        onclick="duplicate()">
        복제
      </button>

      <button
        class="btn"
        onclick="removeProblem()">
        삭제
      </button>

    </div>

  </div>

</section>


<!-- 미리보기 -->

<section class="panel preview-panel">

  <div class="panel-header">

    <div class="title">
      미리보기
    </div>

    <div style="font-size:11px;color:#16a34a">
      LIVE
    </div>

  </div>

  <div
    id="preview"
    class="preview">
  </div>

</section>

</div>


<div
  id="toast"
  class="toast">
</div>


<script>

"use strict";


/* =====================================================
   DATA
===================================================== */

let problems = [];

let currentId = null;

let currentType = "multiple";

let saveTimer = null;

let renderTimer = null;

let renderVersion = 0;


/* =====================================================
   INIT
===================================================== */

async function init() {

  const stored =
    localStorage.getItem(
      "mathforge-problems"
    );

  if (stored) {

    try {

      problems =
        JSON.parse(stored);

    } catch {

      problems = [];

    }

  }


  if (
    !Array.isArray(problems) ||
    problems.length === 0
  ) {

    problems = [

      {

        id: Date.now(),

        number: 1,

        score: 5,

        type: "multiple",

        question:
`함수 f(x)에 대하여

\\lim_{x\\to0}\\frac{\\sin x}{x}

의 값을 구하여라.`,

        choices: [
          "0",
          "1",
          "2",
          "3",
          "4"
        ],

        answer: 1,

        shortAnswer: ""

      }

    ];

    persist();

  }


  if (
    localStorage.getItem(
      "mathforge-dark"
    ) === "true"
  ) {

    document.body.classList.add(
      "dark"
    );

  }


  currentId =
    problems[0].id;


  loadProblem(
    currentId
  );


  renderList();


  await waitForMathJax();


  renderPreview();

}


/* =====================================================
   MATHJAX READY
===================================================== */

function waitForMathJax() {

  return new Promise(resolve => {

    const check = () => {

      if (
        window.MathJax &&
        MathJax.startup &&
        MathJax.startup.promise
      ) {

        MathJax.startup.promise
          .then(resolve)
          .catch(resolve);

      } else {

        setTimeout(
          check,
          50
        );

      }

    };

    check();

  });

}


/* =====================================================
   STORAGE
===================================================== */

function persist() {

  localStorage.setItem(
    "mathforge-problems",
    JSON.stringify(problems)
  );

}


/* =====================================================
   CURRENT
===================================================== */

function getCurrent() {

  return problems.find(
    p => p.id === currentId
  );

}


/* =====================================================
   LOAD
===================================================== */

function loadProblem(id) {

  const p =
    problems.find(
      x => x.id === id
    );

  if (!p)
    return;


  currentId = id;


  currentType =
    p.type || "multiple";


  document
    .getElementById("number")
    .value =
    p.number || 1;


  document
    .getElementById("score")
    .value =
    p.score || 0;


  document
    .getElementById("question")
    .value =
    p.question || "";


  document
    .getElementById("answer")
    .value =
    p.shortAnswer || "";


  renderChoices(
    p.choices || []
  );


  updateTypeButtons();


  renderList();


  renderPreview();

}


/* =====================================================
   READ FORM
===================================================== */

function readForm() {

  return {

    number:
      Number(
        document.getElementById(
          "number"
        ).value
      ) || 1,


    score:
      Number(
        document.getElementById(
          "score"
        ).value
      ) || 0,


    type:
      currentType,


    question:
      document.getElementById(
        "question"
      ).value,


    choices:
      [
        ...document.querySelectorAll(
          "#choices .choice-input"
        )
      ].map(
        input => input.value
      ),


    shortAnswer:
      document.getElementById(
        "answer"
      ).value

  };

}


/* =====================================================
   SAVE
===================================================== */

function save(
  showToast = false
) {

  const p =
    getCurrent();

  if (!p)
    return;


  Object.assign(
    p,
    readForm()
  );


  persist();


  setSaved();


  renderList();


  if (showToast)
    toast(
      "저장되었습니다."
    );

}


/* =====================================================
   AUTO SAVE
===================================================== */

function autoSave() {

  setDirty();


  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      () => save(false),
      400
    );

}


/* =====================================================
   STATUS
===================================================== */

function setDirty() {

  document.getElementById(
    "status"
  ).innerHTML =

    `
      <span class="dot dirty"></span>
      <span>저장 중...</span>
    `;

}


function setSaved() {

  document.getElementById(
    "status"
  ).innerHTML =

    `
      <span class="dot"></span>
      <span>저장됨</span>
    `;

}


/* =====================================================
   TYPE
===================================================== */

function setType(type) {

  currentType =
    type;


  updateTypeButtons();


  renderPreview();


  autoSave();

}


function updateTypeButtons() {

  document
    .getElementById("multiple")
    .classList.toggle(
      "active",
      currentType === "multiple"
    );


  document
    .getElementById("short")
    .classList.toggle(
      "active",
      currentType === "short"
    );


  document
    .getElementById("choiceArea")
    .classList.toggle(
      "hidden",
      currentType !== "multiple"
    );


  document
    .getElementById("answerArea")
    .classList.toggle(
      "hidden",
      currentType !== "short"
    );

}


/* =====================================================
   CHOICES
===================================================== */

function renderChoices(
  values
) {

  const box =
    document.getElementById(
      "choices"
    );


  box.innerHTML = "";


  values.forEach(
    (value, index) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "choice-row";


      const radio =
        document.createElement(
          "input"
        );

      radio.type =
        "radio";

      radio.name =
        "correct";


      const p =
        getCurrent();


      radio.checked =
        !!p &&
        p.answer === index;


      radio.onchange =
        () => {

          if (p)
            p.answer =
              index;

          autoSave();

        };


      const input =
        document.createElement(
          "input"
        );

      input.type =
        "text";

      input.className =
        "choice-input";

      input.value =
        value;


      input.oninput =
        () => {

          renderPreview();

          autoSave();

        };


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "remove";

      remove.textContent =
        "×";


      remove.onclick =
        () => {

          const arr =
            getChoices();


          arr.splice(
            index,
            1
          );


          if (
            arr.length === 0
          )
            arr.push("");


          renderChoices(
            arr
          );


          renderPreview();


          autoSave();

        };


      row.append(
        radio,
        input,
        remove
      );


      box.appendChild(
        row
      );

    }
  );

}


function getChoices() {

  return [
    ...document.querySelectorAll(
      "#choices .choice-input"
    )
  ].map(
    input => input.value
  );

}


function addChoice() {

  const arr =
    getChoices();


  arr.push("");


  renderChoices(
    arr
  );


  autoSave();

}


/* =====================================================
   NEW
===================================================== */

function newProblem() {

  const p = {

    id:
      Date.now() +
      Math.random(),

    number:
      problems.length + 1,

    score: 5,

    type:
      "multiple",

    question:
      "",

    choices: [
      "",
      "",
      "",
      "",
      ""
    ],

    answer:
      0,

    shortAnswer:
      ""

  };


  problems.unshift(
    p
  );


  currentId =
    p.id;


  loadProblem(
    p.id
  );


  persist();


  setSaved();


  toast(
    "새 문제가 생성되었습니다."
  );

}


/* =====================================================
   DUPLICATE
===================================================== */

function duplicate() {

  const p =
    getCurrent();

  if (!p)
    return;


  const copy =
    JSON.parse(
      JSON.stringify(p)
    );


  copy.id =
    Date.now() +
    Math.random();


  copy.number =
    problems.length + 1;


  problems.unshift(
    copy
  );


  currentId =
    copy.id;


  loadProblem(
    copy.id
  );


  persist();


  setSaved();


  toast(
    "문제를 복제했습니다."
  );

}


/* =====================================================
   DELETE
===================================================== */

function removeProblem() {

  if (
    problems.length <= 1
  ) {

    toast(
      "최소 한 문제는 있어야 합니다."
    );

    return;

  }


  if (
    !confirm(
      "현재 문제를 삭제할까요?"
    )
  )
    return;


  const index =
    problems.findIndex(
      p =>
        p.id === currentId
    );


  problems.splice(
    index,
    1
  );


  const next =
    problems[
      Math.min(
        index,
        problems.length - 1
      )
    ];


  currentId =
    next.id;


  loadProblem(
    currentId
  );


  persist();


  setSaved();

}


/* =====================================================
   LIST
===================================================== */

function renderList() {

  const list =
    document.getElementById(
      "problemList"
    );


  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .toLowerCase();


  list.innerHTML =
    "";


  problems
    .filter(
      p => {

        const q =
          String(
            p.question || ""
          )
          .toLowerCase();


        return (
          q.includes(search) ||
          String(
            p.number
          ).includes(search)
        );

      }
    )
    .forEach(
      p => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "problem";


        if (
          p.id === currentId
        )
          item.classList.add(
            "active"
          );


        const title =
          (
            p.question ||
            ""
          )
          .replace(
            /\n/g,
            " "
          )
          .slice(
            0,
            45
          );


        const titleDiv =
          document.createElement(
            "div"
          );

        titleDiv.className =
          "problem-title";

        titleDiv.textContent =
          `${p.number}. ${
            title ||
            "새 문제"
          }`;


        const meta =
          document.createElement(
            "div"
          );

        meta.className =
          "problem-meta";

        meta.textContent =
          `${p.score}점 · ${
            p.type === "short"
              ? "주관식"
              : "객관식"
          }`;


        item.append(
          titleDiv,
          meta
        );


        item.onclick =
          () =>
            loadProblem(
              p.id
            );


        list.appendChild(
          item
        );

      }
    );

}


/* =====================================================
   LATEX
===================================================== */

/*
  중요:
  사용자가 입력한 문자열 자체는 절대로
  JS로 LaTeX 변환/수정하지 않는다.

  $도 필요 없다.

  예:

  f(x)
  f(1)
  f(2)
  f(x)=x^2
  x^2
  x_n
  \frac{1}{2}
  \lim_{n\to\infty}
  \sum_{k=1}^{n} k
  \int_0^1 x dx

  모두 자동으로 MathJax에 넘긴다.
*/


const LATEX_COMMAND =
/\\(?:frac|dfrac|tfrac|sqrt|lim|sum|prod|int|oint|iint|iiint|sin|cos|tan|cot|sec|csc|log|ln|exp|det|gcd|binom|left|right|begin|end|mathbb|mathbf|mathrm|mathcal|mathfrak|operatorname|overline|underline|vec|hat|bar|dot|ddot|alpha|beta|gamma|delta|epsilon|varepsilon|zeta|eta|theta|vartheta|iota|kappa|lambda|mu|nu|xi|pi|varpi|rho|sigma|varsigma|tau|upsilon|phi|varphi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega|infty|to|rightarrow|leftarrow|Rightarrow|Leftrightarrow|cdot|times|pm|mp|le|leq|ge|geq|neq|approx|equiv|sim|propto|parallel|perp|partial|nabla|forall|exists|in|notin|subset|supset|cup|cap|emptyset|ldots|cdots|dots|text)\b/;


/*
  f(x)
  f(1)
  f(x+1)
  f(2x)
  f(x)=x^2
*/
const FUNCTION_RE =
/\b[A-Za-z]\s*\([^()\n]*\)(?:\s*=\s*[A-Za-z0-9πθ+\-*/^().{}\s\\]+)?/g;


/*
  \lim_{n\to\infty}
  \frac{...}{...}
  \sum...
  \int...
*/
function findLatexRuns(line) {

  const result = [];

  const command =
    /\\(?:lim|frac|dfrac|tfrac|sqrt|sum|prod|int|oint|iint|iiint|binom|left|right|begin|end)\b/g;


  let match;


  while (
    (match =
      command.exec(line))
  ) {

    const start =
      match.index;


    let end =
      start;


    let braces = 0;


    /*
      LaTeX 명령어가 포함된
      하나의 연속 수식 덩어리를 가져온다.
    */

    for (
      let i = start;
      i < line.length;
      i++
    ) {

      const c =
        line[i];


      if (
        c === "{"
      )
        braces++;


      if (
        c === "}"
      )
        braces--;


      /*
        한국어가 나오고
        현재 brace가 닫혀 있으면
        여기서 수식을 끝낸다.
      */

      if (
        /[가-힣]/.test(c) &&
        braces <= 0
      ) {

        end = i;

        break;

      }


      end =
        i + 1;

    }


    while (
      end > start &&
      /\s/.test(
        line[end - 1]
      )
    )
      end--;


    result.push({
      start,
      end
    });

  }


  return result;

}


/*
  일반적인 수학 표현식인지 판단
*/
function isMathExpression(text) {

  const s =
    text.trim();


  if (!s)
    return false;


  /*
    f(x), f(1), f(2)
  */

  if (
    /^[A-Za-z]\s*\([^()\n]*\)$/.test(s)
  )
    return true;


  /*
    f(x)=...
  */

  if (
    /^[A-Za-z]\s*\([^()\n]*\)\s*=/.test(s)
  )
    return true;


  /*
    x^2
    x_n
    a_{n+1}
  */

  if (
    /^[A-Za-z0-9πθ][\s\S]*[_^]/.test(s)
  )
    return true;


  /*
    2x
    3a
    10x
  */

  if (
    /^\d+(?:\.\d+)?[A-Za-zπθ]$/.test(s)
  )
    return true;


  /*
    x+1
    x-2
    2x+3
    x/2
    x=1
  */

  if (
    /^[0-9A-Za-zπθ().\s]+(?:[+\-*/=<>])[0-9A-Za-zπθ().\s]+$/.test(s)
  )
    return true;


  return false;

}


/*
  한 줄을 텍스트 / 수식으로 분리
*/
function tokenizeLine(line) {

  const candidates = [];


  /*
    1. 명시적 LaTeX
  */

  for (
    const item of findLatexRuns(line)
  ) {

    candidates.push({
      start: item.start,
      end: item.end
    });

  }


  /*
    2. f(x), f(1), f(2), f(x)=...
  */

  let match;


  while (
    (match =
      FUNCTION_RE.exec(line))
  ) {

    /*
      한글이 들어간 경우 제외
    */

    if (
      !/[가-힣]/.test(
        match[0]
      )
    ) {

      candidates.push({
        start:
          match.index,

        end:
          match.index +
          match[0].length
      });

    }

  }


  /*
    3. 겹치는 후보 정리
  */

  candidates.sort(
    (a,b) =>
      a.start - b.start ||
      b.end - a.end
  );


  const merged = [];


  for (
    const item of candidates
  ) {

    const last =
      merged[
        merged.length - 1
      ];


    if (!last) {

      merged.push({
        ...item
      });

      continue;

    }


    if (
      item.start <=
      last.end
    ) {

      last.end =
        Math.max(
          last.end,
          item.end
        );

    } else {

      merged.push({
        ...item
      });

    }

  }


  /*
    4. 나머지에서
       단순한 수식 찾기
  */

  let cursor = 0;


  for (
    const item of merged
  ) {

    if (
      item.start >
      cursor
    ) {

      const text =
        line.slice(
          cursor,
          item.start
        );


      addSimpleMathCandidates(
        candidates,
        text,
        cursor
      );

    }

    cursor =
      Math.max(
        cursor,
        item.end
      );

  }


  if (
    cursor < line.length
  ) {

    addSimpleMathCandidates(
      candidates,
      line.slice(cursor),
      cursor
    );

  }


  /*
    다시 정렬 + 병합
  */

  candidates.sort(
    (a,b) =>
      a.start - b.start ||
      b.end - a.end
  );


  const final = [];


  for (
    const item of candidates
  ) {

    if (
      item.end <=
      item.start
    )
      continue;


    const last =
      final[
        final.length - 1
      ];


    if (
      last &&
      item.start <=
      last.end
    ) {

      last.end =
        Math.max(
          last.end,
          item.end
        );

    } else {

      final.push({
        ...item
      });

    }

  }


  /*
    토큰 생성
  */

  const tokens = [];

  cursor = 0;


  for (
    const item of final
  ) {

    /*
      실제 수식인지 최종 확인
    */

    const value =
      line.slice(
        item.start,
        item.end
      );


    if (
      !isMathExpression(value) &&
      !LATEX_COMMAND.test(value)
    ) {

      LATEX_COMMAND.lastIndex = 0;

      continue;

    }


    LATEX_COMMAND.lastIndex = 0;


    if (
      item.start > cursor
    ) {

      tokens.push({
        type: "text",
        value:
          line.slice(
            cursor,
            item.start
          )
      });

    }


    tokens.push({
      type: "math",
      value
    });


    cursor =
      item.end;

  }


  if (
    cursor < line.length
  ) {

    tokens.push({
      type: "text",
      value:
        line.slice(cursor)
    });

  }


  if (
    tokens.length === 0
  ) {

    tokens.push({
      type: "text",
      value: line
    });

  }


  return tokens;

}


/*
  단순 수학식 후보 추가

  f(1) 같은 함수는 위에서 처리한다.
  여기서는 x^2, 2x+1, x=2 등을 처리한다.
*/
function addSimpleMathCandidates(
  candidates,
  text,
  offset
) {

  /*
    한국어 단어 사이의 수식을
    너무 공격적으로 잡지 않도록
    공백 단위로 검사한다.
  */

  const re =
    /(?:^|(?<=\s))([A-Za-z0-9πθ](?:\s*[A-Za-z0-9πθ])?(?:\s*(?:[+\-*/=<>]|≤|≥)\s*[A-Za-z0-9πθ().]+|\s*[_^]\s*(?:\{[^{}]+\}|[A-Za-z0-9]+))+)/g;


  let m;


  while (
    (m =
      re.exec(text))
  ) {

    const value =
      m[1];


    if (
      isMathExpression(
        value
      )
    ) {

      const start =
        offset +
        m.index +
        m[0].indexOf(value);


      candidates.push({
        start,
        end:
          start +
          value.length
      });

    }

  }

}


/* =====================================================
   APPEND MATH
===================================================== */

function appendMath(
  container,
  latex
) {

  const span =
    document.createElement(
      "span"
    );


  span.className =
    "math-token";


  /*
    사용자가 입력한 LaTeX를
    직접 MathJax delimiter 안에 넣는다.

    LaTeX 자체를 변환하지 않는다.
  */

  span.textContent =
    "\\(" +
    latex +
    "\\)";


  container.appendChild(
    span
  );


  return span;

}


/* =====================================================
   SMART LINE
===================================================== */

function renderSmartLine(
  container,
  line
) {

  const tokens =
    tokenizeLine(
      line
    );


  tokens.forEach(
    token => {

      if (
        token.type ===
        "text"
      ) {

        container.appendChild(
          document.createTextNode(
            token.value
          )
        );

      } else {

        appendMath(
          container,
          token.value
        );

      }

    }
  );

}


/* =====================================================
   PREVIEW
===================================================== */

async function renderPreview() {

  const version =
    ++renderVersion;


  const preview =
    document.getElementById(
      "preview"
    );


  const data =
    readForm();


  preview.innerHTML =
    "";


  /*
    번호
  */

  const info =
    document.createElement(
      "div"
    );


  info.style.fontSize =
    "13px";


  info.style.color =
    "var(--muted)";


  info.style.marginBottom =
    "18px";


  info.textContent =
    `${data.number}번 · ${data.score}점`;


  preview.appendChild(
    info
  );


  /*
    문제
  */

  const question =
    document.createElement(
      "div"
    );


  data.question
    .split("\n")
    .forEach(
      line => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "preview-line";


        renderSmartLine(
          div,
          line
        );


        question.appendChild(
          div
        );

      }
    );


  preview.appendChild(
    question
  );


  /*
    객관식
  */

  if (
    data.type ===
    "multiple"
  ) {

    const choices =
      document.createElement(
        "div"
      );


    choices.className =
      "choices-preview";


    data.choices.forEach(
      (choice,index) => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "choice-preview";


        const number =
          document.createElement(
            "div"
          );


        number.className =
          "choice-number";


        number.textContent =
          index + 1;


        const content =
          document.createElement(
            "div"
          );


        renderSmartLine(
          content,
          choice
        );


        row.append(
          number,
          content
        );


        choices.appendChild(
          row
        );

      }
    );


    preview.appendChild(
      choices
    );

  }


  /*
    MathJax
  */

  if (
    !window.MathJax ||
    !MathJax.typesetPromise
  )
    return;


  try {

    await MathJax.typesetPromise([
      preview
    ]);


    /*
      최신 렌더링만 적용.
      빠르게 입력해도 이전 렌더링이
      새 결과를 덮어쓰지 않는다.
    */

    if (
      version !==
      renderVersion
    )
      return;


    checkMathErrors();

  } catch(error) {

    console.error(
      "MathJax error:",
      error
    );

    showMathError(
      "수식을 확인해주세요."
    );

  }

}


/* =====================================================
   ERROR
===================================================== */

function checkMathErrors() {

  const errors =
    document.querySelectorAll(
      "#preview mjx-merror"
    );


  document
    .querySelectorAll(
      "#preview .math-token"
    )
    .forEach(
      el =>
        el.classList.remove(
          "math-error"
        )
    );


  errors.forEach(
    error => {

      const container =
        error.closest(
          ".math-token"
        );


      if (container) {

        container.classList.add(
          "math-error"
        );

      }

    }
  );


  const box =
    document.getElementById(
      "questionError"
    );


  if (
    errors.length
  ) {

    box.innerHTML =
      `
      <div class="error-box">
        ⚠ 잘못된 수식이 빨간색으로 표시되었습니다.
      </div>
      `;

  } else {

    box.innerHTML =
      "";

  }

}


function showMathError(
  message
) {

  document.getElementById(
    "questionError"
  ).innerHTML =
    `
    <div class="error-box">
      ⚠ ${message}
    </div>
    `;

}


/* =====================================================
   INSERT
===================================================== */

function insertAtCursor(
  text
) {

  const textarea =
    document.getElementById(
      "question"
    );


  const start =
    textarea.selectionStart;


  const end =
    textarea.selectionEnd;


  textarea.value =
    textarea.value.slice(
      0,
      start
    )
    +
    text
    +
    textarea.value.slice(
      end
    );


  textarea.focus();


  textarea.selectionStart =
    textarea.selectionEnd =
    start +
    text.length;


  renderPreview();


  autoSave();

}


/* =====================================================
   DARK
===================================================== */

function toggleDark() {

  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(
    "mathforge-dark",

    document.body.classList.contains(
      "dark"
    )
  );

}


/* =====================================================
   TOAST
===================================================== */

function toast(
  message
) {

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  setTimeout(
    () => {

      element.classList.remove(
        "show"
      );

    },
    1500
  );

}


/* =====================================================
   EVENTS
===================================================== */

[
  "number",
  "score",
  "question",
  "answer"
].forEach(
  id => {

    document
      .getElementById(id)
      .addEventListener(
        "input",
        () => {

          clearTimeout(
            renderTimer
          );


          renderTimer =
            setTimeout(
              renderPreview,
              30
            );


          autoSave();

        }
      );

  }
);


document
  .getElementById("search")
  .addEventListener(
    "input",
    renderList
  );


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
