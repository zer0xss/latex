<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathForge</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']],
    processEscapes: false,
    processEnvironments: true,
    packages: {'[+]': ['ams']}
  },
  options: {
    skipHtmlTags: ['script','noscript','style','textarea','pre','code']
  },
  svg: {
    fontCache: 'global'
  }
};
</script>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f6f8;
  --panel:#fff;
  --text:#171717;
  --muted:#737373;
  --border:#dedede;
  --accent:#4f46e5;
  --danger:#ef4444;
  --green:#16a34a;
}

body.dark{
  --bg:#111216;
  --panel:#191a1f;
  --text:#f5f5f5;
  --muted:#a1a1aa;
  --border:#30323a;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}

header{
  height:56px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:19px;
  font-weight:800;
}

.logo span{color:var(--accent)}

.header-right{
  display:flex;
  align-items:center;
  gap:7px;
}

button{
  font:inherit;
}

.btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:8px;
  padding:8px 11px;
  cursor:pointer;
}

.btn:hover{
  border-color:var(--accent);
}

.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:11px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
}

.dot.dirty{
  background:#f59e0b;
}

.layout{
  max-width:1500px;
  margin:auto;
  padding:7px;

  display:grid;

  /*
    입력과 미리보기를 바로 붙임
  */
  grid-template-columns:210px minmax(0,1fr) minmax(0,1fr);

  gap:4px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}

.panel-header{
  height:45px;
  padding:0 12px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:14px;
  font-weight:750;
}

.panel-body{
  padding:11px;
}

input,
textarea{
  width:100%;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:7px;
  padding:9px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:var(--accent);
}

#question{
  min-height:500px;
  resize:vertical;
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
  line-height:1.8;
  font-size:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.field{
  margin-bottom:12px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-bottom:6px;
}

.tool{
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:6px;
  padding:5px 8px;
  cursor:pointer;
  font-size:12px;
}

.tool:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.types{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.type{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:7px;
  padding:8px;
  cursor:pointer;
}

.type.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.preview{
  min-height:700px;
  padding:22px;
  overflow-x:auto;
  font-size:17px;
  line-height:1.9;
}

.preview-line{
  min-height:1.9em;
}

.problem-list{
  max-height:calc(100vh - 105px);
  overflow-y:auto;
}

.search{
  margin-bottom:7px;
}

.problem{
  padding:9px 11px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.problem:hover{
  background:var(--bg);
}

.problem.active{
  background:rgba(79,70,229,.1);
}

.problem-title{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.problem-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.choice-row{
  display:flex;
  gap:5px;
  margin-bottom:5px;
}

.choice-row input[type=text]{
  flex:1;
}

.remove{
  width:32px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--danger);
  border-radius:7px;
  cursor:pointer;
}

.choices-preview{
  margin-top:24px;
  display:flex;
  flex-direction:column;
  gap:11px;
}

.choice-preview{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.choice-number{
  width:25px;
  height:25px;
  min-width:25px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.hidden{
  display:none;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  transition:.2s;
  pointer-events:none;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/*
  MathJax에서 실제 TeX 오류가 발생한 경우
*/
mjx-merror{
  color:var(--danger)!important;
}

.latex-error{
  color:var(--danger);
  background:rgba(239,68,68,.08);
  border-bottom:1px solid var(--danger);
}

@media(max-width:1100px){
  .layout{
    grid-template-columns:200px minmax(0,1fr);
  }

  .preview-panel{
    grid-column:1/-1;
  }
}

@media(max-width:700px){
  .layout{
    display:flex;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Math<span>Forge</span>
  </div>

  <div class="header-right">

    <div class="status" id="status">
      <span class="dot"></span>
      <span>저장됨</span>
    </div>

    <button class="btn" onclick="newProblem()">＋ 새 문제</button>
    <button class="btn" onclick="toggleDark()">◐</button>

  </div>
</header>


<div class="layout">

<!-- 목록 -->
<section class="panel">

  <div class="panel-header">
    <div class="title">문제</div>
    <button class="btn" onclick="newProblem()">＋</button>
  </div>

  <div class="panel-body">
    <input id="search" class="search" placeholder="문제 검색">
  </div>

  <div id="problemList" class="problem-list"></div>

</section>


<!-- 입력 -->
<section class="panel">

  <div class="panel-header">
    <div class="title">문제 입력</div>
  </div>

  <div class="panel-body">

    <div class="row">

      <div class="field">
        <label>번호</label>
        <input id="number" type="number">
      </div>

      <div class="field">
        <label>배점</label>
        <input id="score" type="number">
      </div>

    </div>


    <div class="field">

      <label>문제 유형</label>

      <div class="types">

        <button id="multiple"
                class="type active"
                onclick="setType('multiple')">
          객관식
        </button>

        <button id="short"
                class="type"
                onclick="setType('short')">
          주관식
        </button>

      </div>

    </div>


    <div class="field">

      <label>문제</label>

      <div class="toolbar">

        <button class="tool"
          onclick="insert('\\frac{}{}')">
          frac
        </button>

        <button class="tool"
          onclick="insert('\\sqrt{}')">
          √
        </button>

        <button class="tool"
          onclick="insert('\\lim_{n\\to\\infty}')">
          lim
        </button>

        <button class="tool"
          onclick="insert('\\sum_{k=1}^{n}')">
          Σ
        </button>

        <button class="tool"
          onclick="insert('\\int_0^1')">
          ∫
        </button>

        <button class="tool"
          onclick="insert('x^2')">
          x²
        </button>

        <button class="tool"
          onclick="insert('a_n')">
          aₙ
        </button>

        <button class="tool"
          onclick="insert('\\pi')">
          π
        </button>

      </div>

      <textarea
        id="question"
        spellcheck="false"
        placeholder="문제를 입력하세요.&#10;&#10;예: 실수 x에 대하여&#10;f(x)=\frac{2x-1}{x+2}"
      ></textarea>

    </div>


    <div id="choiceArea" class="field">

      <label>선택지</label>

      <div id="choices"></div>

      <button class="btn" onclick="addChoice()">
        ＋ 선택지
      </button>

    </div>


    <div id="answerArea" class="field hidden">

      <label>정답</label>
      <input id="answer" placeholder="정답">

    </div>


    <div style="display:flex;gap:6px">

      <button class="btn primary" onclick="save(true)">
        저장
      </button>

      <button class="btn" onclick="duplicate()">
        복제
      </button>

      <button class="btn" onclick="removeProblem()">
        삭제
      </button>

    </div>

  </div>
</section>


<!-- 미리보기 -->
<section class="panel preview-panel">

  <div class="panel-header">

    <div class="title">미리보기</div>

    <div style="font-size:11px;color:#16a34a">
      LIVE
    </div>

  </div>

  <div id="preview" class="preview"></div>

</section>

</div>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
   DATA
===================================================== */

let problems=[];
let currentId=null;
let currentType="multiple";
let saveTimer=null;
let renderTimer=null;


/* =====================================================
   INITIALIZE
===================================================== */

function init(){

  try{
    const saved=localStorage.getItem("mathforge-problems");

    if(saved){
      problems=JSON.parse(saved);
    }
  }catch{
    problems=[];
  }

  if(!Array.isArray(problems)||!problems.length){

    problems=[{
      id:Date.now(),
      number:1,
      score:5,
      type:"multiple",

      question:
`실수 x에 대하여
f(x)=\\frac{2x-1}{x+2}`,

      choices:[
        "0",
        "1",
        "2",
        "3",
        "4"
      ],

      answer:1,
      shortAnswer:""
    }];

  }

  currentId=problems[0].id;

  if(localStorage.getItem("mathforge-dark")==="true"){
    document.body.classList.add("dark");
  }

  loadProblem(currentId);
}


/* =====================================================
   CURRENT
===================================================== */

function current(){

  return problems.find(
    p=>p.id===currentId
  );

}


/* =====================================================
   LOAD
===================================================== */

function loadProblem(id){

  const p=problems.find(x=>x.id===id);

  if(!p)return;

  currentId=id;
  currentType=p.type||"multiple";

  document.getElementById("number").value=p.number||1;
  document.getElementById("score").value=p.score||0;
  document.getElementById("question").value=p.question||"";
  document.getElementById("answer").value=p.shortAnswer||"";

  renderChoices(p.choices||["","","","",""]);

  updateTypeButtons();
  renderList();

  renderPreview();
}


/* =====================================================
   FORM
===================================================== */

function formData(){

  return{

    number:Number(
      document.getElementById("number").value
    )||1,

    score:Number(
      document.getElementById("score").value
    )||0,

    type:currentType,

    question:
      document.getElementById("question").value,

    choices:[
      ...document.querySelectorAll(
        "#choices .choice-input"
      )
    ].map(x=>x.value),

    shortAnswer:
      document.getElementById("answer").value

  };

}


/* =====================================================
   SAVE
===================================================== */

function save(show=false){

  const p=current();

  if(!p)return;

  Object.assign(p,formData());

  localStorage.setItem(
    "mathforge-problems",
    JSON.stringify(problems)
  );

  setSaved();
  renderList();

  if(show){
    toast("저장되었습니다.");
  }
}


function autoSave(){

  setDirty();

  clearTimeout(saveTimer);

  saveTimer=setTimeout(
    ()=>save(false),
    400
  );

}


function setDirty(){

  document.getElementById("status").innerHTML=
  `<span class="dot dirty"></span><span>저장 중...</span>`;

}


function setSaved(){

  document.getElementById("status").innerHTML=
  `<span class="dot"></span><span>저장됨</span>`;

}


/* =====================================================
   TYPE
===================================================== */

function setType(type){

  currentType=type;

  updateTypeButtons();
  renderPreview();
  autoSave();

}


function updateTypeButtons(){

  document.getElementById("multiple")
    .classList.toggle(
      "active",
      currentType==="multiple"
    );

  document.getElementById("short")
    .classList.toggle(
      "active",
      currentType==="short"
    );

  document.getElementById("choiceArea")
    .classList.toggle(
      "hidden",
      currentType!=="multiple"
    );

  document.getElementById("answerArea")
    .classList.toggle(
      "hidden",
      currentType!=="short"
    );

}


/* =====================================================
   CHOICES
===================================================== */

function renderChoices(values){

  const box=document.getElementById("choices");

  box.innerHTML="";

  values.forEach((value,index)=>{

    const row=document.createElement("div");
    row.className="choice-row";

    const radio=document.createElement("input");
    radio.type="radio";
    radio.name="correct";

    const p=current();

    radio.checked=p&&p.answer===index;

    radio.onchange=()=>{

      if(p)p.answer=index;

      autoSave();
      renderPreview();

    };


    const input=document.createElement("input");
    input.type="text";
    input.className="choice-input";
    input.value=value;

    input.oninput=()=>{

      renderPreview();
      autoSave();

    };


    const remove=document.createElement("button");
    remove.className="remove";
    remove.textContent="×";

    remove.onclick=()=>{

      const arr=getChoices();

      arr.splice(index,1);

      if(!arr.length)arr.push("");

      renderChoices(arr);
      renderPreview();
      autoSave();

    };


    row.append(
      radio,
      input,
      remove
    );

    box.appendChild(row);

  });

}


function getChoices(){

  return[
    ...document.querySelectorAll(
      "#choices .choice-input"
    )
  ].map(x=>x.value);

}


function addChoice(){

  const arr=getChoices();

  arr.push("");

  renderChoices(arr);

  autoSave();

}


/* =====================================================
   NEW
===================================================== */

function newProblem(){

  const p={

    id:Date.now()+Math.random(),

    number:problems.length+1,

    score:5,

    type:"multiple",

    question:"",

    choices:["","","","",""],

    answer:0,

    shortAnswer:""

  };

  problems.unshift(p);

  currentId=p.id;

  loadProblem(p.id);

  save(false);

  toast("새 문제가 생성되었습니다.");

}


/* =====================================================
   DUPLICATE
===================================================== */

function duplicate(){

  const p=current();

  if(!p)return;

  const copy=JSON.parse(
    JSON.stringify(p)
  );

  copy.id=Date.now()+Math.random();
  copy.number=problems.length+1;

  problems.unshift(copy);

  currentId=copy.id;

  loadProblem(copy.id);
  save(false);

  toast("문제를 복제했습니다.");

}


/* =====================================================
   DELETE
===================================================== */

function removeProblem(){

  if(problems.length<=1){

    toast("최소 한 문제는 있어야 합니다.");

    return;
  }

  if(!confirm("현재 문제를 삭제할까요?")){
    return;
  }

  const index=problems.findIndex(
    p=>p.id===currentId
  );

  problems.splice(index,1);

  const next=problems[
    Math.max(0,index-1)
  ];

  currentId=next.id;

  loadProblem(currentId);
  save(false);

}


/* =====================================================
   LIST
===================================================== */

function renderList(){

  const list=document.getElementById(
    "problemList"
  );

  const search=document.getElementById(
    "search"
  ).value.toLowerCase();

  list.innerHTML="";

  problems
    .filter(p=>{

      const q=String(
        p.question||""
      ).toLowerCase();

      return(
        q.includes(search)||
        String(p.number).includes(search)
      );

    })
    .forEach(p=>{

      const item=document.createElement("div");

      item.className="problem";

      if(p.id===currentId){
        item.classList.add("active");
      }

      const title=(p.question||"")
        .replace(/\n/g," ")
        .slice(0,45);

      const titleDiv=document.createElement("div");
      titleDiv.className="problem-title";

      titleDiv.textContent=
        `${p.number}. ${title||"새 문제"}`;

      const meta=document.createElement("div");
      meta.className="problem-meta";

      meta.textContent=
        `${p.score}점 · ${
          p.type==="short"?"주관식":"객관식"
        }`;

      item.append(titleDiv,meta);

      item.onclick=()=>{
        loadProblem(p.id);
      };

      list.appendChild(item);

    });

}


/* =====================================================
   LATEX PARSER
=====================================================

   핵심:

   이전처럼
   "이게 f(x)인가?"
   "이게 x인가?"
   를 정규식으로 판단하지 않는다.

   사용자가 입력한 TeX 명령은
   그대로 MathJax에 전달한다.

   일반 문장 안에 있는 수학 표현은
   수학 토큰으로 변환한다.
*/


/*
  MathJax가 처리할 수 있는 TeX 명령들.
*/
const TEX_COMMANDS=
/\\(?:frac|dfrac|tfrac|sqrt|lim|sup|inf|max|min|sum|prod|int|iint|iiint|oint|sin|cos|tan|cot|sec|csc|log|ln|exp|det|gcd|binom|left|right|mathbf|mathrm|mathbb|mathcal|mathit|text|overline|underline|vec|hat|bar|alpha|beta|gamma|delta|epsilon|theta|lambda|mu|sigma|pi|rho|tau|phi|omega|infty|to|cdot|times|pm|mp|le|ge|neq|approx|equiv|in|notin|subset|subseteq|cup|cap|forall|exists|partial|nabla|begin|end)\\b/;


/*
  TeX 명령이 있는 경우 그 위치부터
  하나의 수식으로 잡는다.
*/
function findTexStart(text){

  const match=text.match(TEX_COMMANDS);

  return match?match.index:-1;

}


/*
  일반적인 수학 원자:

  x
  a
  n
  f(x)
  f(1)
  a_n
  x^2
  2x
*/
function isMathCharacter(c){

  return /[A-Za-z0-9πθ∞]/.test(c);

}


/*
  한글 문장 속 단일 수학 변수도 처리한다.

  예:

  실수 x에 대하여

  → 실수 [x] 에 대하여
*/
function renderPlainMixed(container,text){

  let i=0;

  while(i<text.length){

    /*
      TeX 명령 발견
    */
    const texIndex=findTexStart(
      text.slice(i)
    );

    /*
      TeX 명령이 현재 위치 또는
      가까운 위치에 있으면 그 앞은
      일반 텍스트로 처리
    */
    if(texIndex===0){

      const math=readTexExpression(
        text,
        i
      );

      if(math){

        appendMath(
          container,
          math.value
        );

        i=math.end;

        continue;
      }
    }


    /*
      f(x), f(1), F(x) 등
    */
    const functionMatch=
      text.slice(i).match(
        /^[A-Za-z]\s*\([^()\n]*\)/
      );

    if(functionMatch){

      appendMath(
        container,
        functionMatch[0]
      );

      i+=functionMatch[0].length;

      continue;
    }


    /*
      a_{n+1}, x^2, x^{n+1}, a_n
    */
    const indexed=
      text.slice(i).match(
        /^[A-Za-z0-9πθ](?:[_^](?:\{[^{}]*\}|[A-Za-z0-9πθ]))+/
      );

    if(indexed){

      appendMath(
        container,
        indexed[0]
      );

      i+=indexed[0].length;

      continue;
    }


    /*
      일반적인 숫자+문자:

      2x
      3a
    */
    const numberLetter=
      text.slice(i).match(
        /^\d+[A-Za-zπθ]/
      );

    if(numberLetter){

      appendMath(
        container,
        numberLetter[0]
      );

      i+=numberLetter[0].length;

      continue;
    }


    /*
      단일 변수.

      단, 한글 바로 뒤/앞의 영어 단어는
      전부 수식으로 만들지 않는다.

      x는 독립된 토큰일 때 수식.
    */
    const single=
      text.slice(i).match(
        /^[A-Za-zπθ](?![A-Za-z])/
      );

    if(single){

      const prev=
        i>0?text[i-1]:"";

      const next=
        text[i+1]||"";

      /*
        영어 단어 내부의 글자는 제외
      */
      if(
        !/[A-Za-z]/.test(prev) &&
        !/[A-Za-z]/.test(next)
      ){

        appendMath(
          container,
          single[0]
        );

        i++;

        continue;
      }
    }


    /*
      그 외 일반 문자
    */
    container.appendChild(
      document.createTextNode(
        text[i]
      )
    );

    i++;

  }

}


/*
  \frac{...}{...}
  \lim_{...}
  \sum_{...}
  \int_0^1

  같은 TeX를 그대로 읽는다.
*/
function readTexExpression(text,start){

  let i=start;

  /*
    TeX 명령
  */
  const command=text.slice(i).match(TEX_COMMANDS);

  if(!command)return null;

  i+=command[0].length;

  /*
    명령 뒤에 붙는 첨자/인자들을
    균형 괄호까지 포함한다.
  */
  while(i<text.length){

    while(
      i<text.length &&
      /\s/.test(text[i])
    ){
      i++;
    }

    if(text[i]==="_"||text[i]==="^"){

      i++;

      if(text[i]==="{"){

        const end=findMatchingBrace(
          text,
          i
        );

        if(end<0)break;

        i=end+1;

      }else{

        i++;

      }

      continue;
    }

    if(text[i]==="{"){

      const end=findMatchingBrace(
        text,
        i
      );

      if(end<0)break;

      i=end+1;

      continue;
    }

    /*
      \frac{}{}처럼 두 인자를 읽은 뒤
      수식이 이어지는 경우를 위해
      연산자/변수도 이어서 읽는다.
    */

    if(
      /[A-Za-z0-9πθ+\-*/=().]/.test(text[i])
    ){

      /*
        명백한 연속 수식까지만
      */
      let j=i;

      while(
        j<text.length &&
        /[A-Za-z0-9πθ+\-*/=().\s]/.test(text[j])
      ){
        j++;
      }

      i=j;
      continue;
    }

    break;
  }

  return{
    value:text.slice(start,i),
    end:i
  };

}


function findMatchingBrace(text,start){

  let depth=0;

  for(let i=start;i<text.length;i++){

    if(text[i]==="{"){
      depth++;
    }

    if(text[i]==="}"){

      depth--;

      if(depth===0){
        return i;
      }

    }

  }

  return-1;

}


/*
  수식을 MathJax에 직접 전달.
*/
function appendMath(container,latex){

  const span=document.createElement("span");

  /*
    중요:
    latex 자체를 JS가 수정하지 않는다.
  */
  span.textContent=
    "\\("+latex+"\\)";

  container.appendChild(span);

}


/* =====================================================
   LINE RENDER
===================================================== */

function renderLine(container,line){

  if(!line){

    container.appendChild(
      document.createTextNode("\u00a0")
    );

    return;
  }

  renderPlainMixed(
    container,
    line
  );

}


/* =====================================================
   PREVIEW
===================================================== */

let typesetRunning=false;

async function renderPreview(){

  if(typesetRunning)return;

  const preview=document.getElementById(
    "preview"
  );

  const data=formData();

  preview.innerHTML="";


  const info=document.createElement("div");

  info.style.fontSize="13px";
  info.style.color="var(--muted)";
  info.style.marginBottom="18px";

  info.textContent=
    `${data.number}번 · ${data.score}점`;

  preview.appendChild(info);


  const question=document.createElement("div");

  data.question
    .split("\n")
    .forEach(line=>{

      const div=document.createElement("div");

      div.className="preview-line";

      renderLine(div,line);

      question.appendChild(div);

    });

  preview.appendChild(question);


  /*
    선택지
  */
  if(data.type==="multiple"){

    const choices=document.createElement("div");

    choices.className="choices-preview";

    data.choices.forEach((choice,index)=>{

      const row=document.createElement(
        "div"
      );

      row.className="choice-preview";

      const num=document.createElement(
        "div"
      );

      num.className="choice-number";
      num.textContent=index+1;

      const content=document.createElement(
        "div"
      );

      renderLine(content,choice);

      row.append(num,content);

      choices.appendChild(row);

    });

    preview.appendChild(choices);

  }


  if(data.type==="short"){

    const answer=document.createElement("div");

    answer.style.marginTop="25px";

    answer.textContent=
      "답: __________________";

    preview.appendChild(answer);

  }


  /*
    MathJax에게 현재 미리보기 전체를
    직접 넘긴다.
  */
  if(
    window.MathJax &&
    MathJax.typesetPromise
  ){

    try{

      typesetRunning=true;

      await MathJax.typesetPromise(
        [preview]
      );

    }catch(error){

      console.error(
        "MathJax error:",
        error
      );

    }finally{

      typesetRunning=false;

    }

  }

}


/* =====================================================
   INSERT
===================================================== */

function insert(text){

  const textarea=
    document.getElementById("question");

  const start=textarea.selectionStart;
  const end=textarea.selectionEnd;

  textarea.setRangeText(
    text,
    start,
    end,
    "end"
  );

  textarea.focus();

  renderPreview();
  autoSave();

}


/* =====================================================
   DARK
===================================================== */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "mathforge-dark",
    document.body.classList.contains("dark")
  );

}


/* =====================================================
   TOAST
===================================================== */

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  setTimeout(
    ()=>el.classList.remove("show"),
    1500
  );

}


/* =====================================================
   EVENTS
===================================================== */

[
  "number",
  "score",
  "question",
  "answer"
].forEach(id=>{

  document.getElementById(id)
    .addEventListener("input",()=>{

      clearTimeout(renderTimer);

      renderTimer=setTimeout(
        renderPreview,
        20
      );

      autoSave();

    });

});


document.getElementById("search")
  .addEventListener(
    "input",
    renderList
  );


/* =====================================================
   START
===================================================== */

init();
