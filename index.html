<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MathForge</title>

<script>
window.MathJax = {
    tex: {
        inlineMath: [
            ['\\(', '\\)']
        ],
        displayMath: [
            ['\\[', '\\]']
        ],
        processEscapes: false,
        processEnvironments: true
    },

    options: {
        skipHtmlTags: [
            'script',
            'noscript',
            'style',
            'textarea',
            'pre',
            'code'
        ]
    },

    svg: {
        fontCache: 'global'
    },

    startup: {
        typeset: false
    }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg:#f5f6f8;
    --panel:#fff;
    --text:#171717;
    --muted:#737373;
    --border:#dedede;
    --accent:#4f46e5;
    --danger:#ef4444;
    --success:#16a34a;
}

body.dark {
    --bg:#111216;
    --panel:#191a1f;
    --text:#f5f5f5;
    --muted:#a1a1aa;
    --border:#30323a;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

header {
    height:58px;
    background:var(--panel);
    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    position:sticky;
    top:0;
    z-index:20;
}

.logo {
    font-size:19px;
    font-weight:800;
}

.logo span {
    color:var(--accent);
}

.header-right {
    display:flex;
    align-items:center;
    gap:7px;
}

button {
    font:inherit;
}

.btn {
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);

    padding:8px 11px;

    border-radius:8px;

    cursor:pointer;
}

.btn:hover {
    border-color:var(--accent);
}

.primary {
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
}

.status {
    display:flex;
    align-items:center;
    gap:5px;

    font-size:11px;
    color:var(--muted);
}

.dot {
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
}

.dot.dirty {
    background:#f59e0b;
}

.layout {
    max-width:1500px;
    margin:auto;

    padding:8px;

    display:grid;

    grid-template-columns:
        210px
        minmax(0,1fr)
        minmax(0,1fr);

    gap:7px;
}

.panel {
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;

    overflow:hidden;
}

.panel-header {
    height:48px;

    padding:0 13px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.title {
    font-size:14px;
    font-weight:750;
}

.panel-body {
    padding:12px;
}

.field {
    margin-bottom:13px;
}

label {
    display:block;

    color:var(--muted);

    font-size:12px;
    font-weight:700;

    margin-bottom:6px;
}

input,
textarea {
    width:100%;

    background:var(--panel);
    color:var(--text);

    border:1px solid var(--border);

    border-radius:8px;

    padding:9px;

    outline:none;
}

input:focus,
textarea:focus {
    border-color:var(--accent);
}

.row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

#question {
    min-height:520px;

    resize:vertical;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

    line-height:1.8;

    font-size:14px;
}

.toolbar {
    display:flex;
    flex-wrap:wrap;
    gap:5px;

    margin-bottom:7px;
}

.tool {
    border:1px solid var(--border);

    background:var(--bg);
    color:var(--text);

    border-radius:6px;

    padding:6px 9px;

    cursor:pointer;

    font-size:12px;
}

.tool:hover {
    border-color:var(--accent);
    color:var(--accent);
}

.preview {
    min-height:700px;

    padding:20px;

    overflow-x:auto;

    font-size:17px;

    line-height:1.9;
}

.problem-text {
    white-space:normal;
    overflow-wrap:break-word;
}

.preview-line {
    min-height:1.9em;
}

.choices-preview {
    margin-top:25px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.choice-preview {
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.choice-number {
    width:25px;
    height:25px;

    min-width:25px;

    border:1px solid var(--border);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
}

.problem-list {
    max-height:calc(100vh - 110px);
    overflow-y:auto;
}

.search {
    margin-bottom:8px;
}

.problem {
    padding:10px 12px;

    border-bottom:1px solid var(--border);

    cursor:pointer;
}

.problem:hover {
    background:var(--bg);
}

.problem.active {
    background:rgba(79,70,229,.1);
}

.problem-title {
    font-size:13px;
    font-weight:700;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.problem-meta {
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.choice-row {
    display:flex;
    gap:6px;
    margin-bottom:6px;
}

.choice-row input[type="text"] {
    flex:1;
}

.remove {
    width:34px;

    border:1px solid var(--border);

    background:transparent;

    color:var(--danger);

    border-radius:7px;

    cursor:pointer;
}

.types {
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;
}

.type {
    padding:8px;

    border:1px solid var(--border);

    border-radius:7px;

    background:var(--panel);

    color:var(--text);

    cursor:pointer;
}

.type.active {
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
}

.hidden {
    display:none;
}

.toast {
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translate(-50%,20px);

    opacity:0;

    background:#222;
    color:#fff;

    padding:10px 15px;

    border-radius:8px;

    transition:.2s;

    pointer-events:none;

    z-index:100;
}

.toast.show {
    opacity:1;

    transform:translate(-50%,0);
}

mjx-merror {
    color:var(--danger)!important;
}

@media(max-width:1100px) {

    .layout {
        grid-template-columns:
            200px
            minmax(0,1fr);
    }

    .preview-panel {
        grid-column:1/-1;
    }
}

@media(max-width:700px) {

    .layout {
        display:flex;
        flex-direction:column;
    }

    .preview-panel {
        order:3;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        Math<span>Forge</span>
    </div>

    <div class="header-right">

        <div class="status" id="status">
            <span class="dot"></span>
            <span>저장됨</span>
        </div>

        <button class="btn" onclick="newProblem()">
            ＋ 새 문제
        </button>

        <button class="btn" onclick="toggleDark()">
            ◐
        </button>

    </div>

</header>


<div class="layout">


<!-- 문제 목록 -->

<section class="panel">

    <div class="panel-header">

        <div class="title">
            문제
        </div>

        <button class="btn" onclick="newProblem()">
            ＋
        </button>

    </div>

    <div class="panel-body">

        <input
            id="search"
            class="search"
            placeholder="문제 검색"
        >

    </div>

    <div
        id="problemList"
        class="problem-list">
    </div>

</section>


<!-- 문제 입력 -->

<section class="panel">

    <div class="panel-header">

        <div class="title">
            문제 입력
        </div>

    </div>

    <div class="panel-body">

        <div class="row">

            <div class="field">

                <label>번호</label>

                <input
                    id="number"
                    type="number"
                >

            </div>

            <div class="field">

                <label>배점</label>

                <input
                    id="score"
                    type="number"
                >

            </div>

        </div>


        <div class="field">

            <label>문제 유형</label>

            <div class="types">

                <button
                    id="multiple"
                    class="type active"
                    onclick="setType('multiple')">
                    객관식
                </button>

                <button
                    id="short"
                    class="type"
                    onclick="setType('short')">
                    주관식
                </button>

            </div>

        </div>


        <div class="field">

            <label>문제</label>

            <div class="toolbar">

                <button
                    class="tool"
                    onclick="insertLatex('\\frac{}{}')">
                    frac
                </button>

                <button
                    class="tool"
                    onclick="insertLatex('\\sqrt{}')">
                    √
                </button>

                <button
                    class="tool"
                    onclick="insertLatex('\\lim_{n\\to\\infty}')">
                    lim
                </button>

                <button
                    class="tool"
                    onclick="insertLatex('\\sum_{k=1}^{n}')">
                    Σ
                </button>

                <button
                    class="tool"
                    onclick="insertLatex('\\int_0^1')">
                    ∫
                </button>

                <button
                    class="tool"
                    onclick="insertLatex('x^2')">
                    x²
                </button>

                <button
                    class="tool"
                    onclick="insertLatex('\\pi')">
                    π
                </button>

            </div>

            <textarea
                id="question"
                spellcheck="false"
                placeholder="문제를 입력하세요."
            ></textarea>

        </div>


        <div
            id="choiceArea"
            class="field">

            <label>선택지</label>

            <div id="choices"></div>

            <button
                class="btn"
                onclick="addChoice()">
                ＋ 선택지
            </button>

        </div>


        <div
            id="answerArea"
            class="field hidden">

            <label>정답</label>

            <input
                id="answer"
                placeholder="정답"
            >

        </div>


        <div style="display:flex;gap:6px;">

            <button
                class="btn primary"
                onclick="save(true)">
                저장
            </button>

            <button
                class="btn"
                onclick="duplicate()">
                복제
            </button>

            <button
                class="btn"
                onclick="removeProblem()">
                삭제
            </button>

        </div>

    </div>

</section>


<!-- 미리보기 -->

<section class="panel preview-panel">

    <div class="panel-header">

        <div class="title">
            미리보기
        </div>

        <div style="font-size:11px;color:#16a34a;">
            LIVE
        </div>

    </div>

    <div
        id="preview"
        class="preview">
    </div>

</section>

</div>


<div id="toast" class="toast"></div>


<script>

/* =====================================================
   DATA
===================================================== */

let problems = [];

let currentId = null;

let currentType = "multiple";

let saveTimer = null;

let renderTimer = null;

let renderToken = 0;


/* =====================================================
   INIT
===================================================== */

async function init() {

    const stored =
        localStorage.getItem(
            "mathforge-data"
        );

    if(stored) {

        try {
            problems = JSON.parse(stored);
        } catch {
            problems = [];
        }

    }


    if(
        !Array.isArray(problems) ||
        problems.length === 0
    ) {

        problems = [

            {
                id: createId(),

                number:1,

                score:5,

                type:"multiple",

                question:
`함수 f(x)=x^2+2x+1에 대하여
f(1)의 값을 구하여라.

다음 극한값을 구하여라.
\\lim_{n\\to\\infty}\\frac{2n+1}{n}`,

                choices:[
                    "1",
                    "2",
                    "3",
                    "4",
                    "5"
                ],

                answer:3,

                shortAnswer:""
            }

        ];

    }


    currentId =
        problems[0].id;


    loadProblem(
        currentId
    );


    renderList();


    await waitMathJax();


    await renderPreview();

}


/* =====================================================
   ID
===================================================== */

function createId() {

    return (
        Date.now().toString(36)
        +
        Math.random()
            .toString(36)
            .slice(2)
    );

}


/* =====================================================
   MATHJAX READY
===================================================== */

function waitMathJax() {

    return new Promise(resolve => {

        const check = () => {

            if(
                window.MathJax &&
                MathJax.startup &&
                MathJax.startup.promise
            ) {

                MathJax.startup.promise
                    .then(resolve)
                    .catch(resolve);

                return;

            }

            setTimeout(
                check,
                30
            );

        };

        check();

    });

}


/* =====================================================
   CURRENT
===================================================== */

function getCurrent() {

    return problems.find(
        p => p.id === currentId
    );

}


/* =====================================================
   LOAD
===================================================== */

function loadProblem(id) {

    const p =
        problems.find(
            x => x.id === id
        );

    if(!p) return;


    currentId = id;

    currentType =
        p.type || "multiple";


    document.getElementById(
        "number"
    ).value =
        p.number ?? 1;


    document.getElementById(
        "score"
    ).value =
        p.score ?? 0;


    document.getElementById(
        "question"
    ).value =
        p.question || "";


    document.getElementById(
        "answer"
    ).value =
        p.shortAnswer || "";


    renderChoices(
        Array.isArray(p.choices)
            ? p.choices
            : ["","","","",""]
    );


    updateTypeButtons();

    renderList();

    scheduleRender();

}


/* =====================================================
   FORM
===================================================== */

function readForm() {

    return {

        number:
            Number(
                document.getElementById(
                    "number"
                ).value
            ) || 1,

        score:
            Number(
                document.getElementById(
                    "score"
                ).value
            ) || 0,

        type:
            currentType,

        question:
            document.getElementById(
                "question"
            ).value,

        choices:
            getChoices(),

        shortAnswer:
            document.getElementById(
                "answer"
            ).value

    };

}


/* =====================================================
   SAVE
===================================================== */

function save(showToast=false) {

    const p =
        getCurrent();

    if(!p) return;


    Object.assign(
        p,
        readForm()
    );


    localStorage.setItem(
        "mathforge-data",
        JSON.stringify(
            problems
        )
    );


    setSaved();

    renderList();


    if(showToast) {
        toast(
            "저장되었습니다."
        );
    }

}


/* =====================================================
   AUTO SAVE
===================================================== */

function autoSave() {

    setDirty();

    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            () => save(false),
            500
        );

}


/* =====================================================
   STATUS
===================================================== */

function setDirty() {

    document.getElementById(
        "status"
    ).innerHTML =
        `
        <span class="dot dirty"></span>
        <span>저장 중...</span>
        `;

}


function setSaved() {

    document.getElementById(
        "status"
    ).innerHTML =
        `
        <span class="dot"></span>
        <span>저장됨</span>
        `;

}


/* =====================================================
   TYPE
===================================================== */

function setType(type) {

    currentType = type;

    updateTypeButtons();

    autoSave();

    scheduleRender();

}


function updateTypeButtons() {

    document
        .getElementById("multiple")
        .classList.toggle(
            "active",
            currentType === "multiple"
        );


    document
        .getElementById("short")
        .classList.toggle(
            "active",
            currentType === "short"
        );


    document
        .getElementById("choiceArea")
        .classList.toggle(
            "hidden",
            currentType !== "multiple"
        );


    document
        .getElementById("answerArea")
        .classList.toggle(
            "hidden",
            currentType !== "short"
        );

}


/* =====================================================
   CHOICES
===================================================== */

function renderChoices(values) {

    const box =
        document.getElementById(
            "choices"
        );

    box.innerHTML = "";


    values.forEach(
        (value,index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "choice-row";


            const radio =
                document.createElement(
                    "input"
                );

            radio.type =
                "radio";

            radio.name =
                "correct";


            const p =
                getCurrent();


            radio.checked =
                !!p &&
                p.answer === index;


            radio.onchange =
                () => {

                    if(p) {
                        p.answer = index;
                    }

                    autoSave();

                };


            const input =
                document.createElement(
                    "input"
                );

            input.type =
                "text";

            input.className =
                "choice-input";

            input.value =
                value;


            input.oninput =
                () => {

                    autoSave();

                    scheduleRender();

                };


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "remove";

            remove.textContent =
                "×";


            remove.onclick =
                () => {

                    const arr =
                        getChoices();

                    arr.splice(
                        index,
                        1
                    );


                    if(
                        arr.length === 0
                    ) {
                        arr.push("");
                    }


                    renderChoices(
                        arr
                    );

                    autoSave();

                    scheduleRender();

                };


            row.append(
                radio,
                input,
                remove
            );


            box.appendChild(
                row
            );

        }
    );

}


function getChoices() {

    return [
        ...document.querySelectorAll(
            "#choices input.choice-input"
        )
    ].map(
        input => input.value
    );

}


function addChoice() {

    const arr =
        getChoices();

    arr.push("");

    renderChoices(
        arr
    );

    autoSave();

}


/* =====================================================
   NEW
===================================================== */

function newProblem() {

    const p = {

        id:createId(),

        number:
            problems.length + 1,

        score:5,

        type:"multiple",

        question:"",

        choices:[
            "",
            "",
            "",
            "",
            ""
        ],

        answer:0,

        shortAnswer:""

    };


    problems.unshift(
        p
    );


    currentId =
        p.id;


    loadProblem(
        p.id
    );


    save(false);


    toast(
        "새 문제가 생성되었습니다."
    );

}


/* =====================================================
   DUPLICATE
===================================================== */

function duplicate() {

    const p =
        getCurrent();

    if(!p) return;


    const copy =
        JSON.parse(
            JSON.stringify(p)
        );


    copy.id =
        createId();


    copy.number =
        problems.length + 1;


    problems.unshift(
        copy
    );


    currentId =
        copy.id;


    loadProblem(
        copy.id
    );


    save(false);


    toast(
        "문제를 복제했습니다."
    );

}


/* =====================================================
   DELETE
===================================================== */

function removeProblem() {

    if(
        problems.length <= 1
    ) {

        toast(
            "최소 한 문제는 있어야 합니다."
        );

        return;

    }


    if(
        !confirm(
            "현재 문제를 삭제할까요?"
        )
    ) {
        return;
    }


    const index =
        problems.findIndex(
            p => p.id === currentId
        );


    problems.splice(
        index,
        1
    );


    const next =
        problems[
            Math.max(
                0,
                index - 1
            )
        ];


    currentId =
        next.id;


    loadProblem(
        currentId
    );


    save(false);

}


/* =====================================================
   LIST
===================================================== */

function renderList() {

    const list =
        document.getElementById(
            "problemList"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase();


    list.innerHTML = "";


    problems
        .filter(
            p => {

                const q =
                    String(
                        p.question || ""
                    )
                    .toLowerCase();


                return (
                    q.includes(search) ||
                    String(p.number)
                        .includes(search)
                );

            }
        )
        .forEach(
            p => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "problem";


                if(
                    p.id === currentId
                ) {
                    item.classList.add(
                        "active"
                    );
                }


                const title =
                    (p.question || "")
                        .replace(
                            /\n/g,
                            " "
                        )
                        .slice(
                            0,
                            45
                        );


                const titleElement =
                    document.createElement(
                        "div"
                    );

                titleElement.className =
                    "problem-title";


                titleElement.textContent =
                    `${p.number}. ${
                        title || "새 문제"
                    }`;


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "problem-meta";


                meta.textContent =
                    `${p.score}점 · ${
                        p.type === "short"
                        ? "주관식"
                        : "객관식"
                    }`;


                item.append(
                    titleElement,
                    meta
                );


                item.onclick =
                    () => loadProblem(
                        p.id
                    );


                list.appendChild(
                    item
                );

            }
        );

}


/* =====================================================
   핵심 렌더러
===================================================== */

/*
    여기서는 LaTeX를 "해석해서 고치는" 게 아니다.

    입력 문자열에서
    일반 텍스트와 수식 후보를 분리한 뒤

    수식 부분만

        \( ... \)

    로 MathJax에 넘긴다.

    수식 안의 LaTeX 문자열은 그대로 유지한다.
*/


function renderMixedText(parent,text) {

    /*
     * 먼저 사용자가 직접 \( ... \) 또는
     * \[ ... \]를 입력한 경우.
     */

    const explicitPattern =
        /\\\(([\s\S]*?)\\\)|\\\[([\s\S]*?)\\\]/g;


    let last = 0;

    let match;


    while(
        (match =
            explicitPattern.exec(text))
        !== null
    ) {

        appendPlain(
            parent,
            text.slice(
                last,
                match.index
            )
        );


        const latex =
            match[1] !== undefined
                ? match[1]
                : match[2];


        appendMath(
            parent,
            latex,
            match[2] !== undefined
        );


        last =
            match.index +
            match[0].length;

    }


    if(last > 0) {

        appendPlain(
            parent,
            text.slice(last)
        );

        return;

    }


    /*
     * 사용자가 $를 안 쓰는 방식.
     *
     * LaTeX 명령어부터 찾는다.
     *
     * \frac
     * \sqrt
     * \lim
     * \sum
     * \int
     * \alpha
     * ...
     */

    const latexCommand =
        /\\(?:frac|dfrac|tfrac|sqrt|lim|sum|prod|int|oint|sin|cos|tan|log|ln|exp|det|binom|alpha|beta|gamma|delta|epsilon|theta|lambda|mu|pi|sigma|phi|omega|infty|to|cdot|times|pm|leq|geq|neq|approx|left|right|mathbf|mathrm|mathbb|overline|underline|vec|hat|bar)\b/;


    const commandMatch =
        latexCommand.exec(text);


    if(commandMatch) {

        const before =
            text.slice(
                0,
                commandMatch.index
            );


        appendPlain(
            parent,
            before
        );


        const math =
            text.slice(
                commandMatch.index
            );


        appendMath(
            parent,
            math,
            false
        );


        return;

    }


    /*
     * 위첨자 / 아래첨자가 있는 식.
     *
     * x^2
     * a_n
     * x_{n+1}
     */

    const power =
        /[A-Za-z0-9)\]]\s*[\^_]/;


    const powerMatch =
        power.exec(text);


    if(powerMatch) {

        /*
         * 한글 문장 안에 있는 수식까지
         * 전부 수식으로 만들지 않도록
         * 수식 시작점을 찾는다.
         */

        const start =
            findMathStart(
                text,
                powerMatch.index
            );


        appendPlain(
            parent,
            text.slice(
                0,
                start
            )
        );


        appendMath(
            parent,
            text.slice(start),
            false
        );


        return;

    }


    /*
     * 함수 형태
     *
     * f(x)
     * f(1)
     * f(2)
     * g(t)
     * F(x)
     *
     * 숫자도 정상적으로 인식한다.
     */

    const functionPattern =
        /[A-Za-z]\s*\([^()\n]*\)/g;


    const functionMatches =
        [...text.matchAll(
            functionPattern
        )];


    if(functionMatches.length) {

        let position = 0;


        for(
            const m of functionMatches
        ) {

            const start =
                m.index;


            appendPlain(
                parent,
                text.slice(
                    position,
                    start
                )
            );


            /*
             * 함수 뒤에 = 식이 붙어 있으면
             * 같은 수식으로 묶는다.
             *
             * f(x)=x^2+1
             */

            let math =
                m[0];


            const after =
                text.slice(
                    start +
                    m[0].length
                );


            const equation =
                after.match(
                    /^=([A-Za-z0-9+\-*/().^_\s]+)/ 
                );


            if(equation) {

                math +=
                    equation[0];

                position =
                    start +
                    m[0].length +
                    equation[0].length;

            } else {

                position =
                    start +
                    m[0].length;

            }


            appendMath(
                parent,
                math,
                false
            );

        }


        appendPlain(
            parent,
            text.slice(position)
        );


        return;

    }


    /*
     * 일반적인 수식만 있는 경우.
     *
     * x+1
     * 2x
     * 3a-2
     * a=b
     */

    if(
        isStandaloneMath(text)
    ) {

        appendMath(
            parent,
            text.trim(),
            false
        );

        return;

    }


    /*
     * 아무 수식도 없으면 일반 텍스트.
     */

    appendPlain(
        parent,
        text
    );

}


/* =====================================================
   일반 텍스트
===================================================== */

function appendPlain(parent,text) {

    if(!text) return;

    parent.appendChild(
        document.createTextNode(
            text
        )
    );

}


/* =====================================================
   수식
===================================================== */

function appendMath(
    parent,
    latex,
    display
) {

    const span =
        document.createElement(
            "span"
        );


    if(display) {

        span.textContent =
            "\\[" +
            latex +
            "\\]";

    } else {

        span.textContent =
            "\\(" +
            latex +
            "\\)";

    }


    parent.appendChild(
        span
    );

}


/* =====================================================
   수식 시작점
===================================================== */

function findMathStart(
    text,
    index
) {

    let i = index;


    while(i > 0) {

        const c =
            text[i - 1];


        if(
            /[\s,;:!?]/.test(c)
        ) {
            break;
        }


        if(
            /[가-힣]/.test(c)
        ) {
            break;
        }


        i--;

    }


    return i;

}


/* =====================================================
   단독 수식
===================================================== */

function isStandaloneMath(text) {

    const s =
        text.trim();


    if(!s) {
        return false;
    }


    /*
     * 한글이 들어가면 일반 글씨.
     */

    if(
        /[가-힣]/.test(s)
    ) {
        return false;
    }


    /*
     * 명백한 수학식.
     */

    if(
        /^[A-Za-z0-9πθφαβγδ]+
        [A-Za-z0-9πθφαβγδ\s+\-*/=<>.^_()[\]{}]*$/x
    ) {
        return true;
    }


    return false;

}


/* =====================================================
   PREVIEW
===================================================== */

async function renderPreview() {

    const token =
        ++renderToken;


    const preview =
        document.getElementById(
            "preview"
        );


    const data =
        readForm();


    preview.innerHTML = "";


    /*
     * 번호 / 배점
     */

    const info =
        document.createElement(
            "div"
        );


    info.style.fontSize =
        "13px";

    info.style.color =
        "var(--muted)";

    info.style.marginBottom =
        "18px";


    info.textContent =
        `${data.number}번 · ${data.score}점`;


    preview.appendChild(
        info
    );


    /*
     * 문제
     */

    const question =
        document.createElement(
            "div"
        );


    question.className =
        "problem-text";


    const lines =
        data.question.split(
            "\n"
        );


    lines.forEach(
        line => {

            const lineElement =
                document.createElement(
                    "div"
                );


            lineElement.className =
                "preview-line";


            renderMixedText(
                lineElement,
                line
            );


            question.appendChild(
                lineElement
            );

        }
    );


    preview.appendChild(
        question
    );


    /*
     * 선택지
     */

    if(
        data.type === "multiple"
    ) {

        const choices =
            document.createElement(
                "div"
            );


        choices.className =
            "choices-preview";


        data.choices.forEach(
            (choice,index) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "choice-preview";


                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "choice-number";


                number.textContent =
                    index + 1;


                const content =
                    document.createElement(
                        "div"
                    );


                content.className =
                    "problem-text";


                renderMixedText(
                    content,
                    choice
                );


                row.append(
                    number,
                    content
                );


                choices.appendChild(
                    row
                );

            }
        );


        preview.appendChild(
            choices
        );

    }


    /*
     * 주관식
     */

    if(
        data.type === "short"
    ) {

        const answer =
            document.createElement(
                "div"
            );


        answer.style.marginTop =
            "25px";


        answer.textContent =
            "답: __________________";


        preview.appendChild(
            answer
        );

    }


    /*
     * MathJax
     */

    if(
        !window.MathJax ||
        !MathJax.typesetPromise
    ) {
        return;
    }


    try {

        await MathJax.typesetPromise(
            [preview]
        );

    } catch(error) {

        console.error(
            "MathJax error:",
            error
        );

    }


    /*
     * 오래된 렌더링 결과가
     * 최신 입력을 덮어쓰지 않게 한다.
     */

    if(
        token !== renderToken
    ) {

        return;

    }

}


/* =====================================================
   RENDER DELAY
===================================================== */

function scheduleRender() {

    clearTimeout(
        renderTimer
    );


    renderTimer =
        setTimeout(
            renderPreview,
            80
        );

}


/* =====================================================
   INSERT
===================================================== */

function insertLatex(text) {

    const textarea =
        document.getElementById(
            "question"
        );


    const start =
        textarea.selectionStart;


    const end =
        textarea.selectionEnd;


    textarea.setRangeText(
        text,
        start,
        end,
        "end"
    );


    textarea.focus();


    autoSave();

    scheduleRender();

}


/* =====================================================
   DARK
===================================================== */

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "mathforge-dark",
        document.body.classList.contains(
            "dark"
        )
    );

}


/* =====================================================
   TOAST
===================================================== */

function toast(message) {

    const element =
        document.getElementById(
            "toast"
        );


    element.textContent =
        message;


    element.classList.add(
        "show"
    );


    setTimeout(
        () => {

            element.classList.remove(
                "show"
            );

        },
        1500
    );

}


/* =====================================================
   EVENTS
===================================================== */

[
    "number",
    "score",
    "question",
    "answer"
].forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(
                "input",
                () => {

                    autoSave();

                    scheduleRender();

                }
            );

    }
);


document
    .getElementById("search")
    .addEventListener(
        "input",
        renderList
    );


/* =====================================================
   DARK INIT
===================================================== */

if(
    localStorage.getItem(
        "mathforge-dark"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}


/* =====================================================
   START
===================================================== */

init();

</script>
