<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MathForge</title>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']],
    processEscapes: false,
    processEnvironments: true
  },
  options: {
    skipHtmlTags: ['script','noscript','style','textarea','pre','code']
  },
  svg: {
    fontCache: 'global'
  }
};
</script>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f6f8;
  --panel:#fff;
  --text:#171717;
  --muted:#737373;
  --border:#ddd;
  --accent:#4f46e5;
  --danger:#ef4444;
}

body.dark{
  --bg:#111216;
  --panel:#191a1f;
  --text:#f5f5f5;
  --muted:#aaa;
  --border:#30323a;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}

header{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:19px;
  font-weight:800;
}

.logo span{color:var(--accent)}

.header-right{
  display:flex;
  gap:7px;
  align-items:center;
}

button{font:inherit}

.btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:8px 11px;
  border-radius:8px;
  cursor:pointer;
}

.btn:hover{border-color:var(--accent)}

.primary{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.status{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  color:var(--muted);
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#16a34a;
}

.dot.dirty{background:#f59e0b}

.layout{
  max-width:1500px;
  margin:auto;
  padding:8px;
  display:grid;
  grid-template-columns:210px minmax(0,1fr) minmax(0,1fr);
  gap:7px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}

.panel-header{
  height:45px;
  padding:0 13px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:14px;
  font-weight:750;
}

.panel-body{padding:12px}

.field{margin-bottom:12px}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

input,textarea{
  width:100%;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px;
  outline:none;
}

input:focus,textarea:focus{
  border-color:var(--accent);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

#question{
  min-height:500px;
  resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px;
  line-height:1.8;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:6px;
}

.tool{
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:6px;
  padding:6px 9px;
  cursor:pointer;
  font-size:12px;
}

.tool:hover{
  color:var(--accent);
  border-color:var(--accent);
}

.preview{
  min-height:650px;
  padding:20px;
  overflow-x:auto;
  font-size:17px;
  line-height:2;
}

.preview-line{
  min-height:1.8em;
  white-space:normal;
}

.problem-list{
  max-height:calc(100vh - 105px);
  overflow-y:auto;
}

.search{margin-bottom:8px}

.problem{
  padding:10px 12px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.problem:hover{background:var(--bg)}

.problem.active{
  background:rgba(79,70,229,.1);
}

.problem-title{
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.problem-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.types{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.type{
  padding:8px;
  border:1px solid var(--border);
  border-radius:7px;
  background:var(--panel);
  color:var(--text);
  cursor:pointer;
}

.type.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.choice-row{
  display:flex;
  gap:6px;
  margin-bottom:6px;
  align-items:center;
}

.choice-row input[type=text]{flex:1}

.choice-row input[type=radio]{
  width:auto;
}

.remove{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--danger);
  border-radius:7px;
  cursor:pointer;
}

.choices-preview{
  margin-top:25px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.choice-preview{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.choice-number{
  width:25px;
  min-width:25px;
  height:25px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

.hidden{display:none}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  background:#222;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  transition:.2s;
  pointer-events:none;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.math-error{
  color:var(--danger);
  text-decoration:underline wavy var(--danger);
}

@media(max-width:1100px){
  .layout{
    grid-template-columns:200px minmax(0,1fr);
  }

  .preview-panel{
    grid-column:1/-1;
  }
}

@media(max-width:700px){
  .layout{
    display:flex;
    flex-direction:column;
  }

  .preview-panel{order:3}
}
</style>
</head>

<body>

<header>
  <div class="logo">Math<span>Forge</span></div>

  <div class="header-right">
    <div class="status" id="status">
      <span class="dot"></span>
      <span>저장됨</span>
    </div>

    <button class="btn" onclick="newProblem()">＋ 새 문제</button>
    <button class="btn" onclick="toggleDark()">◐</button>
  </div>
</header>

<div class="layout">

<section class="panel">

  <div class="panel-header">
    <div class="title">문제</div>
    <button class="btn" onclick="newProblem()">＋</button>
  </div>

  <div class="panel-body">
    <input id="search" class="search" placeholder="문제 검색">
  </div>

  <div id="problemList" class="problem-list"></div>

</section>


<section class="panel">

  <div class="panel-header">
    <div class="title">문제 입력</div>
  </div>

  <div class="panel-body">

    <div class="row">

      <div class="field">
        <label>번호</label>
        <input id="number" type="number">
      </div>

      <div class="field">
        <label>배점</label>
        <input id="score" type="number">
      </div>

    </div>


    <div class="field">

      <label>문제 유형</label>

      <div class="types">

        <button
          id="multiple"
          class="type active"
          onclick="setType('multiple')">
          객관식
        </button>

        <button
          id="short"
          class="type"
          onclick="setType('short')">
          주관식
        </button>

      </div>

    </div>


    <div class="field">

      <label>문제</label>

      <div class="toolbar">

        <button class="tool" onclick="insertAtCursor('\\frac{}{}')">
          분수
        </button>

        <button class="tool" onclick="insertAtCursor('\\sqrt{}')">
          √
        </button>

        <button class="tool" onclick="insertAtCursor('\\lim_{n\\to\\infty}')">
          lim
        </button>

        <button class="tool" onclick="insertAtCursor('\\sum_{k=1}^{n}')">
          Σ
        </button>

        <button class="tool" onclick="insertAtCursor('\\int_0^1')">
          ∫
        </button>

        <button class="tool" onclick="insertAtCursor('x^2')">
          x²
        </button>

        <button class="tool" onclick="insertAtCursor('\\pi')">
          π
        </button>

      </div>

      <textarea
        id="question"
        spellcheck="false"
        placeholder="문제를 입력하세요."
      ></textarea>

    </div>


    <div id="choiceArea" class="field">

      <label>선택지</label>

      <div id="choices"></div>

      <button class="btn" onclick="addChoice()">
        ＋ 선택지
      </button>

    </div>


    <div id="answerArea" class="field hidden">

      <label>정답</label>

      <input id="answer" placeholder="정답">

    </div>


    <div style="display:flex;gap:6px">

      <button class="btn primary" onclick="save(true)">
        저장
      </button>

      <button class="btn" onclick="duplicate()">
        복제
      </button>

      <button class="btn" onclick="removeProblem()">
        삭제
      </button>

    </div>

  </div>

</section>


<section class="panel preview-panel">

  <div class="panel-header">

    <div class="title">미리보기</div>

    <div style="font-size:11px;color:#16a34a">
      LIVE
    </div>

  </div>

  <div id="preview" class="preview"></div>

</section>

</div>

<div id="toast" class="toast"></div>


<script>

let problems=[];
let currentId=null;
let currentType="multiple";
let saveTimer=null;
let renderTimer=null;


/* =========================
   INIT
========================= */

function init(){

  try{
    const saved=localStorage.getItem("mathforge-problems");

    if(saved){
      problems=JSON.parse(saved);
    }
  }catch(e){
    problems=[];
  }

  if(!Array.isArray(problems) || problems.length===0){

    problems=[{
      id:Date.now(),
      number:1,
      score:5,
      type:"multiple",

      question:
`실수 x에 대하여
f(x)=\\frac{2x-1}{x+2} f(x)의 값을 구하여라.`,

      choices:["0","1","2","3","4"],
      answer:1,
      shortAnswer:""
    }];
  }

  currentId=problems[0].id;

  loadProblem(currentId);
  renderList();

  if(localStorage.getItem("mathforge-dark")==="true"){
    document.body.classList.add("dark");
  }

  waitMathJax().then(renderPreview);
}


/* =========================
   MATHJAX
========================= */

function waitMathJax(){

  return new Promise(resolve=>{

    function check(){

      if(
        window.MathJax &&
        MathJax.startup &&
        MathJax.startup.promise
      ){
        MathJax.startup.promise
          .then(resolve)
          .catch(resolve);
      }else{
        setTimeout(check,50);
      }

    }

    check();

  });
}


/* =========================
   CURRENT
========================= */

function current(){

  return problems.find(
    p=>p.id===currentId
  );

}


/* =========================
   LOAD
========================= */

function loadProblem(id){

  const p=problems.find(
    x=>x.id===id
  );

  if(!p)return;

  currentId=id;
  currentType=p.type||"multiple";

  number.value=p.number||1;
  score.value=p.score||0;
  question.value=p.question||"";
  answer.value=p.shortAnswer||"";

  renderChoices(p.choices||[]);
  updateTypeButtons();
  renderList();
  renderPreview();
}


/* =========================
   FORM
========================= */

function readForm(){

  return{
    number:Number(number.value)||1,
    score:Number(score.value)||0,
    type:currentType,
    question:question.value,
    choices:[...document.querySelectorAll(".choice-input")]
      .map(x=>x.value),
    shortAnswer:answer.value
  };

}


/* =========================
   SAVE
========================= */

function save(show=false){

  const p=current();

  if(!p)return;

  Object.assign(p,readForm());

  localStorage.setItem(
    "mathforge-problems",
    JSON.stringify(problems)
  );

  savedStatus();
  renderList();

  if(show)toast("저장되었습니다.");
}


function autoSave(){

  dirtyStatus();

  clearTimeout(saveTimer);

  saveTimer=setTimeout(
    ()=>save(false),
    400
  );

}


function dirtyStatus(){

  status.innerHTML=
  `<span class="dot dirty"></span><span>저장 중...</span>`;

}


function savedStatus(){

  status.innerHTML=
  `<span class="dot"></span><span>저장됨</span>`;

}


/* =========================
   TYPE
========================= */

function setType(type){

  currentType=type;

  updateTypeButtons();

  renderPreview();

  autoSave();

}


function updateTypeButtons(){

  multiple.classList.toggle(
    "active",
    currentType==="multiple"
  );

  short.classList.toggle(
    "active",
    currentType==="short"
  );

  choiceArea.classList.toggle(
    "hidden",
    currentType!=="multiple"
  );

  answerArea.classList.toggle(
    "hidden",
    currentType!=="short"
  );

}


/* =========================
   CHOICES
========================= */

function renderChoices(values){

  choices.innerHTML="";

  values.forEach((value,index)=>{

    const row=document.createElement("div");
    row.className="choice-row";

    const radio=document.createElement("input");
    radio.type="radio";
    radio.name="correct";

    const p=current();

    radio.checked=
      p &&
      p.answer===index;

    radio.onchange=()=>{

      if(p)p.answer=index;

      autoSave();
      renderPreview();

    };


    const input=document.createElement("input");

    input.type="text";
    input.className="choice-input";
    input.value=value;

    input.oninput=()=>{
      renderPreview();
      autoSave();
    };


    const remove=document.createElement("button");

    remove.className="remove";
    remove.textContent="×";

    remove.onclick=()=>{

      const arr=getChoices();

      arr.splice(index,1);

      if(arr.length===0)arr.push("");

      renderChoices(arr);
      renderPreview();
      autoSave();

    };


    row.append(
      radio,
      input,
      remove
    );

    choices.appendChild(row);

  });

}


function getChoices(){

  return [...document.querySelectorAll(".choice-input")]
    .map(x=>x.value);

}


function addChoice(){

  const arr=getChoices();

  arr.push("");

  renderChoices(arr);
  autoSave();

}


/* =========================
   NEW
========================= */

function newProblem(){

  const p={
    id:Date.now()+Math.random(),
    number:problems.length+1,
    score:5,
    type:"multiple",
    question:"",
    choices:["","","","",""],
    answer:0,
    shortAnswer:""
  };

  problems.unshift(p);

  currentId=p.id;

  loadProblem(p.id);
  save(false);

  toast("새 문제가 생성되었습니다.");

}


/* =========================
   DUPLICATE
========================= */

function duplicate(){

  const p=current();

  if(!p)return;

  const copy=JSON.parse(JSON.stringify(p));

  copy.id=Date.now()+Math.random();
  copy.number=problems.length+1;

  problems.unshift(copy);

  currentId=copy.id;

  loadProblem(copy.id);
  save(false);

  toast("문제를 복제했습니다.");

}


/* =========================
   DELETE
========================= */

function removeProblem(){

  if(problems.length<=1){

    toast("최소 한 문제는 있어야 합니다.");
    return;

  }

  if(!confirm("현재 문제를 삭제할까요?"))return;

  const index=problems.findIndex(
    p=>p.id===currentId
  );

  problems.splice(index,1);

  const next=
    problems[Math.max(0,index-1)];

  currentId=next.id;

  loadProblem(currentId);
  save(false);

}


/* =========================
   LIST
========================= */

function renderList(){

  const q=search.value.toLowerCase();

  problemList.innerHTML="";

  problems
    .filter(p=>
      String(p.number).includes(q) ||
      String(p.question||"").toLowerCase().includes(q)
    )
    .forEach(p=>{

      const item=document.createElement("div");

      item.className="problem";

      if(p.id===currentId)
        item.classList.add("active");

      const title=(p.question||"새 문제")
        .replace(/\n/g," ")
        .slice(0,45);

      item.innerHTML=`
        <div class="problem-title">
          ${p.number}. ${escapeHTML(title)}
        </div>
        <div class="problem-meta">
          ${p.score}점 · ${p.type==="short"?"주관식":"객관식"}
        </div>
      `;

      item.onclick=()=>loadProblem(p.id);

      problemList.appendChild(item);

    });

}


/* =====================================================
   핵심 렌더러
===================================================== */

/*
   사용자가 $를 입력하지 않아도 된다.

   핵심적으로 한 줄을 문자 단위로 검사하면서
   LaTeX 명령이 시작되는 위치를 찾는다.

   예:

   실수 x에 대하여
   f(x)=\frac{2x-1}{x+2} f(x)

   ↓

   실수 x에 대하여
   [f(x)=\frac{2x-1}{x+2} f(x)]

   처럼 수식 영역을 만들어 MathJax에 넘긴다.
*/


const latexCommands=
/\\(?:frac|dfrac|tfrac|sqrt|lim|sum|prod|int|oint|sin|cos|tan|cot|sec|csc|log|ln|exp|det|binom|begin|end|left|right|mathbb|mathbf|mathrm|mathit|text|overline|underline|vec|hat|bar|alpha|beta|gamma|delta|epsilon|varepsilon|theta|lambda|mu|sigma|pi|rho|tau|phi|varphi|omega|infty|to|cdot|times|pm|mp|le|ge|neq|approx|equiv|partial|nabla)\b/;


/*
   수식에 포함될 가능성이 높은 문자열.
*/
function containsMath(line){

  if(latexCommands.test(line))return true;

  if(/[A-Za-z]\s*\([^()\n]*\)/.test(line))return true;

  if(/[A-Za-z0-9πθ]\s*[\^_]/.test(line))return true;

  if(/\d+\s*[A-Za-z]/.test(line))return true;

  if(/[A-Za-z]\s*[=<>±+\-*/]\s*[A-Za-z0-9]/.test(line))
    return true;

  return false;
}


/*
   한 줄 전체를 MathJax가 처리하도록 한다.

   한글은 일반 텍스트로,
   수학 부분은 MathJax가 인식할 수 있게
   \(...\)로 감싼다.

   기존 코드처럼 f(x)만 따로 잘라내지 않는다.
*/

function convertLine(line){

  if(!line)return "";

  /*
     사용자가 이미 \( \)를 넣은 경우
     그대로 사용.
  */

  if(
    line.includes("\\(") ||
    line.includes("\\[")
  ){
    return line;
  }


  if(!containsMath(line))
    return escapeHTML(line);


  /*
     LaTeX 명령이 들어간 경우
     명령이 시작되는 위치를 기준으로
     앞의 일반 문장과 뒤의 수식을 분리한다.
  */

  const commandMatch=line.match(latexCommands);

  if(commandMatch){

    const index=commandMatch.index;

    /*
       명령 앞쪽에 f(x)= 같은 수식이 있을 수 있다.
       따라서 앞부분에서 마지막 공백을 기준으로
       수식 시작점을 찾는다.
    */

    let start=index;

    const before=line.slice(0,index);

    const mathStart=before.search(
      /(?:[A-Za-z]\s*\([^()\n]*\)|[A-Za-z0-9πθ])\s*(?:=|[+\-*/^_])/
    );

    if(mathStart>=0)
      start=mathStart;

    const textPart=line.slice(0,start);
    const mathPart=line.slice(start);

    return (
      escapeHTML(textPart)+
      "\\("+mathPart+"\\)"
    );
  }


  /*
     LaTeX 명령이 없지만

     f(x)
     f(1)
     f(2)
     f(x)=...
     2x
     x^2

     등이 있는 경우.

     한글 문장 속에서도 정상 처리한다.
  */

  const functionMatch=line.match(
    /[A-Za-z]\s*\([^()\n]*\)/
  );

  if(functionMatch){

    const start=functionMatch.index;

    /*
       함수 앞에 한글이 있는 경우
       함수부터 수식으로 시작.
    */

    let end=start+functionMatch[0].length;

    /*
       뒤에 = 수식이 이어지면 끝까지 수식.
    */

    const rest=line.slice(end);

    const equationMatch=rest.match(
      /^\s*(?:=|[+\-*/])\s*(?:\\[A-Za-z]+|[A-Za-z0-9πθ{}().+\-*/^_=]+)/
    );

    if(equationMatch)
      end+=equationMatch[0].length;


    /*
       뒤에 또 f(x), f(1) 등이 붙어 있으면
       같은 수식 영역으로 처리.
    */

    const after=line.slice(end);

    const nextFunction=after.match(
      /^\s*[A-Za-z]\s*\([^()\n]*\)/
    );

    if(nextFunction)
      end+=nextFunction[0].length;


    return(
      escapeHTML(line.slice(0,start))+
      "\\("+line.slice(start,end)+"\\)"+
      escapeHTML(line.slice(end))
    );
  }


  /*
     전체가 수학식인 경우
  */

  if(
    /^[A-Za-z0-9πθ\s.+\-*/=<>^_()[\]{}]+$/.test(line)
  ){
    return "\\("+line+"\\)";
  }


  return escapeHTML(line);
}


/* =========================
   PREVIEW
========================= */

async function renderPreview(){

  const data=readForm();

  preview.innerHTML="";


  const info=document.createElement("div");

  info.style.fontSize="13px";
  info.style.color="var(--muted)";
  info.style.marginBottom="15px";

  info.textContent=
    `${data.number}번 · ${data.score}점`;

  preview.appendChild(info);


  const questionBox=document.createElement("div");

  const lines=data.question.split("\n");

  lines.forEach(line=>{

    const div=document.createElement("div");

    div.className="preview-line";

    /*
       innerHTML은 사용자 입력 전체에 직접 사용하지 않는다.
       convertLine에서 텍스트 부분은 escapeHTML 처리한다.
    */

    div.innerHTML=convertLine(line);

    questionBox.appendChild(div);

  });

  preview.appendChild(questionBox);


  if(data.type==="multiple"){

    const box=document.createElement("div");

    box.className="choices-preview";

    data.choices.forEach((choice,index)=>{

      const row=document.createElement("div");

      row.className="choice-preview";

      const n=document.createElement("div");

      n.className="choice-number";
      n.textContent=index+1;

      const content=document.createElement("div");

      content.innerHTML=convertLine(choice);

      row.append(n,content);

      box.appendChild(row);

    });

    preview.appendChild(box);
  }


  if(data.type==="short"){

    const answerBox=document.createElement("div");

    answerBox.style.marginTop="25px";
    answerBox.textContent=
      "답: __________________";

    preview.appendChild(answerBox);

  }


  if(window.MathJax){

    try{

      await MathJax.typesetPromise([preview]);

    }catch(error){

      console.error(error);

    }

  }

}


/* =========================
   INSERT
========================= */

function insertAtCursor(text){

  const el=question;

  const start=el.selectionStart;
  const end=el.selectionEnd;

  el.value=
    el.value.slice(0,start)+
    text+
    el.value.slice(end);

  el.focus();

  const pos=start+text.length;

  el.selectionStart=pos;
  el.selectionEnd=pos;

  renderPreview();
  autoSave();

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   DARK
========================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "mathforge-dark",
    document.body.classList.contains("dark")
  );

}


/* =========================
   TOAST
========================= */

function toast(message){

  const t=document.getElementById("toast");

  t.textContent=message;

  t.classList.add("show");

  setTimeout(
    ()=>t.classList.remove("show"),
    1500
  );

}


/* =========================
   EVENTS
========================= */

[
  number,
  score,
  question,
  answer
].forEach(el=>{

  el.addEventListener("input",()=>{

    clearTimeout(renderTimer);

    renderTimer=setTimeout(
      ()=>renderPreview(),
      20
    );

    autoSave();

  });

});


search.addEventListener(
  "input",
  renderList
);


/* =========================
   START
========================= */

init();
